name: Publish SDKs

# Never `on: release`: GitHub does not start workflows from events raised by GITHUB_TOKEN.
on:
  # Own tag trigger, never workflow_call: npm's Trusted Publisher checks the workflow that entered the run.
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      sdk:
        description: 'SDK to publish (node, python, php, mcp, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - node
          - python
          - php
          - mcp
      ref:
        description: 'Tag to publish from, e.g. v2.7.0 (defaults to this branch)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Node.js SDK to npm (@railhook/node)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing + --provenance
    if: >
      github.event_name == 'push' ||
      inputs.sdk == 'all' ||
      inputs.sdk == 'node'
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 22: npm@latest, needed for Trusted Publishing, requires ^20.17 || >=22.9.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check version drift
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @railhook/node version 2>/dev/null || echo "")
          echo "local=$LOCAL_VERSION published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: npm ci

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: npm run build

      # Trusted Publishing needs npm >= 11.5.1, newer than setup-node ships.
      - name: Upgrade npm for Trusted Publishing
        if: steps.check.outputs.should_publish == 'true'
        run: npm install -g npm@latest

      # Needs a Trusted Publisher on npmjs.com (this repo, publish-sdks.yml); NPM_TOKEN is only the fallback.
      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Needs its own Trusted Publisher on npmjs.com before the first OIDC publish.
  publish-mcp:
    name: Publish MCP bridge to npm (@railhook/mcp)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing + --provenance
    if: >
      github.event_name == 'push' ||
      inputs.sdk == 'all' ||
      inputs.sdk == 'mcp'
    defaults:
      run:
        working-directory: sdks/mcp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check version drift
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @railhook/mcp version 2>/dev/null || echo "")
          echo "local=$LOCAL_VERSION published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: npm ci

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: npm run build

      - name: Upgrade npm for Trusted Publishing
        if: steps.check.outputs.should_publish == 'true'
        run: npm install -g npm@latest

      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The registry checks the npm package's mcpName, so the package must be on npm first.
  publish-mcp-registry:
    name: Publish to the MCP Registry
    needs: publish-mcp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: >
      github.event_name == 'push' ||
      inputs.sdk == 'all' ||
      inputs.sdk == 'mcp'
    defaults:
      run:
        working-directory: sdks/mcp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Wait for the npm package this entry points at
        run: |
          VERSION=$(node -p "require('./server.json').packages[0].version")
          for i in $(seq 1 30); do
            if npm view "@railhook/mcp@$VERSION" version >/dev/null 2>&1; then exit 0; fi
            sleep 20
          done
          echo "::error::@railhook/mcp@$VERSION is not on npm"; exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        # A re-run for a version already listed is not a failure.
        run: |
          set +e
          OUTPUT=$(./mcp-publisher publish 2>&1); STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ] && echo "$OUTPUT" | grep -qi "already exists"; then exit 0; fi
          exit $STATUS

  publish-python:
    name: Publish Python SDK to PyPI (railhook)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      inputs.sdk == 'all' ||
      inputs.sdk == 'python'
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check version drift
        id: check
        run: |
          LOCAL_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PUBLISHED_VERSION=$(curl -s https://pypi.org/pypi/railhook/json | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('info',{}).get('version',''))" 2>/dev/null || echo "")
          echo "local=$LOCAL_VERSION published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: |
          pip install build twine
          pip install -e ".[dev]"

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: pytest

      - name: Build package
        if: steps.check.outputs.should_publish == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.should_publish == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

  publish-php:
    name: Publish PHP SDK to Packagist (railhook/php)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      inputs.sdk == 'all' ||
      inputs.sdk == 'php'
    defaults:
      run:
        working-directory: sdks/php
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check version drift
        id: check
        run: |
          LOCAL_VERSION=$(php -r "echo json_decode(file_get_contents('composer.json'), true)['version'] ?? '';")
          PUBLISHED_VERSION=$(curl -s https://repo.packagist.org/p2/railhook/php.json | php -r "
            \$d = json_decode(file_get_contents('php://stdin'), true);
            \$versions = \$d['packages']['railhook/php'] ?? [];
            echo \$versions[0]['version'] ?? '';
          ")
          echo "local=$LOCAL_VERSION published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: vendor/bin/phpunit --no-coverage

      # Packagist cannot serve a subdirectory, so the SDK goes to a split repo via a deploy key scoped to it.
      - name: Publish sdks/php to the split repository
        if: steps.check.outputs.should_publish == 'true'
        working-directory: .
        env:
          SDK_SPLIT_SSH_KEY: ${{ secrets.SDK_SPLIT_SSH_KEY }}
          SPLIT_REPO: vadymkykalo/railhook-php
        run: |
          set -euo pipefail

          if [ -z "${SDK_SPLIT_SSH_KEY:-}" ]; then
            echo "::error::SDK_SPLIT_SSH_KEY is not set, so the PHP SDK cannot be published. See the comment above this step."
            exit 1
          fi

          VERSION=$(php -r "echo json_decode(file_get_contents('sdks/php/composer.json'), true)['version'] ?? '';")
          [ -n "$VERSION" ] || { echo "::error::no version in sdks/php/composer.json"; exit 1; }

          # On disk rather than in ssh-agent: the agent would outlive this step.
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SDK_SPLIT_SSH_KEY" > ~/.ssh/sdk_split
          chmod 600 ~/.ssh/sdk_split
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/sdk_split -o IdentitiesOnly=yes"

          git clone --depth 1 "git@github.com:${SPLIT_REPO}.git" split
          cd split

          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q .; then
            echo "Tag ${VERSION} already exists in ${SPLIT_REPO}; nothing to push."
            exit 0
          fi

          # .gitignore is the split repository's own and survives the sweep.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .gitignore -exec rm -rf {} +
          cp -r ../sdks/php/src ../sdks/php/tests ../sdks/php/README.md \
                ../sdks/php/composer.json ../sdks/php/composer.lock ../sdks/php/phpunit.xml .

          # Packagist takes the version from the tag; the monorepo keeps the field for check-version-drift.sh.
          php -r '
            $f = "composer.json";
            $c = json_decode(file_get_contents($f), true);
            unset($c["version"]);
            file_put_contents($f, json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content change; tagging the existing HEAD as ${VERSION}."
          else
            git commit -m "Release ${VERSION}"
          fi
          git tag "${VERSION}"
          git push origin HEAD:main --tags

      - name: Trigger Packagist update
        if: steps.check.outputs.should_publish == 'true'
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PACKAGIST_TOKEN:-}" ] || [ -z "${PACKAGIST_USERNAME:-}" ]; then
            echo "::error::PACKAGIST_USERNAME / PACKAGIST_TOKEN are not set, so Packagist will not re-crawl."
            exit 1
          fi

          RESPONSE=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}&autoUpdated=1" \
            -d '{"repository":{"url":"https://github.com/vadymkykalo/railhook-php"}}')

          echo "Packagist responded: $RESPONSE"

          if ! echo "$RESPONSE" | grep -q '"status" *: *"success"'; then
            echo "::error::Packagist did not accept the update. Check that railhook/php is registered against vadymkykalo/railhook-php."
            exit 1
          fi
