name: Publish SDKs

# NOTE: this workflow used to fire an unconditional `npm publish` /
# `twine upload` on *every* GitHub release, including CLI-only releases that
# never touch sdks/. That fails with "version already exists" the moment an
# SDK's manifest version wasn't bumped for that release. Every publish job
# below now starts with a "Check version drift" step that compares the
# manifest version in this checkout against the version currently live on
# the registry, and skips the rest of the job (build/publish) when they
# match. Real releases still work exactly as before; no-op releases for a
# given SDK now no-op instead of failing.

# NOTE 2: `on: release: [published]` is deliberately NOT used, and must not be
# added back. The v2.3.0 and v2.4.0 releases are created by release-cli.yml via
# action-gh-release, which runs as github-actions[bot] with the default
# GITHUB_TOKEN — and GitHub does not start a workflow from an event raised by
# that token, to stop workflows triggering themselves. So the release event
# never arrived and the SDKs sat at 2.2.1 through two releases with nothing
# failing anywhere. This workflow was called directly from release-cli.yml for a
# while instead; it now listens for the tag push itself, for the npm reason set
# out below the `on:` key. A tag push is a real push event, so it does not go
# missing the way the release event did.
on:
  # Triggered by the tag directly, not called from release-cli.yml, and that distinction is
  # load-bearing rather than stylistic. npm's Trusted Publisher validates the OIDC token
  # against the workflow that *entered* the run. Called as a reusable workflow the entry is
  # release-cli.yml, so a publisher trusting this file was rejected with a bare 404 — while
  # the identical job started directly from here succeeded. Owning its own trigger keeps the
  # entry workflow and the trusted publisher the same file, which is the only arrangement npm
  # accepts without naming the caller instead.
  #
  # A tag push is a real push event, so unlike `release: published` it is not dropped for
  # being raised by GITHUB_TOKEN — the trap documented in NOTE 2 above.
  push:
    tags:
      - 'v*.*.*'
  # Deliberately not `workflow_call`. Being called makes the caller the entry workflow, and
  # npm's Trusted Publisher checks the entry workflow — which is how a correctly configured
  # publisher came back as a bare 404 for six months' worth of releases. Do not add it back.
  workflow_dispatch:
    inputs:
      sdk:
        description: 'SDK to publish (node, python, php, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - node
          - python
          - php
      ref:
        description: 'Tag to publish from, e.g. v2.7.0 (defaults to this branch)'
        required: false
        default: ''
        type: string

# Least privilege by default. `id-token: write` is granted per-job below, only
# where a registry's OIDC (Trusted Publishing) flow needs it.
permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Node.js SDK to npm (@railhook/node)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing + --provenance
    if: >
      github.event_name == 'push' ||
      inputs.sdk == 'all' ||
      inputs.sdk == 'node'
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 22, not 20: `npm@latest` (needed for Trusted Publishing) requires
          # ^20.17 || >=22.9, and which 20.x the runner image carries is not
          # something to depend on.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check version drift
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @railhook/node version 2>/dev/null || echo "")
          echo "local=$LOCAL_VERSION published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: npm ci

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: npm run build

      # npm >= 11.5.1 is what understands Trusted Publishing; setup-node pins an
      # older npm with Node 20.
      - name: Upgrade npm for Trusted Publishing
        if: steps.check.outputs.should_publish == 'true'
        run: npm install -g npm@latest

      # v2.5.0 and v2.6.0 both failed here with
      #   npm error 404 Not Found - PUT .../@webhook-platform%2fnode
      # which is what npm returns for an unauthenticated scoped publish: the
      # long-lived NPM_TOKEN had expired, and npm was left two releases behind
      # at 2.2.1. OIDC removes the standing secret so that cannot recur, and
      # --provenance attaches the sigstore attestation the container images
      # already carry.
      #
      # One-time setup on npmjs.com, which no workflow can do for you: package
      # settings -> Trusted Publisher -> this repository, workflow
      # `publish-sdks.yml`. NPM_TOKEN stays here as the fallback npm uses when
      # no trusted publisher is configured; once OIDC works it can be deleted.
      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-python:
    name: Publish Python SDK to PyPI (webhook-platform)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      inputs.sdk == 'all' ||
      inputs.sdk == 'python'
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check version drift
        id: check
        run: |
          LOCAL_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PUBLISHED_VERSION=$(curl -s https://pypi.org/pypi/railhook/json | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('info',{}).get('version',''))" 2>/dev/null || echo "")
          echo "local=$LOCAL_VERSION published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: |
          pip install build twine
          pip install -e ".[dev]"

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: pytest

      - name: Build package
        if: steps.check.outputs.should_publish == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.should_publish == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

  publish-php:
    name: Publish PHP SDK to Packagist (railhook/php)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      inputs.sdk == 'all' ||
      inputs.sdk == 'php'
    defaults:
      run:
        working-directory: sdks/php
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check version drift
        id: check
        run: |
          LOCAL_VERSION=$(php -r "echo json_decode(file_get_contents('composer.json'), true)['version'] ?? '';")
          PUBLISHED_VERSION=$(curl -s https://repo.packagist.org/p2/railhook/php.json | php -r "
            \$d = json_decode(file_get_contents('php://stdin'), true);
            \$versions = \$d['packages']['railhook/php'] ?? [];
            echo \$versions[0]['version'] ?? '';
          ")
          echo "local=$LOCAL_VERSION published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: vendor/bin/phpunit --no-coverage

      # Packagist cannot serve a package whose composer.json lives in a subdirectory, so
      # `railhook/php` there is registered against a separate repository,
      # vadymkykalo/railhook-php. That repository was kept in step by hand, and the
      # hand stopped: its last commit is the v2.2.1 release, and every release since has
      # shipped a PHP SDK that nothing published. Meanwhile this job reported success every
      # time, because it posted an update-package call naming *this* monorepo — a URL
      # Packagist does not know — and checked neither the exit code nor the response body,
      # inside an `if [ -n "$TOKEN" ]` that made a missing secret a silent no-op too.
      #
      # Authenticated with a deploy key rather than a personal access token: a deploy key
      # grants write to exactly one repository and nothing else, which is all this needs.
      # The public half is registered on vadymkykalo/railhook-php ("railhook-release
      # (SDK split push)"); revoking it there is enough to cut this off. GITHUB_TOKEN cannot
      # be used — it is scoped to the repository running the workflow.
      - name: Publish sdks/php to the split repository
        if: steps.check.outputs.should_publish == 'true'
        working-directory: .
        env:
          SDK_SPLIT_SSH_KEY: ${{ secrets.SDK_SPLIT_SSH_KEY }}
          SPLIT_REPO: vadymkykalo/railhook-php
        run: |
          set -euo pipefail

          if [ -z "${SDK_SPLIT_SSH_KEY:-}" ]; then
            echo "::error::SDK_SPLIT_SSH_KEY is not set, so the PHP SDK cannot be published. See the comment above this step."
            exit 1
          fi

          VERSION=$(php -r "echo json_decode(file_get_contents('sdks/php/composer.json'), true)['version'] ?? '';")
          [ -n "$VERSION" ] || { echo "::error::no version in sdks/php/composer.json"; exit 1; }

          # Written to disk rather than passed through ssh-agent: the agent would outlive
          # this step, and the runner is discarded either way.
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SDK_SPLIT_SSH_KEY" > ~/.ssh/sdk_split
          chmod 600 ~/.ssh/sdk_split
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/sdk_split -o IdentitiesOnly=yes"

          git clone --depth 1 "git@github.com:${SPLIT_REPO}.git" split
          cd split

          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q .; then
            echo "Tag ${VERSION} already exists in ${SPLIT_REPO}; nothing to push."
            exit 0
          fi

          # Everything the package needs and nothing else: vendor/ is a build artefact, and
          # the contract-test harness only means anything against a running platform.
          # .gitignore is the split repository's own and survives the sweep — it is not
          # something this monorepo has an opinion about.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .gitignore -exec rm -rf {} +
          cp -r ../sdks/php/src ../sdks/php/tests ../sdks/php/README.md \
                ../sdks/php/composer.json ../sdks/php/composer.lock ../sdks/php/phpunit.xml .

          # Packagist derives the version from the git tag and advises against a hardcoded
          # one. The monorepo copy keeps the field because scripts/check-version-drift.sh
          # reads it as one of the seven places the version has to agree; the published copy
          # drops it, which is what the split repository has done by hand since 1.1.0.
          php -r '
            $f = "composer.json";
            $c = json_decode(file_get_contents($f), true);
            unset($c["version"]);
            file_put_contents($f, json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content change; tagging the existing HEAD as ${VERSION}."
          else
            git commit -m "Release ${VERSION}"
          fi
          git tag "${VERSION}"
          git push origin HEAD:main --tags

      # Packagist re-crawls from the split repository's own webhook when one is configured
      # there. This nudge makes the publish deterministic — and unlike the call it replaces,
      # it fails when the nudge does not land.
      - name: Trigger Packagist update
        if: steps.check.outputs.should_publish == 'true'
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PACKAGIST_TOKEN:-}" ] || [ -z "${PACKAGIST_USERNAME:-}" ]; then
            echo "::error::PACKAGIST_USERNAME / PACKAGIST_TOKEN are not set, so Packagist will not re-crawl."
            exit 1
          fi

          RESPONSE=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}&autoUpdated=1" \
            -d '{"repository":{"url":"https://github.com/vadymkykalo/railhook-php"}}')

          echo "Packagist responded: $RESPONSE"

          if ! echo "$RESPONSE" | grep -q '"status" *: *"success"'; then
            echo "::error::Packagist did not accept the update. Check that railhook/php is registered against vadymkykalo/railhook-php."
            exit 1
          fi
