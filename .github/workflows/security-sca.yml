name: Security SCA

# Not per push: its input is the NVD feed, not the diff, and CI's Trivy scan covers dependency CVEs on every push.
on:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches:
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    # A cold NVD backfill takes ~45 minutes; past an hour it is a hung download.
    timeout-minutes: 75

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compute cache week key
        id: dc-cache-week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      # restore + save split so the ~500MB NVD mirror is saved even when the scan fails.
      - name: Restore OWASP Dependency-Check NVD data
        id: dc-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ steps.dc-cache-week.outputs.week }}
          restore-keys: |
            dependency-check-data-

      # CISA KEV feed 403s from cloud IPs; OSS Index 401s without an account; <12.x is WAF-blocked by NVD.
      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn org.owasp:dependency-check-maven:12.1.0:aggregate -B -DskipTests
          -DfailBuildOnCVSS=9
          -DknownExploitedEnabled=false
          -DossindexAnalyzerEnabled=false
          -DnvdApiKey="${NVD_API_KEY}"
          -DdataDirectory="$HOME/.m2/repository/org/owasp/dependency-check-data"
          -DsuppressionFiles=.github/dependency-check-suppressions.xml

      - name: Save OWASP Dependency-Check NVD data
        if: always() && steps.dc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ steps.dc-cache-week.outputs.week }}

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 14

      - name: SCA Summary
        if: always()
        run: |
          echo "### SCA (OWASP Dependency-Check) Results" >> $GITHUB_STEP_SUMMARY
          echo "Dependency vulnerability scan completed. Report uploaded as artifact." >> $GITHUB_STEP_SUMMARY
          echo "Gates on CVSS >= 9 (see the comment above the scan step for the staged rollout plan)." >> $GITHUB_STEP_SUMMARY
