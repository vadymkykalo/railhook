name: Release CLI

on:
  push:
    tags:
      - 'v*'
  # Retries a failed release without re-pushing its tag; every step is idempotent.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to (re)run the release for, e.g. v2.6.1'
        required: true
        type: string

jobs:
  release-cli:
    name: Build & Publish CLI
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # On a dispatch github.ref is the branch, not the tag being released.
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build CLI JAR
        run: mvn clean package -pl railhook-cli -am -DskipTests -B

      - name: Prepare release assets
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          cp railhook-cli/target/railhook-cli-*.jar railhook-cli.jar
          sha256sum railhook-cli.jar > SHA256SUMS
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Railhook ${{ inputs.tag || github.ref_name }}"
          body: |
            ## Railhook CLI ${{ env.VERSION }}

            ### Install
            ```bash
            curl -fsSL https://railhook.io/install-cli.sh | bash
            ```

            Or download `railhook-cli.jar` and run:
            ```bash
            java -jar railhook-cli.jar --help
            ```

            ### Requirements
            - Java 17+ (auto-installed by the install script)

            ### Verify

            ```bash
            sha256sum -c SHA256SUMS
            ```
          files: |
            railhook-cli.jar
            SHA256SUMS
          draft: false
          prerelease: false

  # Asks the registries what is actually published; publish-sdks.yml races this on the same tag, hence the polling.
  verify-release:
    name: Verify everything published
    needs: release-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # docker-publish.yml runs on the same tag and cannot be `needs:`-ed, so poll.
      - name: Wait for the container images
        run: |
          set -uo pipefail
          DEADLINE=$(( $(date +%s) + 30 * 60 ))
          MISSING=""

          tag_exists() {
            local image="$1"
            local token
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY_OWNER}/${image}:pull&service=ghcr.io" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])') || return 1
            curl -fsS -H "Authorization: Bearer ${token}" \
              "https://ghcr.io/v2/${GITHUB_REPOSITORY_OWNER}/${image}/manifests/${VERSION}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              -o /dev/null
          }

          while :; do
            MISSING=""
            for image in railhook-api railhook-ui railhook-worker; do
              tag_exists "$image" || MISSING="${MISSING} ${image}"
            done
            [ -z "$MISSING" ] && break
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::No ${VERSION} tag in GHCR for:${MISSING}. Check the Docker Publish run for this tag — an image that never published means install.sh cannot pull it."
              exit 1
            fi
            echo "still waiting for:${MISSING}"
            sleep 60
          done
          echo "All three images carry the ${VERSION} tag."

      - name: Verify the SDK registries
        run: |
          set -uo pipefail

          npm_version() { npm view @railhook/node version 2>/dev/null || echo ''; }
          pypi_version() {
            curl -fsS https://pypi.org/pypi/railhook/json 2>/dev/null \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["info"]["version"])' 2>/dev/null || echo ''
          }
          packagist_version() {
            curl -fsS https://repo.packagist.org/p2/railhook/php.json 2>/dev/null \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["packages"]["railhook/php"][0]["version"].lstrip("v"))' 2>/dev/null || echo ''
          }

          # Packagist crawls asynchronously and npm's replicas lag its publish.
          DEADLINE=$(( $(date +%s) + 10 * 60 ))
          while :; do
            NPM=$(npm_version); PYPI=$(pypi_version); PACKAGIST=$(packagist_version)
            [ "$NPM" = "$VERSION" ] && [ "$PYPI" = "$VERSION" ] && [ "$PACKAGIST" = "$VERSION" ] && break
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then break; fi
            echo "waiting — npm=${NPM:-<nothing>} pypi=${PYPI:-<nothing>} packagist=${PACKAGIST:-<nothing>}"
            sleep 30
          done

          FAILED=0
          check() {
            if [ "$2" = "$VERSION" ]; then
              echo "ok   $1: $2"
            else
              echo "::error::$1 is on '${2:-<nothing>}', expected ${VERSION}."
              FAILED=1
            fi
          }
          check "npm @railhook/node" "$NPM"
          check "PyPI railhook" "$PYPI"
          check "Packagist railhook/php" "$PACKAGIST"

          exit $FAILED
