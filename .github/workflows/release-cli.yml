name: Release CLI

on:
  push:
    tags:
      - 'v*'
  # A release that fails cannot otherwise be retried without deleting and re-pushing its
  # tag, which is a history rewrite to work around a transient failure — an expired token,
  # a registry outage, or the permissions mistake that made this workflow fail to start at
  # all on v2.6.1. Every step here is idempotent: the SDK jobs skip when the registry
  # already has the version, and the release upload replaces its assets.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to (re)run the release for, e.g. v2.6.1'
        required: true
        type: string

jobs:
  release-cli:
    name: Build & Publish CLI
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # On a dispatch github.ref is the branch, so without this the jar would be built
          # from whatever that branch happens to hold rather than from the tag being released.
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build CLI JAR
        run: mvn clean package -pl webhook-platform-cli -am -DskipTests -B

      - name: Prepare release assets
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          cp webhook-platform-cli/target/webhook-platform-cli-*.jar railhook-cli.jar
          # install.sh refuses to run a JAR that doesn't match this file (see
          # verify_checksum() in webhook-platform-cli/install.sh) — table
          # stakes for a curl-pipe installer.
          sha256sum railhook-cli.jar > SHA256SUMS
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Railhook ${{ inputs.tag || github.ref_name }}"
          body: |
            ## Railhook CLI ${{ env.VERSION }}

            ### Install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/vadymkykalo/railhook/main/webhook-platform-cli/install.sh | bash
            ```

            Or download `railhook-cli.jar` and run:
            ```bash
            java -jar railhook-cli.jar --help
            ```

            ### Requirements
            - Java 17+ (auto-installed by the install script)

            ### Verify

            ```bash
            sha256sum -c SHA256SUMS
            ```
          files: |
            railhook-cli.jar
            SHA256SUMS
          draft: false
          prerelease: false

  # The v2.6.0 post-mortem in one job.
  #
  # That release published api and worker to GHCR, skipped the UI image (its
  # build died under QEMU), left npm on 2.2.1 (an expired token), and left
  # Packagist on 2.2.1 (a step that could not fail). The GitHub release was
  # created and stayed up through all of it, and `install.sh` — which resolves
  # the latest release and pins every image tag to it — was broken for every
  # new user from that moment.
  #
  # `make version-check` could not have caught any of it: it compares files in
  # the repository to each other and never asks a registry what is actually
  # published. This does ask.
  #
  # It no longer `needs:` the SDK publish, because that no longer runs from here:
  # publish-sdks.yml is triggered by the same tag, so that npm sees it as the workflow
  # entering the run and its Trusted Publisher matches. The two workflows race, which is
  # exactly what the retry loops below are for — this waits for the result rather than for
  # the job that produces it.
  verify-release:
    name: Verify everything published
    needs: release-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve version
        # On a tag push GITHUB_REF_NAME is the tag; on a manual dispatch it is the branch,
        # so the tag has to come from the input instead.
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # docker-publish.yml is a separate workflow on the same tag, so this one
      # cannot `needs:` it. Poll instead — a full multi-arch build of the three
      # images takes ~17 minutes, so a bounded wait is the honest shape here
      # rather than an immediate check that would just race.
      - name: Wait for the container images
        run: |
          set -uo pipefail
          DEADLINE=$(( $(date +%s) + 30 * 60 ))
          MISSING=""

          tag_exists() {
            local image="$1"
            local token
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY_OWNER}/${image}:pull&service=ghcr.io" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])') || return 1
            curl -fsS -H "Authorization: Bearer ${token}" \
              "https://ghcr.io/v2/${GITHUB_REPOSITORY_OWNER}/${image}/manifests/${VERSION}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              -o /dev/null
          }

          while :; do
            MISSING=""
            for image in railhook-api railhook-ui railhook-worker; do
              tag_exists "$image" || MISSING="${MISSING} ${image}"
            done
            [ -z "$MISSING" ] && break
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::No ${VERSION} tag in GHCR for:${MISSING}. Check the Docker Publish run for this tag — an image that never published means install.sh cannot pull it."
              exit 1
            fi
            echo "still waiting for:${MISSING}"
            sleep 60
          done
          echo "All three images carry the ${VERSION} tag."

      # Each of the three is checked, and each reports independently, so one
      # broken registry does not hide the state of the other two.
      - name: Verify the SDK registries
        run: |
          set -uo pipefail

          npm_version() { npm view @railhook/node version 2>/dev/null || echo ''; }
          pypi_version() {
            curl -fsS https://pypi.org/pypi/railhook/json 2>/dev/null \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["info"]["version"])' 2>/dev/null || echo ''
          }
          packagist_version() {
            curl -fsS https://repo.packagist.org/p2/railhook/php.json 2>/dev/null \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["packages"]["railhook/php"][0]["version"].lstrip("v"))' 2>/dev/null || echo ''
          }

          # Packagist crawls asynchronously after update-package returns, and
          # npm's read replicas lag its own publish by a few seconds, so a
          # single immediate read would report a false failure. Ten minutes is
          # well past both and still far short of a hung job.
          DEADLINE=$(( $(date +%s) + 10 * 60 ))
          while :; do
            NPM=$(npm_version); PYPI=$(pypi_version); PACKAGIST=$(packagist_version)
            [ "$NPM" = "$VERSION" ] && [ "$PYPI" = "$VERSION" ] && [ "$PACKAGIST" = "$VERSION" ] && break
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then break; fi
            echo "waiting — npm=${NPM:-<nothing>} pypi=${PYPI:-<nothing>} packagist=${PACKAGIST:-<nothing>}"
            sleep 30
          done

          # Report all three even when one has already failed: a half-published
          # release is exactly the case where you want the whole picture.
          FAILED=0
          check() {
            if [ "$2" = "$VERSION" ]; then
              echo "ok   $1: $2"
            else
              echo "::error::$1 is on '${2:-<nothing>}', expected ${VERSION}."
              FAILED=1
            fi
          }
          check "npm @railhook/node" "$NPM"
          check "PyPI webhook-platform" "$PYPI"
          check "Packagist railhook/php" "$PACKAGIST"

          exit $FAILED
