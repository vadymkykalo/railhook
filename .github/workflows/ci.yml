name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No SNAPSHOT-suffix skip here: pom.xml is intentionally allowed to run a
    # -SNAPSHOT ahead of the Chart/UI/SDK versions between releases (see
    # scripts/check-version-drift.sh) but every real value still has to agree.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check pom / Chart / UI / SDK versions agree
        run: scripts/check-version-drift.sh

  # `helm lint` used to live only in docker-publish.yml, which runs
  # `on: push: tags` — so the chart was first checked *after* it had been
  # tagged and released. That is how the 2.6.0 chart shipped declaring
  # containerPort 80 for an image whose nginx listens on 5173: readiness could
  # never pass, and `helm install` produced a UI that never came up. The chart
  # is a documented installation path, so it gets checked on the way in.
  helm-lint:
    name: Helm Chart Lint & Render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: helm lint
        run: helm lint deploy/helm/hookflow

      # Both values files, because values-production.yaml overrides enough
      # (external database, replica counts, resources) to render templates the
      # default values never reach.
      - name: helm template
        run: |
          set -euo pipefail
          mkdir -p rendered
          helm template hookflow deploy/helm/hookflow \
            > rendered/default.yaml
          helm template hookflow deploy/helm/hookflow \
            -f deploy/helm/hookflow/values-production.yaml \
            > rendered/production.yaml
          wc -l rendered/*.yaml

      - name: Validate rendered manifests against the Kubernetes schema
        run: |
          set -euo pipefail
          # Downloaded to a file rather than piped into tar: a retry cannot
          # rescue a pipe, because tar has already read a truncated stream by
          # the time curl starts over. This step failed exactly that way on
          # 2026-09-04 ("Recv failure: Connection reset by peer").
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          # -strict rejects unknown fields, which is what catches a typo'd key
          # that Helm renders happily and Kubernetes silently ignores.
          # ServiceMonitor/PrometheusRule are CRDs, hence the extra schema
          # source; -ignore-missing-schemas would hide real errors instead.
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/default.yaml rendered/production.yaml

      # The port the UI container listens on lives in three files that nothing
      # otherwise ties together: nginx.conf, the Deployment and the probes.
      # This asserts they still agree, so the 2.6.0 bug cannot come back
      # quietly.
      - name: UI container port matches nginx.conf
        run: |
          set -euo pipefail
          NGINX_PORT=$(sed -n 's/^[[:space:]]*listen[[:space:]]\+\([0-9]\+\);.*/\1/p' \
            webhook-platform-ui/nginx.conf | head -1)
          echo "nginx.conf listens on ${NGINX_PORT}"

          python3 - "$NGINX_PORT" <<'EOF'
          import sys, yaml
          expected = int(sys.argv[1])
          failures = []
          for doc in yaml.safe_load_all(open('rendered/default.yaml')):
              if not doc or doc.get('kind') != 'Deployment':
                  continue
              if not doc['metadata']['name'].endswith('-ui'):
                  continue
              for c in doc['spec']['template']['spec']['containers']:
                  for port in c.get('ports', []):
                      if port['containerPort'] != expected:
                          failures.append(f"containerPort {port['containerPort']}")
                  for probe in ('livenessProbe', 'readinessProbe', 'startupProbe'):
                      http = (c.get(probe) or {}).get('httpGet')
                      if http and http.get('port') != expected:
                          failures.append(f"{probe} port {http.get('port')}")
          if failures:
              sys.exit(f"::error::UI chart disagrees with nginx.conf ({expected}): " + ", ".join(failures))
          print(f"UI Deployment and probes all target {expected}.")
          EOF

  # helm-lint above renders the chart and checks the manifests against the
  # Kubernetes schema. Nothing applied them, and four defects lived in that gap
  # for releases: WEBHOOK_ENCRYPTION_SALT was never supplied to either app
  # (both require it with no default, so every api and worker pod CrashLooped),
  # the PodDisruptionBudget template the values and the README both advertised
  # did not exist, MANAGEMENT_PORT was never set so every metrics scrape hit the
  # authenticated chain and got a 401, and APP_BASE_URL was left at the app's
  # own http://localhost:5173 so verification and invite links pointed at
  # nobody's machine. A render is not an install; this job installs.
  #
  # needs: docker-build for the same reason install-smoke does — it restores the
  # three images from that job's layer cache rather than building them cold.
  helm-kind-smoke:
    name: Helm Chart Install Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 30

    env:
      KIND_CLUSTER: hookflow-smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the three images
        run: |
          set -e
          for svc in api worker ui; do
            docker buildx build --load \
              -f "webhook-platform-${svc}/Dockerfile" \
              -t "webhook-platform-${svc}:test" \
              --cache-from "type=gha,scope=${svc}" .
          done

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: hookflow-smoke
          node_image: kindest/node:v1.31.0

      - name: Load the images into the cluster
        run: |
          set -e
          for svc in api worker ui; do
            kind load docker-image "webhook-platform-${svc}:test" --name "$KIND_CLUSTER"
          done

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      # Verbatim from the chart README's "Create secrets" step, including
      # encryption-salt. If that snippet ever stops producing a Secret the chart
      # can install against, this is where it shows.
      - name: Create secrets, the way the chart README says to
        run: |
          set -e
          kubectl create secret generic hookflow-secrets \
            --from-literal=encryption-key="$(openssl rand -base64 32)" \
            --from-literal=encryption-salt="$(openssl rand -base64 24)" \
            --from-literal=jwt-secret="$(openssl rand -base64 64)"
          kubectl create secret generic hookflow-postgresql-secret \
            --from-literal=password="$(openssl rand -base64 32)"
          kubectl create secret generic hookflow-redis-secret \
            --from-literal=password="$(openssl rand -base64 32)"

      - name: Stand up PostgreSQL, Kafka and Redis
        run: |
          set -e
          kubectl apply -f deploy/ci/kind-dependencies.yaml

          # Waited for one at a time, each with its own deadline. A single wait over
          # all three shares one clock, so the first slow one eats it and the others
          # are reported as having timed out when they are Running and Ready — which
          # is exactly what happened the first time this job ran: Kafka crash-looped
          # and the log blamed Redis too. On failure, dump the culprit's own logs;
          # `kubectl describe` shows a probe failing and never says why.
          for d in postgres kafka redis; do
            if ! kubectl wait --for=condition=available --timeout=4m "deployment/$d"; then
              echo "::error::$d never became available"
              kubectl logs "deployment/$d" --tail=100 || true
              exit 1
            fi
          done

      # One replica of each and no HPA — a kind node on a CI runner cannot fit
      # the production replica counts, and neither has anything to do with what
      # this job checks. The PDBs are switched on precisely because they are new.
      - name: helm install
        run: |
          set -e
          helm install hookflow deploy/helm/hookflow \
            --wait --timeout 15m \
            --set postgresql.external.host=postgres \
            --set kafka.external.bootstrapServers=kafka:9092 \
            --set redis.external.host=redis \
            --set api.image.repository=webhook-platform-api \
            --set api.image.tag=test \
            --set worker.image.repository=webhook-platform-worker \
            --set worker.image.tag=test \
            --set ui.image.repository=webhook-platform-ui \
            --set ui.image.tag=test \
            --set api.replicaCount=1 \
            --set worker.replicaCount=1 \
            --set ui.replicaCount=1 \
            --set api.hpa.enabled=false \
            --set worker.hpa.enabled=false \
            --set api.pdb.enabled=true \
            --set worker.pdb.enabled=true \
            --set ui.pdb.enabled=true

      - name: Every workload came up
        run: |
          set -e
          kubectl get pods -o wide
          kubectl rollout status deployment/hookflow-api --timeout=5m
          kubectl rollout status deployment/hookflow-worker --timeout=5m
          kubectl rollout status deployment/hookflow-ui --timeout=5m

      - name: The PodDisruptionBudgets exist
        run: |
          set -e
          kubectl get pdb
          COUNT=$(kubectl get pdb -o name | wc -l)
          [ "$COUNT" = "3" ] || { echo "::error::expected 3 PodDisruptionBudgets, found $COUNT"; exit 1; }

      - name: Mail links do not point at localhost
        run: |
          set -e
          BASE=$(kubectl get configmap hookflow-config -o jsonpath='{.data.APP_BASE_URL}')
          CORS=$(kubectl get configmap hookflow-config -o jsonpath='{.data.CORS_ALLOWED_ORIGINS}')
          echo "APP_BASE_URL=$BASE  CORS_ALLOWED_ORIGINS=$CORS"
          case "$BASE$CORS" in
            *localhost*|*127.0.0.1*|"")
              echo "::error::APP_BASE_URL/CORS_ALLOWED_ORIGINS still point at localhost: $BASE / $CORS"
              exit 1 ;;
          esac

      - name: Health and metrics answer from inside the cluster
        run: |
          set -e
          kubectl run smoke-curl --image=curlimages/curl:8.10.1 --restart=Never \
            --command -- sleep 1800
          kubectl wait --for=condition=ready pod/smoke-curl --timeout=3m

          check() {
            code=$(kubectl exec smoke-curl -- \
              curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$1")
            printf '%-56s %s (want %s)\n' "$1" "$code" "$2"
            [ "$code" = "$2" ] || { echo "::error::$1 returned $code, expected $2"; exit 1; }
          }

          # Actuator on the management port, for both services.
          check http://hookflow-api:8082/actuator/health          200
          check http://hookflow-worker:8081/actuator/health/liveness 200
          # The scrape the ServiceMonitor performs. 200, not the 401 it got
          # while the chart left actuator on the authenticated main port —
          # which is the whole reason MANAGEMENT_PORT is set now.
          check http://hookflow-api:8082/actuator/prometheus      200
          check http://hookflow-worker:8081/actuator/prometheus   200
          # And the main port still refuses it, so the 200 above is the split
          # doing the work rather than actuator having been left wide open.
          # Asserted as "not 200" rather than a specific code: SecurityConfig
          # answers 401 there, but which of 401/404 you get depends on whether
          # authorization or handler mapping speaks first, and the invariant is
          # that metrics are not served unauthenticated on the traffic port.
          code=$(kubectl exec smoke-curl -- \
            curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            http://hookflow-api:8080/actuator/prometheus)
          echo "http://hookflow-api:8080/actuator/prometheus  $code (want anything but 200)"
          [ "$code" != "200" ] || { echo "::error::metrics are served unauthenticated on the traffic port"; exit 1; }
          # The UI image's nginx proxies /actuator/health to the literal
          # upstream `api` on 8082 — this proves the alias Service forwards to
          # the real management port.
          check http://api:8082/actuator/health/liveness          200
          check http://hookflow-ui/                               200
          check http://hookflow-ui/actuator/health/liveness       200

      - name: Helm Kind Smoke Summary
        if: always()
        run: |
          echo "### Helm Chart Install Smoke Test" >> $GITHUB_STEP_SUMMARY
          echo "install into kind -> pods Ready -> health 200 -> metrics 200 (not 401)" >> $GITHUB_STEP_SUMMARY

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get all -o wide || true
          kubectl get events --sort-by=.lastTimestamp || true
          kubectl describe pods || true
          kubectl logs -l app.kubernetes.io/component=api --tail=200 --prefix || true
          kubectl logs -l app.kubernetes.io/component=worker --tail=200 --prefix || true
          kubectl logs -l app.kubernetes.io/component=ui --tail=100 --prefix || true

      - name: Tear down
        if: always()
        run: helm uninstall hookflow || true

  backend-build:
    name: Backend Build & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Compile all modules
        run: mvn clean compile -B
        
      - name: Package artifacts
        run: mvn package -DskipTests -B

      - name: Upload CLI JAR
        uses: actions/upload-artifact@v7
        with:
          name: hookflow-cli
          path: webhook-platform-cli/target/webhook-platform-cli-*.jar
          retention-days: 30

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: backend-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      # This and the integration job below are separate GitHub Actions
      # jobs on separate runners with no shared filesystem, so each writes
      # its own distinctly-named exec file (jacoco-unit.exec here,
      # jacoco-it.exec in the integration job) rather than the plugin's
      # default target/jacoco.exec - a naive setup where both jobs wrote the
      # same filename and only one got published/read downstream would
      # silently report only whichever run happened to be looked at, not the
      # true merged coverage. The coverage-report job later downloads both
      # sets of exec files into one checkout and runs jacoco:report-aggregate,
      # whose default file pattern (**/jacoco*.exec) picks up both.
      # Cheap guard before the tests themselves: the unit/integration split is done
      # by class-name suffix alone, so a Testcontainers test with a plain *Test name
      # lands here, where there is no Docker, and fails as if it were broken.
      - name: Check test routing
        run: scripts/check-test-routing.sh

      - name: Run unit tests
        run: mvn test -B -Dtest='!*IntegrationTest,!*IT,!*RepositoryTest,!*ConcurrencyTest,!*RbacTest,!*IsolationTest' -Djacoco.destFile=target/jacoco-unit.exec --fail-at-end

      - name: Test Summary
        if: always()
        run: |
          echo "### Backend Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Unit tests completed. See workflow logs for details." >> $GITHUB_STEP_SUMMARY

      # Uploaded even on failure (--fail-at-end above means a failing class
      # doesn't stop the rest of the module's tests from running and
      # recording coverage) so the aggregate job can still build the fullest
      # picture available.
      - name: Upload unit test coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-unit-exec
          path: webhook-platform-*/target/jacoco-unit.exec
          retention-days: 7
          if-no-files-found: warn

  backend-integration-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: backend-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run integration tests with Testcontainers
        # surefire 3.x split the old failIfNoTests flag in two - failIfNoTests
        # still covers "this whole run found zero tests", but a -Dtest=pattern that
        # matches zero classes in a given module (e.g. common/cli, which have no
        # *RepositoryTest/*IntegrationTest/etc classes) now needs
        # surefire.failIfNoSpecifiedTests=false too, or the reactor build fails there
        # before ever reaching api/worker.
        run: mvn test -B -Dtest='*RepositoryTest,*IntegrationTest,*IT,*ConcurrencyTest,*RbacTest,*IsolationTest' -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Djacoco.destFile=target/jacoco-it.exec --fail-at-end
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
          DOCKER_API_VERSION: "1.44"

      - name: Integration Test Summary
        if: always()
        run: |
          echo "### Backend Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Integration tests with Testcontainers completed." >> $GITHUB_STEP_SUMMARY
          echo "- PostgreSQL: Testcontainers" >> $GITHUB_STEP_SUMMARY

      # See the matching comment in the unit-test job above - distinct
      # filename, uploaded so coverage-report can merge this with the unit
      # job's exec data into one real aggregate.
      - name: Upload integration test coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-integration-exec
          path: webhook-platform-*/target/jacoco-it.exec
          retention-days: 7
          if-no-files-found: warn

  # The actual point of splitting exec-data upload above - neither
  # backend-test nor backend-integration-test alone has the full picture
  # (each only ran half the test classes), and they run on separate runners
  # with no shared filesystem, so "coverage" can't just be read out of
  # either job directly. This job collects both artifacts into one checkout,
  # recompiles (tests skipped - only the just-downloaded exec data is used
  # for coverage, not a fresh run) so class files exist for JaCoCo to map
  # execution data onto, then runs `mvn verify` so both
  # jacoco:report-aggregate (webhook-platform-coverage-report/pom.xml) and
  # each real module's own jacoco:merge + jacoco:check (root pom.xml +
  # common/api/worker/cli's own pom.xml) fire against the true merged
  # unit+integration coverage.
  #
  # `if: ${{ !cancelled() }}` (not the default "needs both to succeed") so a
  # real coverage number - even partial - is still visible on the PR when
  # one suite has unrelated failures; --fail-at-end in both test jobs above
  # means a failing class doesn't stop its module's other tests from running
  # and recording coverage either.
  coverage-report:
    name: Aggregate Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-test, backend-integration-test]
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download unit test coverage data
        uses: actions/download-artifact@v8
        with:
          name: jacoco-unit-exec
        continue-on-error: true

      - name: Download integration test coverage data
        uses: actions/download-artifact@v8
        with:
          name: jacoco-integration-exec
        continue-on-error: true

      # -DskipTests: tests are not re-run here - class files are needed only
      # so JaCoCo can map the exec data just downloaded onto real bytecode
      # and source. Needs `verify`, not `test`: report-aggregate (in
      # webhook-platform-coverage-report/pom.xml) is bound to `test`, but the
      # per-module jacoco-merge (root pom.xml) and jacoco:check executions
      # (each of common/api/worker/cli's own pom.xml) are bound to `verify` -
      # deliberately later than `test`, so CI's two split `mvn test`
      # invocations elsewhere in this file (unit-only / integration-only
      # filters) never trip a threshold check against partial data. This is
      # the one place in the whole pipeline that reaches `verify`, so it's
      # the only place those merge+check executions run for real.
      - name: Compile modules, aggregate report, threshold check
        run: mvn verify -B -pl webhook-platform-coverage-report -am -DskipTests

      - name: Coverage Summary
        if: always()
        run: |
          echo "### Coverage Report (unit + integration merged)" >> $GITHUB_STEP_SUMMARY
          if [ -f target/site/jacoco-aggregate/index.html ]; then
            echo "Aggregate report generated - see the jacoco-aggregate-report artifact." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::No aggregate report was produced - check the exec-data download steps above." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload aggregate coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-aggregate-report
          path: target/site/jacoco-aggregate
          retention-days: 30
          if-no-files-found: warn

  # Proves backups are actually restorable, not just "a CronJob ran".
  # backup -> destroy the data -> restore -> assert it's back. An untested
  # restore path is the most common cause of an unusable backup.
  restore-drill:
    name: Backup/Restore Drill
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create .env from .env.dist
        run: cp .env.dist .env

      - name: Start embedded Postgres
        run: docker compose --profile embedded-db up -d postgres

      # Over the unix socket, pg_isready says "ready" during the image's own init
      # phase: the entrypoint starts a temporary server with listen_addresses=''
      # to apply the initdb scripts, then stops it and starts the real one. This
      # wait used to return inside that window, and the seed step below hit the
      # stop with "FATAL: the database system is shutting down". TCP is the
      # discriminator - the temporary server is not listening on it - and the
      # query proves the server that answered will still be there for the seed.
      - name: Wait for Postgres to be ready
        run: |
          for i in $(seq 1 45); do
            if docker exec webhook-postgres pg_isready -h 127.0.0.1 -U webhook_user -d webhook_platform \
               && docker exec webhook-postgres psql -U webhook_user -d webhook_platform -c 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres never became ready"
          exit 1

      - name: Seed test data (simulates "ingest some events")
        run: |
          docker exec webhook-postgres psql -U webhook_user -d webhook_platform -c \
            "CREATE TABLE restore_drill_test (id serial primary key, note text);"
          docker exec webhook-postgres psql -U webhook_user -d webhook_platform -c \
            "INSERT INTO restore_drill_test (note) VALUES ('event-1'), ('event-2'), ('event-3');"

      - name: Backup (make backup-db)
        run: make backup-db

      - name: Destroy the data
        run: docker exec webhook-postgres psql -U webhook_user -d webhook_platform -c "DROP TABLE restore_drill_test;"

      - name: Restore (make restore-db)
        run: |
          FILE=$(ls -t backups/webhook_platform_*.dump | head -1)
          echo "Restoring from $FILE"
          make restore-db FILE="$FILE" CONFIRM=YES

      - name: Assert data integrity
        run: |
          COUNT=$(docker exec webhook-postgres psql -U webhook_user -d webhook_platform -tAc "SELECT count(*) FROM restore_drill_test;")
          echo "Row count after restore: $COUNT"
          if [ "$COUNT" != "3" ]; then
            echo "::error::Restore drill FAILED — expected 3 rows after restore, got $COUNT"
            exit 1
          fi
          NOTES=$(docker exec webhook-postgres psql -U webhook_user -d webhook_platform -tAc "SELECT string_agg(note, ',' ORDER BY id) FROM restore_drill_test;")
          if [ "$NOTES" != "event-1,event-2,event-3" ]; then
            echo "::error::Restore drill FAILED — row content mismatch: $NOTES"
            exit 1
          fi

      - name: Restore Drill Summary
        if: always()
        run: |
          echo "### Backup/Restore Drill Results" >> $GITHUB_STEP_SUMMARY
          echo "backup -> destroy -> restore -> assert data integrity: PASSED" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: docker compose --profile embedded-db down -v

  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webhook-platform-ui/package-lock.json
      
      - name: Install dependencies
        working-directory: webhook-platform-ui
        run: npm ci
      
      # openapi.yaml is drift-checked against springdoc by OpenApiDriftIntegrationTest,
      # so it describes the real backend. This carries that guarantee across to the
      # frontend: api.generated.ts is committed, and a DTO change that never reached
      # it fails here instead of surfacing as a runtime `undefined` in the browser.
      # The typecheck step below is the other half — src/types/api.contract.ts asserts
      # the hand-written mirror the app imports still matches these schemas.
      #
      # A step in this job rather than a job of its own: `main` requires a fixed list
      # of status checks, and a new job would have to be added to that list before it
      # could gate anything.
      - name: Check generated API types match openapi.yaml
        run: scripts/check-types-drift.sh

      # The in-app API reference is rendered from a derived index generated from
      # the same openapi.yaml, and that index is committed. Before this, the
      # reference was 2,100 lines of hand-written endpoint tables that nothing
      # kept in sync — this is what stops the replacement rotting the same way.
      - name: Check generated docs API index matches openapi.yaml
        working-directory: webhook-platform-ui
        run: npm run docs:api-index:check

      # sitemap.xml is derived from the same guide list the docs sidebar renders
      # and committed, so a guide added without regenerating it would be a page
      # that exists and is never crawled.
      - name: Check sitemap.xml matches the public route list
        working-directory: webhook-platform-ui
        run: npm run seo:sitemap:check

      - name: Run ESLint
        working-directory: webhook-platform-ui
        run: npm run lint
      
      - name: Run TypeScript typecheck
        working-directory: webhook-platform-ui
        run: npm run typecheck

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend-lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webhook-platform-ui/package-lock.json
      
      - name: Install dependencies
        working-directory: webhook-platform-ui
        run: npm ci
      
      # test:coverage (vitest run --coverage) subsumes test:ci - it
      # still runs every test, plus instruments and enforces the thresholds
      # in vite.config.ts. Using it here (rather than a separate coverage
      # step) means the coverage gate is the same command a PR's CI actually
      # ran, not a second, easier-to-drift-from invocation.
      - name: Run tests with coverage
        working-directory: webhook-platform-ui
        run: npm run test:coverage

      - name: Test Summary
        if: always()
        run: |
          echo "### Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Vitest tests + coverage thresholds completed. See workflow logs for details." >> $GITHUB_STEP_SUMMARY

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage-report
          path: webhook-platform-ui/coverage
          retention-days: 30
          if-no-files-found: warn

  sdk-test:
    name: SDK Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The three SDKs had no per-PR coverage at all: their suites ran on a release tag
    # (publish-sdks.yml) and in the nightly contract workflow, so a change that broke one
    # merged green and surfaced either overnight or at release. These are the unit tests
    # only - no stack, no containers - which is what makes them cheap enough to run here.
    # The contract tests, which need a live platform, stay nightly.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sdks/node/package-lock.json

      - name: Node SDK tests
        working-directory: sdks/node
        run: |
          npm ci
          npm test

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Python SDK tests
        working-directory: sdks/python
        run: |
          pip install -e ".[dev]"
          pytest -m "not contract"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: PHP SDK tests
        working-directory: sdks/php
        run: |
          composer install --prefer-dist --no-progress
          vendor/bin/phpunit --no-coverage

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-lint, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webhook-platform-ui/package-lock.json
      
      - name: Install dependencies
        working-directory: webhook-platform-ui
        run: npm ci
      
      - name: Build production bundle
        working-directory: webhook-platform-ui
        run: npm run build
      
      - name: Build Summary
        if: always()
        run: |
          echo "### Frontend Build Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ ESLint passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ TypeScript typecheck passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Production build successful" >> $GITHUB_STEP_SUMMARY

  security-sast:
    name: SAST (SpotBugs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      # SpotBugs stays advisory (continue-on-error) DELIBERATELY, not by oversight:
      # the existing findings across all modules have not been triaged yet, so
      # flipping this to gating today would block every PR on pre-existing debt
      # instead of new regressions. Triage is tracked separately; once the
      # backlog is clear (or suppressed with justification, like the OWASP
      # suppression file below), remove `continue-on-error` here so new SpotBugs
      # findings fail the build the same way Trivy/OWASP now do.
      - name: Run SpotBugs analysis
        run: mvn compile com.github.spotbugs:spotbugs-maven-plugin:4.8.3.1:check -B -DskipTests
        continue-on-error: true

      - name: SAST Summary
        if: always()
        run: |
          echo "### SAST (SpotBugs) Results" >> $GITHUB_STEP_SUMMARY
          echo "Static analysis completed. Check workflow logs for findings." >> $GITHUB_STEP_SUMMARY
          echo "_Advisory only — see comment in ci.yml for why this doesn't gate yet._" >> $GITHUB_STEP_SUMMARY

  # OWASP Dependency-Check (SCA) is not here: it lives in
  # .github/workflows/security-sca.yml, on a nightly schedule plus release/hotfix
  # branches. It cost 6-104 minutes per run depending on NVD cache state and its
  # input (the NVD feed) does not change with the diff. Pull requests keep
  # dependency-CVE coverage through `container-scan` below, which scans the same
  # Maven artifacts inside the built images. See that workflow's header comment.

  docker-build:
    name: Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-test, backend-integration-test, frontend-build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      # The only full builds in the workflow. install-smoke and
      # container-scan need the same three images and used to rebuild each from
      # scratch — nine full builds per run for three distinct images. They now
      # restore from the layer cache written here (scoped per image so the three
      # do not evict one another), which is why both declare needs: docker-build.
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: webhook-platform-api/Dockerfile
          tags: webhook-platform-api:test
          load: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      
      - name: Build Worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: webhook-platform-worker/Dockerfile
          tags: webhook-platform-worker:test
          load: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      
      - name: Build UI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: webhook-platform-ui/Dockerfile
          tags: webhook-platform-ui:test
          load: false
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
      
      - name: Docker Build Summary
        if: always()
        run: |
          echo "### Docker Build Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ All images built successfully" >> $GITHUB_STEP_SUMMARY

  # Proves docker-compose.yml (the no-Maven/no-npm quick start
  # advertised in the README) actually boots and answers health checks, so it
  # can't silently rot the way the old build-only compose flow did. Rebuilds
  # the three images itself (same pattern as container-scan below) and tags
  # them to match what docker-compose.yml resolves to when DOCKER_REGISTRY
  # is pointed at the local :test images instead of GHCR — no registry
  # credentials needed to run this.
  install-smoke:
    name: Installer Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 25

    # This is the install the README tells people to run, driven exactly as they
    # would drive it. It replaced a test that invoked Compose by hand: that one
    # could pass while install.sh — the thing anyone actually runs — was broken.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the three images
        run: |
          set -e
          for svc in api worker ui; do
            docker buildx build --load \
              -f "webhook-platform-${svc}/Dockerfile" \
              -t "webhook-platform-${svc}:test" \
              --cache-from "type=gha,scope=${svc}" .
          done

      - name: Install, exactly as the README says
        env:
          # Test the Compose file in this PR, not the one in the last release.
          HOOKFLOW_COMPOSE_SRC: ${{ github.workspace }}/docker-compose.yml
        run: |
          ./install.sh --dir "$HOME/hookflow" --version v0.0.0-ci --port 8080 --no-start --yes
          # Point it at the images just built rather than pulling the release.
          cd "$HOME/hookflow"
          sed -i 's|^API_IMAGE_TAG=.*|API_IMAGE_TAG=test|;s|^WORKER_IMAGE_TAG=.*|WORKER_IMAGE_TAG=test|;s|^UI_IMAGE_TAG=.*|UI_IMAGE_TAG=test|' .env
          echo "DOCKER_REGISTRY=webhook-platform" >> .env
          # COMPOSE_PROFILES comes from the .env the installer wrote: the
          # database and the backup sidecar are behind profiles, so a run that
          # ignored it would come up with no database at all.
          grep -q '^COMPOSE_PROFILES=.*embedded-db' .env || { echo "::error::installer did not enable embedded-db"; exit 1; }
          docker compose up -d

      - name: Wait for the platform
        run: |
          cd "$HOME/hookflow"
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/actuator/health/liveness && { echo "up after ${i}0s"; exit 0; }
            sleep 10
          done
          echo "::error::the stack did not come up"
          docker compose ps
          docker compose logs
          exit 1

      - name: Everything is on the one port, and only what should be
        run: |
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$1")
            printf '%-30s %s (want %s)\n' "$1" "$code" "$2"
            [ "$code" = "$2" ] || { echo "::error::$1 returned $code, expected $2"; exit 1; }
          }
          check /                          200   # dashboard
          check /docs                      200   # public docs, no account
          check /actuator/health/liveness  200   # probes
          check /api/v1/projects           401   # reachable, and refusing anonymous access
          # Neither of these may be public: metrics leak tenant cardinality and
          # traffic volume, and /actuator/env leaks the configuration wholesale.
          check /actuator/prometheus       404
          check /actuator/env              404
          # A wrong method must not read as a server error — 5xx tells every
          # sender with a retry policy to come back and try again.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ingress/nope)
          [ "$code" = "405" ] || { echo "::error::GET /ingress/nope returned $code, expected 405"; exit 1; }
          echo "method handling ok"

      - name: Nothing else is bound to the host
        run: |
          # The single-port promise. Postgres, Kafka, Redis and the API itself
          # must be reachable only from inside the Docker network.
          for p in 5432 9092 6379 8082 5173; do
            if curl -s -o /dev/null --max-time 2 "http://localhost:$p" 2>/dev/null \
               || nc -z localhost "$p" 2>/dev/null; then
              echo "::error::port $p is published to the host; only the web port should be"
              exit 1
            fi
          done
          echo "only the web port is published"

      - name: Registering leaves the dashboard usable
        run: |
          # With no SMTP there is no way to deliver a verification token, and a
          # PENDING_VERIFICATION account meets a dashboard with every write
          # button disabled.
          body=$(curl -sf -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"Smoke1234!","fullName":"Smoke","organizationName":"Smoke Co"}')
          echo "$body" | grep -q '"emailVerified":true' \
            || { echo "::error::registration did not complete verified: $body"; exit 1; }
          token=$(echo "$body" | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
          curl -sf http://localhost:8080/api/v1/auth/me -H "Authorization: Bearer $token" \
            | grep -q '"status":"ACTIVE"' || { echo "::error::/me did not report ACTIVE"; exit 1; }

      - name: The installer's own checks pass against what it wrote
        env:
          HOOKFLOW_COMPOSE_SRC: ${{ github.workspace }}/docker-compose.yml
        run: ./install.sh --check --dir "$HOME/hookflow"

      - name: A domain install wires TLS in without publishing the dashboard
        env:
          HOOKFLOW_COMPOSE_SRC: ${{ github.workspace }}/docker-compose.yml
        run: |
          # No certificate can be issued in CI, so this checks the wiring: the
          # terminator is in the service list, the dashboard has moved to
          # loopback behind it, and production mode is on.
          ./install.sh --dir "$HOME/hookflow-tls" --version v0.0.0-ci \
            --domain hooks.example.com --email ops@example.com --no-start --yes
          cd "$HOME/hookflow-tls"
          docker compose config --services | grep -qx caddy || { echo "::error::no TLS terminator"; exit 1; }
          docker compose config | grep -q "host_ip: 127.0.0.1" || { echo "::error::dashboard still bound publicly"; exit 1; }
          grep -qx 'APP_ENV=production' .env || { echo "::error::APP_ENV not production"; exit 1; }
          grep -q '^CORS_ALLOWED_ORIGINS=https://hooks.example.com$' .env || { echo "::error::CORS not on the domain"; exit 1; }
          test -f Caddyfile || { echo "::error::no Caddyfile"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: cd "$HOME/hookflow" && docker compose logs || true

      - name: Tear down
        if: always()
        run: cd "$HOME/hookflow" && docker compose down -v || true

  upgrade-smoke:
    name: Upgrade Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 30

    # CI tested a fresh install and a backup/restore, and nothing tested the path most
    # deployments actually take: an instance that already has data, upgraded in place. That is
    # also the riskiest one - UPGRADING.md is the most dangerous document in the repository,
    # and OPERATIONS.md admits that backward-compatibility of migrations under a rolling
    # deploy is argued rather than verified.
    #
    # So: install the last release, put real rows in it, swap in the images built from this
    # branch, and check the rows survived and the platform still works. Flyway runs against a
    # populated schema, which is the thing a fresh install can never exercise.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Find the last release tag
        id: last
        run: |
          tag=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$tag" ]; then
            echo "::notice::no release tag yet, nothing to upgrade from"
            echo "found=" >> "$GITHUB_OUTPUT"
          else
            echo "upgrading from $tag"
            echo "found=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the last release
        if: steps.last.outputs.found != ''
        run: |
          ./install.sh --dir "$HOME/hookflow" --version "${{ steps.last.outputs.found }}" \
            --port 8080 --yes
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/actuator/health/liveness && break
            sleep 10
          done
          curl -sf -o /dev/null http://localhost:8080/actuator/health/liveness \
            || { echo "::error::the released version did not come up"; cd "$HOME/hookflow" && docker compose logs; exit 1; }

      - name: Put data in it
        if: steps.last.outputs.found != ''
        id: seed
        run: |
          set -e
          body=$(curl -sf -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"upgrade@example.com","password":"Upgrade1234!","fullName":"Before","organizationName":"Upgrade Co"}')
          token=$(echo "$body" | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
          project=$(curl -sf -X POST http://localhost:8080/api/v1/projects \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"Before the upgrade"}')
          project_id=$(echo "$project" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          key=$(curl -sf -X POST "http://localhost:8080/api/v1/projects/$project_id/api-keys" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"before"}' | sed -n 's/.*"key":"\([^"]*\)".*/\1/p')
          # An event, so the upgrade meets rows in the tables a migration is most likely to
          # touch rather than an empty schema.
          curl -sf -X POST http://localhost:8080/api/v1/events \
            -H "X-API-Key: $key" -H 'Content-Type: application/json' \
            -d '{"type":"upgrade.before","data":{"n":1}}' > /dev/null
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "api_key=$key" >> "$GITHUB_OUTPUT"

      - name: Build this branch's images
        if: steps.last.outputs.found != ''
        run: |
          set -e
          for svc in api worker ui; do
            docker buildx build --load \
              -f "webhook-platform-${svc}/Dockerfile" \
              -t "webhook-platform-${svc}:test" \
              --cache-from "type=gha,scope=${svc}" .
          done

      - name: Upgrade in place
        if: steps.last.outputs.found != ''
        env:
          HOOKFLOW_COMPOSE_SRC: ${{ github.workspace }}/docker-compose.yml
        run: |
          set -e
          cd "$HOME/hookflow"
          # The Compose file from this branch, against the .env and the volumes the release
          # left behind - which is what an operator following UPGRADING.md ends up with.
          cp "$HOOKFLOW_COMPOSE_SRC" docker-compose.yml
          sed -i 's|^API_IMAGE_TAG=.*|API_IMAGE_TAG=test|;s|^WORKER_IMAGE_TAG=.*|WORKER_IMAGE_TAG=test|;s|^UI_IMAGE_TAG=.*|UI_IMAGE_TAG=test|' .env
          grep -q '^DOCKER_REGISTRY=' .env && sed -i 's|^DOCKER_REGISTRY=.*|DOCKER_REGISTRY=webhook-platform|' .env \
            || echo "DOCKER_REGISTRY=webhook-platform" >> .env
          docker compose up -d
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/actuator/health/liveness && { echo "up after ${i}0s"; exit 0; }
            sleep 10
          done
          echo "::error::the upgraded stack did not come up - most likely a migration against a populated schema"
          docker compose ps
          docker compose logs api
          exit 1

      - name: The data is still there and still works
        if: steps.last.outputs.found != ''
        run: |
          set -e
          # Reading with the credential minted before the upgrade: this is what a customer's
          # integration does the morning after, and a broken JWT claim or API-key hash would
          # show up here rather than in a fresh install.
          curl -sf "http://localhost:8080/api/v1/projects/${{ steps.seed.outputs.project_id }}/events" \
            -H "X-API-Key: ${{ steps.seed.outputs.api_key }}" \
            | grep -q 'upgrade.before' \
            || { echo "::error::the event created before the upgrade is gone"; exit 1; }

          curl -sf -X POST http://localhost:8080/api/v1/events \
            -H "X-API-Key: ${{ steps.seed.outputs.api_key }}" -H 'Content-Type: application/json' \
            -d '{"type":"upgrade.after","data":{"n":2}}' \
            | grep -q '"eventId"' \
            || { echo "::error::ingest is broken after the upgrade"; exit 1; }
          echo "data survived and ingest still works"

      - name: Dump logs on failure
        if: failure() && steps.last.outputs.found != ''
        run: cd "$HOME/hookflow" && docker compose logs || true

  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build API image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: webhook-platform-api/Dockerfile
          tags: webhook-platform-api:test
          load: true
          cache-from: type=gha,scope=api
      
      - name: Build Worker image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: webhook-platform-worker/Dockerfile
          tags: webhook-platform-worker:test
          load: true
          cache-from: type=gha,scope=worker
      
      - name: Build UI image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: webhook-platform-ui/Dockerfile
          tags: webhook-platform-ui:test
          load: true
          cache-from: type=gha,scope=ui
      
      - name: Install Trivy
        run: |
          # Same reason as the kubeconform download: fetch, then run.
          curl -sfL --retry 5 --retry-delay 2 --retry-all-errors \
            -o install-trivy.sh \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh
          sudo sh install-trivy.sh -b /usr/local/bin
          trivy --version
      
      - name: Download Trivy DBs
        run: |
          trivy image --download-db-only --db-repository public.ecr.aws/aquasecurity/trivy-db:2
          trivy image --download-java-db-only --java-db-repository public.ecr.aws/aquasecurity/trivy-java-db:1
      
      # Staged rollout: gate on CRITICAL now (exit-code 1, build goes red), keep
      # HIGH informational (exit-code 0) until the CRITICAL backlog is triaged.
      # Widen to HIGH by dropping `--severity CRITICAL --exit-code 1` for the
      # advisory step below and deleting the gating step once ready.
      - name: Run Trivy on API image (CRITICAL - gating)
        run: trivy image --format table --severity CRITICAL --exit-code 1 --skip-db-update --skip-java-db-update webhook-platform-api:test

      - name: Run Trivy on API image (HIGH - informational)
        if: always()
        run: trivy image --format table --severity HIGH --exit-code 0 --skip-db-update --skip-java-db-update webhook-platform-api:test

      - name: Run Trivy on Worker image (CRITICAL - gating)
        if: always()
        run: trivy image --format table --severity CRITICAL --exit-code 1 --skip-db-update --skip-java-db-update webhook-platform-worker:test

      - name: Run Trivy on Worker image (HIGH - informational)
        if: always()
        run: trivy image --format table --severity HIGH --exit-code 0 --skip-db-update --skip-java-db-update webhook-platform-worker:test

      - name: Run Trivy on UI image (CRITICAL - gating)
        if: always()
        run: trivy image --format table --severity CRITICAL --exit-code 1 --skip-db-update --skip-java-db-update webhook-platform-ui:test

      - name: Run Trivy on UI image (HIGH - informational)
        if: always()
        run: trivy image --format table --severity HIGH --exit-code 0 --skip-db-update --skip-java-db-update webhook-platform-ui:test

      - name: Container Scan Summary
        if: always()
        run: |
          echo "### Container Scan (Trivy) Results" >> $GITHUB_STEP_SUMMARY
          echo "Container vulnerability scan completed for all images." >> $GITHUB_STEP_SUMMARY
          echo "CRITICAL findings fail the build; HIGH is informational during the staged rollout." >> $GITHUB_STEP_SUMMARY
