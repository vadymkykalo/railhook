name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # pom.xml may run a -SNAPSHOT ahead of the other versions between releases.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check pom / Chart / UI / SDK versions agree
        run: scripts/check-version-drift.sh

  helm-lint:
    name: Helm Chart Lint & Render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.3

      - name: helm lint
        run: helm lint deploy/helm/railhook

      # Both values files: values-production.yaml reaches templates the defaults never render.
      - name: helm template
        run: |
          set -euo pipefail
          mkdir -p rendered
          helm template railhook deploy/helm/railhook \
            > rendered/default.yaml
          helm template railhook deploy/helm/railhook \
            -f deploy/helm/railhook/values-production.yaml \
            > rendered/production.yaml
          wc -l rendered/*.yaml
          # Tunnel and incoming-source URLs must follow the public address, never the API's localhost default.
          for f in rendered/*.yaml; do
            grep -q 'WEBHOOK_INGRESS_BASE_URL: "http' "$f" \
              || { echo "::error::$f sets no WEBHOOK_INGRESS_BASE_URL"; exit 1; }
            # The UI's canonical and og tags come from the container, not the image.
            grep -A1 'name: RAILHOOK_SITE_URL' "$f" | grep -q 'value: "http' \
              || { echo "::error::$f passes no RAILHOOK_SITE_URL to the UI"; exit 1; }
            grep -q 'name: RAILHOOK_CAPTCHA_SITE_KEY' "$f" \
              || { echo "::error::$f passes no RAILHOOK_CAPTCHA_SITE_KEY to the UI"; exit 1; }
          done

      - name: Validate rendered manifests against the Kubernetes schema
        run: |
          set -euo pipefail
          # Downloaded to a file, not piped into tar: a retry cannot rescue a half-read pipe.
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          # -strict catches typo'd keys Kubernetes silently ignores; the extra schema source covers the CRDs.
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/default.yaml rendered/production.yaml

      # The UI port lives in nginx.conf, the Deployment and the probes, and nothing else ties them together.
      - name: UI container port matches nginx.conf
        run: |
          set -euo pipefail
          NGINX_PORT=$(sed -n 's/^[[:space:]]*listen[[:space:]]\+\([0-9]\+\);.*/\1/p' \
            railhook-ui/nginx.conf | head -1)
          echo "nginx.conf listens on ${NGINX_PORT}"

          python3 - "$NGINX_PORT" <<'EOF'
          import sys, yaml
          expected = int(sys.argv[1])
          failures = []
          for doc in yaml.safe_load_all(open('rendered/default.yaml')):
              if not doc or doc.get('kind') != 'Deployment':
                  continue
              if not doc['metadata']['name'].endswith('-ui'):
                  continue
              for c in doc['spec']['template']['spec']['containers']:
                  for port in c.get('ports', []):
                      if port['containerPort'] != expected:
                          failures.append(f"containerPort {port['containerPort']}")
                  for probe in ('livenessProbe', 'readinessProbe', 'startupProbe'):
                      http = (c.get(probe) or {}).get('httpGet')
                      if http and http.get('port') != expected:
                          failures.append(f"{probe} port {http.get('port')}")
          if failures:
              sys.exit(f"::error::UI chart disagrees with nginx.conf ({expected}): " + ", ".join(failures))
          print(f"UI Deployment and probes all target {expected}.")
          EOF

  # A render is not an install: missing env vars and templates once crash-looped every pod.
  helm-kind-smoke:
    name: Helm Chart Install Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 30

    env:
      KIND_CLUSTER: railhook-smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download the three images
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Load the three images
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/images/*.tar.zst; do zstd -dc "$f" | docker load; done
          docker image inspect railhook-api:test railhook-worker:test railhook-ui:test > /dev/null

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: railhook-smoke
          node_image: kindest/node:v1.31.0

      - name: Load the images into the cluster
        run: |
          set -e
          for svc in api worker ui; do
            kind load docker-image "railhook-${svc}:test" --name "$KIND_CLUSTER"
          done

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.3

      # Verbatim from the chart README's "Create secrets" step.
      - name: Create secrets, the way the chart README says to
        run: |
          set -e
          kubectl create secret generic railhook-secrets \
            --from-literal=encryption-key="$(openssl rand -base64 32)" \
            --from-literal=encryption-salt="$(openssl rand -base64 24)" \
            --from-literal=jwt-secret="$(openssl rand -base64 64)"
          kubectl create secret generic railhook-postgresql-secret \
            --from-literal=password="$(openssl rand -base64 32)"
          kubectl create secret generic railhook-redis-secret \
            --from-literal=password="$(openssl rand -base64 32)"

      - name: Stand up PostgreSQL, Kafka and Redis
        run: |
          set -e
          kubectl apply -f deploy/ci/kind-dependencies.yaml

          # One deadline each: a shared clock blames the healthy ones for the slow one's time.
          for d in postgres kafka redis; do
            if ! kubectl wait --for=condition=available --timeout=4m "deployment/$d"; then
              echo "::error::$d never became available"
              kubectl logs "deployment/$d" --tail=100 || true
              exit 1
            fi
          done

      # One replica, no HPA: a kind node cannot fit the production counts.
      - name: helm install
        run: |
          set -e
          helm install railhook deploy/helm/railhook \
            --wait --timeout 15m \
            --set postgresql.external.host=postgres \
            --set kafka.external.bootstrapServers=kafka:9092 \
            --set redis.external.host=redis \
            --set api.image.repository=railhook-api \
            --set api.image.tag=test \
            --set worker.image.repository=railhook-worker \
            --set worker.image.tag=test \
            --set ui.image.repository=railhook-ui \
            --set ui.image.tag=test \
            --set api.replicaCount=1 \
            --set worker.replicaCount=1 \
            --set ui.replicaCount=1 \
            --set api.hpa.enabled=false \
            --set worker.hpa.enabled=false \
            --set api.pdb.enabled=true \
            --set worker.pdb.enabled=true \
            --set ui.pdb.enabled=true

      - name: Every workload came up
        run: |
          set -e
          kubectl get pods -o wide
          kubectl rollout status deployment/railhook-api --timeout=5m
          kubectl rollout status deployment/railhook-worker --timeout=5m
          kubectl rollout status deployment/railhook-ui --timeout=5m

      - name: The PodDisruptionBudgets exist
        run: |
          set -e
          kubectl get pdb
          COUNT=$(kubectl get pdb -o name | wc -l)
          [ "$COUNT" = "3" ] || { echo "::error::expected 3 PodDisruptionBudgets, found $COUNT"; exit 1; }

      - name: Mail links do not point at localhost
        run: |
          set -e
          BASE=$(kubectl get configmap railhook-config -o jsonpath='{.data.APP_BASE_URL}')
          CORS=$(kubectl get configmap railhook-config -o jsonpath='{.data.CORS_ALLOWED_ORIGINS}')
          echo "APP_BASE_URL=$BASE  CORS_ALLOWED_ORIGINS=$CORS"
          case "$BASE$CORS" in
            *localhost*|*127.0.0.1*|"")
              echo "::error::APP_BASE_URL/CORS_ALLOWED_ORIGINS still point at localhost: $BASE / $CORS"
              exit 1 ;;
          esac

      - name: Health and metrics answer from inside the cluster
        run: |
          set -e
          kubectl run smoke-curl --image=curlimages/curl:8.10.1 --restart=Never \
            --command -- sleep 1800
          kubectl wait --for=condition=ready pod/smoke-curl --timeout=3m

          check() {
            code=$(kubectl exec smoke-curl -- \
              curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$1")
            printf '%-56s %s (want %s)\n' "$1" "$code" "$2"
            [ "$code" = "$2" ] || { echo "::error::$1 returned $code, expected $2"; exit 1; }
          }

          check http://railhook-api:8082/actuator/health          200
          check http://railhook-worker:8081/actuator/health/liveness 200
          # 200 here, not the 401 it got while actuator shared the authenticated main port.
          check http://railhook-api:8082/actuator/prometheus      200
          check http://railhook-worker:8081/actuator/prometheus   200
          # "Not 200" rather than a code: whether 401 or 404 answers first is not the invariant.
          code=$(kubectl exec smoke-curl -- \
            curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            http://railhook-api:8080/actuator/prometheus)
          echo "http://railhook-api:8080/actuator/prometheus  $code (want anything but 200)"
          [ "$code" != "200" ] || { echo "::error::metrics are served unauthenticated on the traffic port"; exit 1; }
          # The UI's nginx proxies /actuator/health to the literal upstream `api` on 8082.
          check http://api:8082/actuator/health/liveness          200
          check http://railhook-ui/                               200
          check http://railhook-ui/actuator/health/liveness       200

      - name: Helm Kind Smoke Summary
        if: always()
        run: |
          echo "### Helm Chart Install Smoke Test" >> $GITHUB_STEP_SUMMARY
          echo "install into kind -> pods Ready -> health 200 -> metrics 200 (not 401)" >> $GITHUB_STEP_SUMMARY

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get all -o wide || true
          kubectl get events --sort-by=.lastTimestamp || true
          kubectl describe pods || true
          kubectl logs -l app.kubernetes.io/component=api --tail=200 --prefix || true
          kubectl logs -l app.kubernetes.io/component=worker --tail=200 --prefix || true
          kubectl logs -l app.kubernetes.io/component=ui --tail=100 --prefix || true

      - name: Tear down
        if: always()
        run: helm uninstall railhook || true

  backend-build:
    name: Backend Build & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Compile all modules
        run: mvn clean compile -B
        
      - name: Package artifacts
        run: mvn package -DskipTests -B

      - name: Upload CLI JAR
        uses: actions/upload-artifact@v7
        with:
          name: railhook-cli
          path: railhook-cli/target/railhook-cli-*.jar
          retention-days: 30

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: backend-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      # Distinct exec file names so coverage-report's **/jacoco*.exec picks up both jobs.
      - name: Check test routing
        run: scripts/check-test-routing.sh

      - name: Run unit tests
        run: mvn test -B -Dtest='!*IntegrationTest,!*IT,!*RepositoryTest,!*ConcurrencyTest,!*RbacTest,!*IsolationTest' -Djacoco.destFile=target/jacoco-unit.exec --fail-at-end

      - name: Test Summary
        if: always()
        run: |
          echo "### Backend Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Unit tests completed. See workflow logs for details." >> $GITHUB_STEP_SUMMARY

      # Uploaded even on failure so the aggregate job still gets the fullest picture.
      - name: Upload unit test coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-unit-exec
          path: railhook-*/target/jacoco-unit.exec
          retention-days: 7
          if-no-files-found: warn

  backend-integration-test-shard:
    name: Backend Integration Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: backend-build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Pick this shard's test classes
        id: pick
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          scripts/ci-integration-shard.sh --list "$SHARDS" | awk -v s="$SHARD" '$1 == s { print $2 }'
          tests=$(scripts/ci-integration-shard.sh "$SHARD" "$SHARDS")
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      - name: Run integration tests with Testcontainers
        # failIfNoSpecifiedTests=false: modules like common and cli match no class in -Dtest.
        run: mvn test -B -Dtest="$TESTS" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Djacoco.destFile=target/jacoco-it-${{ matrix.shard }}.exec --fail-at-end
        env:
          TESTS: ${{ steps.pick.outputs.tests }}
          TESTCONTAINERS_RYUK_DISABLED: true
          DOCKER_API_VERSION: "1.44"

      - name: Integration Test Summary
        if: always()
        run: |
          echo "### Backend Integration Test Results (shard ${{ matrix.shard }})" >> $GITHUB_STEP_SUMMARY
          echo "Integration tests with Testcontainers completed." >> $GITHUB_STEP_SUMMARY
          echo "- PostgreSQL: Testcontainers" >> $GITHUB_STEP_SUMMARY

      # Tarred: upload-artifact drops the railhook-<module>/target/ prefix when all files share it.
      - name: Pack integration test coverage data
        if: always()
        run: |
          shopt -s nullglob
          files=(railhook-*/target/jacoco-it-${{ matrix.shard }}.exec)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::shard ${{ matrix.shard }} wrote no coverage data"
          else
            tar -cf jacoco-it-${{ matrix.shard }}.tar "${files[@]}"
          fi

      - name: Upload integration test coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-integration-exec-${{ matrix.shard }}
          path: jacoco-it-${{ matrix.shard }}.tar
          retention-days: 7
          if-no-files-found: warn

  # Keeps the required check name; fails unless every shard passed.
  backend-integration-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: backend-integration-test-shard
    if: always()

    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.backend-integration-test-shard.result }}
        run: |
          echo "integration test shards: $RESULT"
          [ "$RESULT" = "success" ] || { echo "::error::an integration test shard did not succeed ($RESULT)"; exit 1; }

  # !cancelled() so partial coverage still shows when one suite has unrelated failures.
  coverage-report:
    name: Aggregate Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-test, backend-integration-test]
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download unit test coverage data
        uses: actions/download-artifact@v8
        with:
          name: jacoco-unit-exec
        continue-on-error: true

      - name: Download integration test coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: jacoco-integration-exec-*
          merge-multiple: true
          path: ${{ runner.temp }}/jacoco-it
        continue-on-error: true

      - name: Unpack integration test coverage data
        run: |
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/jacoco-it/*.tar)
          echo "integration coverage archives: ${#archives[@]}"
          for a in "${archives[@]}"; do tar -xvf "$a"; done

      # `verify`, not `test`: jacoco merge and check bind to verify, and only this job has both exec sets.
      - name: Compile modules, aggregate report, threshold check
        run: mvn verify -B -pl railhook-coverage-report -am -DskipTests

      - name: Coverage Summary
        if: always()
        run: |
          echo "### Coverage Report (unit + integration merged)" >> $GITHUB_STEP_SUMMARY
          if [ -f target/site/jacoco-aggregate/index.html ]; then
            echo "Aggregate report generated - see the jacoco-aggregate-report artifact." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::No aggregate report was produced - check the exec-data download steps above." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload aggregate coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-aggregate-report
          path: target/site/jacoco-aggregate
          retention-days: 30
          if-no-files-found: warn

  restore-drill:
    name: Backup/Restore Drill
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create .env from .env.dist
        run: cp .env.dist .env

      - name: Start embedded Postgres
        run: docker compose --profile embedded-db up -d postgres

      # Over TCP: the socket answers ready during the image's temporary init server.
      - name: Wait for Postgres to be ready
        run: |
          for i in $(seq 1 45); do
            if docker exec webhook-postgres pg_isready -h 127.0.0.1 -U webhook_user -d webhook_platform \
               && docker exec webhook-postgres psql -U webhook_user -d webhook_platform -c 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres never became ready"
          exit 1

      - name: Seed test data (simulates "ingest some events")
        run: |
          docker exec webhook-postgres psql -U webhook_user -d webhook_platform -c \
            "CREATE TABLE restore_drill_test (id serial primary key, note text);"
          docker exec webhook-postgres psql -U webhook_user -d webhook_platform -c \
            "INSERT INTO restore_drill_test (note) VALUES ('event-1'), ('event-2'), ('event-3');"

      - name: Backup (make backup-db)
        run: make backup-db

      - name: Destroy the data
        run: docker exec webhook-postgres psql -U webhook_user -d webhook_platform -c "DROP TABLE restore_drill_test;"

      - name: Restore (make restore-db)
        run: |
          FILE=$(ls -t backups/webhook_platform_*.dump | head -1)
          echo "Restoring from $FILE"
          make restore-db FILE="$FILE" CONFIRM=YES

      - name: Assert data integrity
        run: |
          COUNT=$(docker exec webhook-postgres psql -U webhook_user -d webhook_platform -tAc "SELECT count(*) FROM restore_drill_test;")
          echo "Row count after restore: $COUNT"
          if [ "$COUNT" != "3" ]; then
            echo "::error::Restore drill FAILED — expected 3 rows after restore, got $COUNT"
            exit 1
          fi
          NOTES=$(docker exec webhook-postgres psql -U webhook_user -d webhook_platform -tAc "SELECT string_agg(note, ',' ORDER BY id) FROM restore_drill_test;")
          if [ "$NOTES" != "event-1,event-2,event-3" ]; then
            echo "::error::Restore drill FAILED — row content mismatch: $NOTES"
            exit 1
          fi

      - name: Restore Drill Summary
        if: always()
        run: |
          echo "### Backup/Restore Drill Results" >> $GITHUB_STEP_SUMMARY
          echo "backup -> destroy -> restore -> assert data integrity: PASSED" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: docker compose --profile embedded-db down -v

  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            railhook-ui/package-lock.json
            railhook-docs/package-lock.json

      - name: Install dependencies
        working-directory: railhook-ui
        run: npm ci

      # A step, not a job: main's required checks are a fixed list of job names.
      - name: Check generated API types match openapi.yaml
        run: scripts/check-types-drift.sh

      - name: Check docs site (env reference, tests, build with link validation)
        working-directory: railhook-docs
        run: |
          npm ci
          node scripts/env-reference.mjs --check
          node --test "scripts/*.test.mjs"
          npm run build

      - name: Check sitemap.xml matches the public route list
        working-directory: railhook-ui
        run: npm run seo:sitemap:check

      - name: Run ESLint
        working-directory: railhook-ui
        run: npm run lint
      
      - name: Run TypeScript typecheck
        working-directory: railhook-ui
        run: npm run typecheck

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend-lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: railhook-ui/package-lock.json
      
      - name: Install dependencies
        working-directory: railhook-ui
        run: npm ci
      
      - name: Run tests with coverage
        working-directory: railhook-ui
        run: npm run test:coverage

      - name: Test Summary
        if: always()
        run: |
          echo "### Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Vitest tests + coverage thresholds completed. See workflow logs for details." >> $GITHUB_STEP_SUMMARY

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage-report
          path: railhook-ui/coverage
          retention-days: 30
          if-no-files-found: warn

  sdk-test:
    name: SDK Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Unit tests only; the contract tests need a live platform and stay nightly.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            sdks/node/package-lock.json
            sdks/mcp/package-lock.json

      - name: Node SDK tests
        working-directory: sdks/node
        run: |
          npm ci
          npm test

      # Built as well as tested: `bin` points into dist/.
      - name: MCP bridge tests
        working-directory: sdks/mcp
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Python SDK tests
        working-directory: sdks/python
        run: |
          pip install -e ".[dev]"
          pytest -m "not contract"

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: PHP SDK tests
        working-directory: sdks/php
        run: |
          composer install --prefer-dist --no-progress
          vendor/bin/phpunit --no-coverage

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-lint, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: railhook-ui/package-lock.json
      
      - name: Install dependencies
        working-directory: railhook-ui
        run: npm ci
      
      - name: Build production bundle
        working-directory: railhook-ui
        run: npm run build
      
      - name: Build Summary
        if: always()
        run: |
          echo "### Frontend Build Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ ESLint passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ TypeScript typecheck passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Production build successful" >> $GITHUB_STEP_SUMMARY

  # Not a required check: a flaky browser job must not wedge merges into main.
  frontend-e2e:
    name: Frontend E2E (mobile + desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: railhook-ui/package-lock.json

      - name: Install dependencies
        working-directory: railhook-ui
        run: npm ci

      - name: Install Chromium
        working-directory: railhook-ui
        run: npx playwright install --with-deps chromium

      - name: Build and run the layout checks
        working-directory: railhook-ui
        run: npm run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            railhook-ui/playwright-report
            railhook-ui/test-results
          retention-days: 7

  security-sast:
    name: SAST (SpotBugs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      # Advisory until the existing findings are triaged; then drop continue-on-error.
      - name: Run SpotBugs analysis
        run: mvn compile com.github.spotbugs:spotbugs-maven-plugin:4.8.3.1:check -B -DskipTests
        continue-on-error: true

      - name: SAST Summary
        if: always()
        run: |
          echo "### SAST (SpotBugs) Results" >> $GITHUB_STEP_SUMMARY
          echo "Static analysis completed. Check workflow logs for findings." >> $GITHUB_STEP_SUMMARY
          echo "_Advisory only — see comment in ci.yml for why this doesn't gate yet._" >> $GITHUB_STEP_SUMMARY


  docker-build:
    name: Docker Images (${{ matrix.svc }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        svc: [api, worker, ui]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      
      - name: Build the ${{ matrix.svc }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: railhook-${{ matrix.svc }}/Dockerfile
          tags: railhook-${{ matrix.svc }}:test
          outputs: type=docker,dest=${{ runner.temp }}/railhook-${{ matrix.svc }}.tar
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}

      - name: Compress the image
        run: zstd -T0 -3 --rm "$RUNNER_TEMP/railhook-${{ matrix.svc }}.tar"

      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.svc }}
          path: ${{ runner.temp }}/railhook-${{ matrix.svc }}.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  install-smoke:
    name: Installer Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download the three images
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Load the three images
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/images/*.tar.zst; do zstd -dc "$f" | docker load; done
          docker image inspect railhook-api:test railhook-worker:test railhook-ui:test > /dev/null

      - name: Install, exactly as the README says
        env:
          # Test the Compose file in this PR, not the one in the last release.
          RAILHOOK_COMPOSE_SRC: ${{ github.workspace }}/docker-compose.yml
        run: |
          ./install.sh --dir "$HOME/railhook" --version v0.0.0-ci --port 8080 --no-start --yes
          # Point it at the images just built rather than pulling the release.
          cd "$HOME/railhook"
          sed -i 's|^API_IMAGE_TAG=.*|API_IMAGE_TAG=test|;s|^WORKER_IMAGE_TAG=.*|WORKER_IMAGE_TAG=test|;s|^UI_IMAGE_TAG=.*|UI_IMAGE_TAG=test|' .env
          echo "DOCKER_REGISTRY=railhook" >> .env
          # The database and backup sidecar sit behind profiles from the installer's .env.
          grep -q '^COMPOSE_PROFILES=.*embedded-db' .env || { echo "::error::installer did not enable embedded-db"; exit 1; }
          # Without --admin-email nobody is a platform admin: no first-account-wins.
          grep -qx 'PLATFORM_ADMIN_EMAILS=' .env || { echo "::error::a plain install named a platform admin"; exit 1; }
          # Pre-rename variable names are gone for good; nothing reads them.
          ! grep -q '^HOOKFLOW_' .env || { echo "::error::installer still writes HOOKFLOW_* variables"; exit 1; }
          docker compose up -d

      - name: Wait for the platform
        run: |
          cd "$HOME/railhook"
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/actuator/health/liveness && { echo "up after ${i}0s"; exit 0; }
            sleep 10
          done
          echo "::error::the stack did not come up"
          docker compose ps
          docker compose logs
          exit 1

      - name: Everything is on the one port, and only what should be
        run: |
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$1")
            printf '%-30s %s (want %s)\n' "$1" "$code" "$2"
            [ "$code" = "$2" ] || { echo "::error::$1 returned $code, expected $2"; exit 1; }
          }
          check /                          200   # dashboard
          check /docs/                     200   # public docs site, no account
          check /install.sh                200   # the installer, served by the site it installs
          check /actuator/health/liveness  200   # probes
          check /api/v1/projects           401   # reachable, and refusing anonymous access
          # Metrics leak tenant cardinality, and /actuator/env the whole configuration.
          check /actuator/prometheus       404
          check /actuator/env              404
          # A 5xx would tell every sender with a retry policy to try again.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ingress/nope)
          [ "$code" = "405" ] || { echo "::error::GET /ingress/nope returned $code, expected 405"; exit 1; }
          echo "method handling ok"

      - name: Nothing else is bound to the host
        run: |
          # The single-port promise: Postgres, Kafka, Redis and the API stay inside the Docker network.
          for p in 5432 9092 6379 8082 5173; do
            if curl -s -o /dev/null --max-time 2 "http://localhost:$p" 2>/dev/null \
               || nc -z localhost "$p" 2>/dev/null; then
              echo "::error::port $p is published to the host; only the web port should be"
              exit 1
            fi
          done
          echo "only the web port is published"

      - name: Registering leaves the dashboard usable
        run: |
          # Without SMTP no verification token can be delivered, and the dashboard stays read-only.
          body=$(curl -sf -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"Smoke1234!","fullName":"Smoke","organizationName":"Smoke Co"}')
          echo "$body" | grep -q '"emailVerified":true' \
            || { echo "::error::registration did not complete verified: $body"; exit 1; }
          token=$(echo "$body" | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
          curl -sf http://localhost:8080/api/v1/auth/me -H "Authorization: Bearer $token" \
            | grep -q '"status":"ACTIVE"' || { echo "::error::/me did not report ACTIVE"; exit 1; }

      - name: The installer's own checks pass against what it wrote
        env:
          RAILHOOK_COMPOSE_SRC: ${{ github.workspace }}/docker-compose.yml
        run: ./install.sh --check --dir "$HOME/railhook"

      - name: A domain install wires TLS in without publishing the dashboard
        env:
          RAILHOOK_COMPOSE_SRC: ${{ github.workspace }}/docker-compose.yml
        run: |
          # No certificate can be issued in CI, so this checks the wiring only.
          ./install.sh --dir "$HOME/railhook-tls" --version v0.0.0-ci \
            --domain hooks.example.com --email ops@example.com --admin-email ops@example.com --no-start --yes
          cd "$HOME/railhook-tls"
          grep -qx 'PLATFORM_ADMIN_EMAILS=ops@example.com' .env || { echo "::error::--admin-email was not written"; exit 1; }
          docker compose config --services | grep -qx caddy || { echo "::error::no TLS terminator"; exit 1; }
          docker compose config | grep -q "host_ip: 127.0.0.1" || { echo "::error::dashboard still bound publicly"; exit 1; }
          grep -qx 'APP_ENV=production' .env || { echo "::error::APP_ENV not production"; exit 1; }
          grep -q '^CORS_ALLOWED_ORIGINS=https://hooks.example.com$' .env || { echo "::error::CORS not on the domain"; exit 1; }
          # Stripe, GitHub and the CLI call these URLs, so they must be public.
          docker compose config | grep -qE 'WEBHOOK_INGRESS_BASE_URL: "?https://hooks.example.com"?$' \
            || { echo "::error::ingress URLs are not on the domain"; docker compose config | grep WEBHOOK_INGRESS_BASE_URL; exit 1; }
          # Test endpoint URLs are copied into curl, so a Docker-internal address is useless.
          docker compose config | grep -qE 'TEST_ENDPOINT_BASE_URL: "?https://hooks.example.com"?$' \
            || { echo "::error::test endpoint URLs are not on the domain"; docker compose config | grep TEST_ENDPOINT_BASE_URL; exit 1; }
          test -f Caddyfile || { echo "::error::no Caddyfile"; exit 1; }

      - name: A proxy install is production on the domain, with no TLS terminator of its own
        env:
          RAILHOOK_COMPOSE_SRC: ${{ github.workspace }}/docker-compose.yml
        run: |
          ./install.sh --dir "$HOME/railhook-proxy" --version v0.0.0-ci \
            --domain hooks.example.com --behind-proxy --no-start --yes
          cd "$HOME/railhook-proxy"
          ! docker compose config --services | grep -qx caddy || { echo "::error::caddy runs behind someone else's proxy"; exit 1; }
          test ! -e Caddyfile || { echo "::error::a Caddyfile was written for a proxy install"; exit 1; }
          docker compose config | grep -q "host_ip: 127.0.0.1" || { echo "::error::dashboard not on loopback"; exit 1; }
          docker compose config | grep -qE 'published: "?8080"?$' || { echo "::error::dashboard not on 8080"; exit 1; }
          grep -qx 'APP_ENV=production' .env || { echo "::error::APP_ENV not production"; exit 1; }
          grep -q '^APP_BASE_URL=https://hooks.example.com$' .env || { echo "::error::APP_BASE_URL not on the domain"; exit 1; }
          grep -q '^CORS_ALLOWED_ORIGINS=https://hooks.example.com$' .env || { echo "::error::CORS not on the domain"; exit 1; }
          grep -q '^WEBHOOK_TRUSTED_PROXIES=' .env || { echo "::error::proxy not trusted"; exit 1; }
          docker compose config | grep -qE 'WEBHOOK_INGRESS_BASE_URL: "?https://hooks.example.com"?$' \
            || { echo "::error::ingress URLs are not on the domain"; docker compose config | grep WEBHOOK_INGRESS_BASE_URL; exit 1; }
          cd "$GITHUB_WORKSPACE"
          ./install.sh --check --dir "$HOME/railhook-proxy"

      - name: The installer refuses what it cannot install
        run: |
          # A proxy install still needs to know the public URL.
          if out=$(./install.sh --dir "$HOME/railhook-noproxy" --behind-proxy --no-start --yes 2>&1); then
            echo "::error::--behind-proxy without --domain was accepted"; exit 1
          fi
          echo "$out" | grep -q -- '--domain' || { echo "::error::no explanation: $out"; exit 1; }
          # Releases before 2.12.0 are unsupported and published under another name.
          if out=$(./install.sh --dir "$HOME/railhook-old" --version v2.11.0 --no-start --yes 2>&1); then
            echo "::error::--version v2.11.0 was accepted"; exit 1
          fi
          echo "$out" | grep -q '2\.12\.0' || { echo "::error::no explanation: $out"; exit 1; }
          test ! -e "$HOME/railhook-old" || { echo "::error::files were written for a refused version"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: cd "$HOME/railhook" && docker compose logs || true

      - name: Tear down
        if: always()
        run: cd "$HOME/railhook" && docker compose down -v || true

  upgrade-smoke:
    name: Upgrade Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 30

    # Flyway against a populated schema, which a fresh install never exercises.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the last release tag
        id: last
        run: |
          tag=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$tag" ]; then
            echo "::notice::no release tag yet, nothing to upgrade from"
            echo "found=" >> "$GITHUB_OUTPUT"
          else
            echo "upgrading from $tag"
            echo "found=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the last release
        if: steps.last.outputs.found != ''
        run: |
          ./install.sh --dir "$HOME/railhook" --version "${{ steps.last.outputs.found }}" \
            --port 8080 --yes
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/actuator/health/liveness && break
            sleep 10
          done
          curl -sf -o /dev/null http://localhost:8080/actuator/health/liveness \
            || { echo "::error::the released version did not come up"; cd "$HOME/railhook" && docker compose logs; exit 1; }

      - name: Put data in it
        if: steps.last.outputs.found != ''
        id: seed
        run: |
          set -e
          body=$(curl -sf -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"upgrade@example.com","password":"Upgrade1234!","fullName":"Before","organizationName":"Upgrade Co"}')
          token=$(echo "$body" | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
          project=$(curl -sf -X POST http://localhost:8080/api/v1/projects \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"Before the upgrade"}')
          project_id=$(echo "$project" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          key=$(curl -sf -X POST "http://localhost:8080/api/v1/projects/$project_id/api-keys" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"before"}' | sed -n 's/.*"key":"\([^"]*\)".*/\1/p')
          # Rows in the tables a migration is most likely to touch.
          curl -sf -X POST http://localhost:8080/api/v1/events \
            -H "X-API-Key: $key" -H 'Content-Type: application/json' \
            -d '{"type":"upgrade.before","data":{"n":1}}' > /dev/null
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "api_key=$key" >> "$GITHUB_OUTPUT"

      - name: Download this branch's images
        if: steps.last.outputs.found != ''
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Load this branch's images
        if: steps.last.outputs.found != ''
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/images/*.tar.zst; do zstd -dc "$f" | docker load; done
          docker image inspect railhook-api:test railhook-worker:test railhook-ui:test > /dev/null

      - name: Upgrade in place
        if: steps.last.outputs.found != ''
        env:
          RAILHOOK_COMPOSE_SRC: ${{ github.workspace }}/docker-compose.yml
        run: |
          set -e
          cd "$HOME/railhook"
          # This branch's Compose file against the release's .env and volumes, as UPGRADING.md leaves them.
          cp "$RAILHOOK_COMPOSE_SRC" docker-compose.yml
          sed -i 's|^API_IMAGE_TAG=.*|API_IMAGE_TAG=test|;s|^WORKER_IMAGE_TAG=.*|WORKER_IMAGE_TAG=test|;s|^UI_IMAGE_TAG=.*|UI_IMAGE_TAG=test|' .env
          grep -q '^DOCKER_REGISTRY=' .env && sed -i 's|^DOCKER_REGISTRY=.*|DOCKER_REGISTRY=railhook|' .env \
            || echo "DOCKER_REGISTRY=railhook" >> .env
          docker compose up -d
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/actuator/health/liveness && { echo "up after ${i}0s"; exit 0; }
            sleep 10
          done
          echo "::error::the upgraded stack did not come up - most likely a migration against a populated schema"
          docker compose ps
          docker compose logs api
          exit 1

      - name: The data is still there and still works
        if: steps.last.outputs.found != ''
        run: |
          set -e
          # A credential minted before the upgrade: a broken JWT claim or API-key hash shows here.
          curl -sf "http://localhost:8080/api/v1/projects/${{ steps.seed.outputs.project_id }}/events" \
            -H "X-API-Key: ${{ steps.seed.outputs.api_key }}" \
            | grep -q 'upgrade.before' \
            || { echo "::error::the event created before the upgrade is gone"; exit 1; }

          curl -sf -X POST http://localhost:8080/api/v1/events \
            -H "X-API-Key: ${{ steps.seed.outputs.api_key }}" -H 'Content-Type: application/json' \
            -d '{"type":"upgrade.after","data":{"n":2}}' \
            | grep -q '"eventId"' \
            || { echo "::error::ingest is broken after the upgrade"; exit 1; }
          echo "data survived and ingest still works"

      - name: Dump logs on failure
        if: failure() && steps.last.outputs.found != ''
        run: cd "$HOME/railhook" && docker compose logs || true

  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Download the three images
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Load the three images
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/images/*.tar.zst; do zstd -dc "$f" | docker load; done
          docker image inspect railhook-api:test railhook-worker:test railhook-ui:test > /dev/null

      - name: Install Trivy
        env:
          TRIVY_VERSION: v0.74.0
        run: |
          # Whole install retried: the installer fetches its own tarball, and one TLS error once left no trivy.
          for attempt in 1 2 3; do
            if curl -sfL --retry 5 --retry-delay 2 --retry-all-errors \
                 -o install-trivy.sh \
                 "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
               && sudo sh install-trivy.sh -b /usr/local/bin "${TRIVY_VERSION}"; then
              break
            fi
            echo "Trivy install attempt ${attempt} failed; retrying"
            sleep $((attempt * 15))
          done
          trivy --version
      
      - name: Download Trivy DBs
        run: |
          trivy image --download-db-only --db-repository public.ecr.aws/aquasecurity/trivy-db:2
          trivy image --download-java-db-only --java-db-repository public.ecr.aws/aquasecurity/trivy-java-db:1
      
      # CRITICAL gates; HIGH stays advisory until the backlog is triaged.
      - name: Run Trivy on API image (CRITICAL - gating)
        run: trivy image --format table --severity CRITICAL --exit-code 1 --skip-db-update --skip-java-db-update railhook-api:test

      - name: Run Trivy on API image (HIGH - informational)
        if: always()
        run: trivy image --format table --severity HIGH --exit-code 0 --skip-db-update --skip-java-db-update railhook-api:test

      - name: Run Trivy on Worker image (CRITICAL - gating)
        if: always()
        run: trivy image --format table --severity CRITICAL --exit-code 1 --skip-db-update --skip-java-db-update railhook-worker:test

      - name: Run Trivy on Worker image (HIGH - informational)
        if: always()
        run: trivy image --format table --severity HIGH --exit-code 0 --skip-db-update --skip-java-db-update railhook-worker:test

      - name: Run Trivy on UI image (CRITICAL - gating)
        if: always()
        run: trivy image --format table --severity CRITICAL --exit-code 1 --skip-db-update --skip-java-db-update railhook-ui:test

      - name: Run Trivy on UI image (HIGH - informational)
        if: always()
        run: trivy image --format table --severity HIGH --exit-code 0 --skip-db-update --skip-java-db-update railhook-ui:test

      - name: Container Scan Summary
        if: always()
        run: |
          echo "### Container Scan (Trivy) Results" >> $GITHUB_STEP_SUMMARY
          echo "Container vulnerability scan completed for all images." >> $GITHUB_STEP_SUMMARY
          echo "CRITICAL findings fail the build; HIGH is informational during the staged rollout." >> $GITHUB_STEP_SUMMARY
