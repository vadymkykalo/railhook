name: Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to (re)publish, e.g. v1.2.3'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: vadymkykalo/railhook

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve version from tag
        id: resolve
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "::error::Tag '$RAW_TAG' is not a semver tag (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "ref=$RAW_TAG" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: railhook-api/Dockerfile
            description: 'Railhook webhook gateway: REST API and database migrations'
          - service: worker
            dockerfile: railhook-worker/Dockerfile
            description: 'Railhook webhook gateway: delivers, retries and forwards webhooks'
          - service: ui
            dockerfile: railhook-ui/Dockerfile
            description: 'Railhook webhook gateway: dashboard and docs'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A mirror for discoverability; GHCR stays what docker-compose.yml and the deploy pull.
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_NAMESPACE != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service }}
            ${{ vars.DOCKERHUB_NAMESPACE != '' && format('docker.io/{0}/railhook-{1}', vars.DOCKERHUB_NAMESPACE, matrix.service) || '' }}
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push (multi-arch, SBOM + provenance attached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # A republished older tag predates the overview, so it comes from the ref the workflow runs on.
      - name: Check out the Docker Hub overview
        if: vars.DOCKERHUB_NAMESPACE != ''
        uses: actions/checkout@v7
        with:
          path: .dockerhub
          sparse-checkout: deploy/dockerhub

      - name: Update Docker Hub description
        if: vars.DOCKERHUB_NAMESPACE != ''
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE }}/railhook-${{ matrix.service }}
          short-description: ${{ matrix.description }}
          readme-filepath: .dockerhub/deploy/dockerhub/README.md

      - name: Publish Summary
        run: |
          echo "### Published ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: linux/amd64, linux/arm64 — SBOM + provenance attached." >> "$GITHUB_STEP_SUMMARY"

  helm-publish:
    name: Publish Helm chart (OCI)
    runs-on: ubuntu-latest
    needs: [resolve-version, build-and-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: 'v3.16.3'

      - name: Log in to GHCR (Helm OCI)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Fetch chart dependencies
        run: helm dependency build deploy/helm/railhook

      - name: Lint chart
        run: helm lint deploy/helm/railhook

      - name: Package chart
        run: |
          helm package deploy/helm/railhook \
            --version "${{ needs.resolve-version.outputs.version }}" \
            --app-version "${{ needs.resolve-version.outputs.version }}" \
            -d /tmp/helm-package

      - name: Push chart to GHCR (OCI)
        run: |
          CHART_FILE=$(ls /tmp/helm-package/railhook-*.tgz)
          helm push "$CHART_FILE" oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Publish Summary
        run: |
          echo "### Published Helm chart" >> "$GITHUB_STEP_SUMMARY"
          echo "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/railhook --version ${{ needs.resolve-version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
