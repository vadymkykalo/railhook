name: Docker Publish

# Publishes the images the Helm chart and docker-compose.yml
# reference by default. Runs only on version tags — every push/PR still goes
# through ci.yml's `docker-build` job (:test tag, never pushed), which is what
# catches Dockerfile breakage day to day. This workflow is the one that makes
# `helm install` and `docker compose up` actually
# work against something real.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to (re)publish, e.g. v1.2.3'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: vadymkykalo/railhook

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve version from tag
        id: resolve
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "::error::Tag '$RAW_TAG' is not a semver tag (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "ref=$RAW_TAG" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: webhook-platform-api/Dockerfile
          - service: worker
            dockerfile: webhook-platform-worker/Dockerfile
          - service: ui
            dockerfile: webhook-platform-ui/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push (multi-arch, SBOM + provenance attached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Publish Summary
        run: |
          echo "### Published ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: linux/amd64, linux/arm64 — SBOM + provenance attached." >> "$GITHUB_STEP_SUMMARY"

  helm-publish:
    name: Publish Helm chart (OCI)
    runs-on: ubuntu-latest
    needs: [resolve-version, build-and-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.14.4'

      - name: Log in to GHCR (Helm OCI)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Fetch chart dependencies
        run: helm dependency build deploy/helm/railhook

      - name: Lint chart
        run: helm lint deploy/helm/railhook

      - name: Package chart
        run: |
          helm package deploy/helm/railhook \
            --version "${{ needs.resolve-version.outputs.version }}" \
            --app-version "${{ needs.resolve-version.outputs.version }}" \
            -d /tmp/helm-package

      - name: Push chart to GHCR (OCI)
        run: |
          CHART_FILE=$(ls /tmp/helm-package/railhook-*.tgz)
          helm push "$CHART_FILE" oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Publish Summary
        run: |
          echo "### Published Helm chart" >> "$GITHUB_STEP_SUMMARY"
          echo "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/railhook --version ${{ needs.resolve-version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
