name: Load & Contract Tests

# Manually-triggered (or nightly at most) on purpose — these boot the full
# stack plus a k6 load run, which is expensive, and
# "a load test on every push is a load test everyone disables". Never add a
# `pull_request:` or `push:` trigger here.
on:
  workflow_dispatch:
    inputs:
      run_soak_smoke:
        description: 'Also run a short (60s) smoke slice of load/soak.js (not the real hours-long soak — see load/README.md for that)'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  k6-load-tests:
    name: k6 load scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install k6
        run: |
          # Fetch, then unpack — a retry cannot rescue a half-read pipe.
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            -o k6.tar.gz \
            https://github.com/grafana/k6/releases/download/v2.2.0/k6-v2.2.0-linux-amd64.tar.gz
          tar xzf k6.tar.gz
          sudo mv k6-v2.2.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Create .env from .env.dist
        run: cp .env.dist .env

      - name: Allow the load-receiver's private address
        # load-receiver resolves to a Docker-bridge IP; SsrfProtectionCustomizer
        # blocks private ranges unless this is set — see load/README.md "Setup".
        run: echo "WEBHOOK_ALLOW_PRIVATE_IPS=true" >> .env

      - name: Test the load-receiver's control plane
        run: node --test load/receiver/server.test.js

      - name: Start the platform
        run: |
          make up
        timeout-minutes: 15

      - name: Start load-receiver
        run: |
          docker compose -f docker-compose.yml -f load/docker-compose.load.yml \
            --profile embedded-db up -d load-receiver
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/_control/health && break
            sleep 2
          done
          curl -f http://localhost:9000/_control/health

      - name: Run load/ingest.js
        run: k6 run -e TARGET_RPS=30 -e DURATION=1m load/ingest.js

      - name: Run load/fanout.js
        run: k6 run -e FANOUT_N=20 -e EVENTS_TO_SEND=5 -e SETTLE_SECONDS=20 load/fanout.js

      - name: Run load/failure-recovery.js
        run: |
          k6 run \
            -e PHASE_HEALTHY_SECONDS=15 -e PHASE_SLOW_SECONDS=15 \
            -e PHASE_DOWN_SECONDS=20 -e PHASE_RECOVER_SECONDS=30 \
            -e TRAFFIC_RPS=5 \
            load/failure-recovery.js

      - name: Run load/ordering.js (fails the job if FIFO ordering breaks under backlog)
        # 90s, not 60: the burst's last deliveries land around the minute mark on a loaded
        # runner, and a probe that reads half its burst proves less than one that reads all of it.
        run: k6 run -e BURST_SIZE=15 -e RETRY_WAIT_SECONDS=90 load/ordering.js

      - name: Run a short slice of load/soak.js
        if: ${{ inputs.run_soak_smoke == true }}
        # NOT the real soak run — that's hours long and needs
        # load/scripts/monitor-soak.sh running alongside it, by design not
        # something CI does unattended. This just proves the script itself
        # still works end to end. See load/README.md "Soak run".
        run: k6 run -e TARGET_RPS=10 -e DURATION=60s load/soak.js

      - name: Outbox depth snapshot
        if: always()
        run: ./load/scripts/outbox-depth.sh || true

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f load/docker-compose.load.yml down -v

  sdk-contract-tests:
    name: SDK contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from .env.dist
        run: cp .env.dist .env

      - name: Start the platform
        run: make up
        timeout-minutes: 15

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Node SDK contract tests
        working-directory: sdks/node
        env:
          CONTRACT_API_BASE_URL: http://localhost:8080
        run: |
          npm ci
          npm run test:contract

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Python SDK contract tests
        working-directory: sdks/python
        env:
          CONTRACT_API_BASE_URL: http://localhost:8080
        run: |
          pip install -e ".[dev]"
          pytest tests/contract -v

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: PHP SDK contract tests
        working-directory: sdks/php
        env:
          CONTRACT_API_BASE_URL: http://localhost:8080
        run: |
          composer install --no-interaction --prefer-dist
          composer test:contract

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
