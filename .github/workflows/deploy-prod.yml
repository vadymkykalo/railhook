# Manual on purpose: the repository is public and a deploy runs forward-only migrations.
# DOTENV_<NAME> variables and secrets of the production environment become NAME=value in the host's .env.
name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released tag to deploy, e.g. v2.15.0. Must already be published.'
        required: true
        type: string

concurrency:
  # Queue, never cancel: a half-applied upgrade is worse than a slow one.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://railhook.io
    steps:
      - name: Refuse anything that is not a published release tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a vX.Y.Z tag."
            exit 1
          fi
          # A tag without images would leave the host pulling nothing after its backup.
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$VERSION has no GitHub release. Publish it first."
            exit 1
          fi
          echo "$VERSION is released."

      - name: Check the images are actually on the registry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="${VERSION#v}"
          # Not `docker manifest inspect`: without credentials it reports a present image as missing.
          for image in api worker ui; do
            repo="vadymkykalo/railhook-${image}"
            token=$(curl -fsSL "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -r .token)
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${tag}")
            if [ "$code" != "200" ]; then
              echo "::error::ghcr.io/${repo}:${tag} answered ${code}. Wait for Docker Publish to finish."
              exit 1
            fi
            echo "found ghcr.io/${repo}:${tag}"
          done

      - name: Open an SSH session the far end has already constrained
        env:
          KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Pinned rather than accept-new: runs unattended.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Collect the production settings
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          # Named one by one so the step holds only the secrets it sends; a new one needs a line here.
          DOTENV_CAPTCHA_SECRET_KEY: ${{ secrets.DOTENV_CAPTCHA_SECRET_KEY }}
          DOTENV_SMTP_PASSWORD: ${{ secrets.DOTENV_SMTP_PASSWORD }}
          DOTENV_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.DOTENV_GOOGLE_OAUTH_CLIENT_SECRET }}
          SETTINGS_FILE: ${{ runner.temp }}/production-settings.env
        run: |
          set -euo pipefail
          # A secret wins over a variable of the same name; an unset secret is skipped.
          umask 077
          SECRETS_JSON=$(jq -n 'env | with_entries(select((.key | startswith("DOTENV_")) and .value != ""))')
          export SECRETS_JSON
          if ! jq -rn '
            def dotenv: to_entries
              | map(select(.key | startswith("DOTENV_"))
                    | {key: (.key | ltrimstr("DOTENV_")), value: (.value | tostring)})
              | from_entries;
            ((env.VARS_JSON | fromjson | dotenv) + (env.SECRETS_JSON | fromjson | dotenv))
            | to_entries[]
            | if (.key | test("^[A-Z][A-Z0-9_]*$") | not) then error("DOTENV_\(.key) is not a valid variable name")
              elif (.value | test("[\r\n]")) then error("DOTENV_\(.key) contains a line break, which .env cannot hold")
              else "\(.key)=\(.value)" end
          ' > "$SETTINGS_FILE" 2> "$RUNNER_TEMP/settings.err"; then
            echo "::error::$(sed 's/^jq: error[^:]*: //' "$RUNNER_TEMP/settings.err")"
            exit 1
          fi
          # Names only: values stay out of the log.
          if [ -s "$SETTINGS_FILE" ]; then
            echo "Settings sent with this deploy:"
            cut -d= -f1 "$SETTINGS_FILE" | sed 's/^/  /'
          else
            echo "No DOTENV_ settings in the production environment; .env is left as it is."
          fi

      - name: Deploy
        env:
          HOST: ${{ secrets.PROD_HOST }}
          VERSION: ${{ inputs.version }}
          SETTINGS_FILE: ${{ runner.temp }}/production-settings.env
        run: |
          set -euo pipefail
          trap 'rm -f "$SETTINGS_FILE"' EXIT
          # The host forces the command, so this string is only an argument; stdin carries the settings.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
              "root@${HOST}" "deploy ${VERSION}" < "$SETTINGS_FILE"

      - name: Prove it came back up
        env:
          HOST: ${{ secrets.PROD_HOST }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "--- containers ---"
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "root@${HOST}" status

          # From outside, over the real certificate: a healthy stack behind a broken proxy is not deployed.
          up=""
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://railhook.io/ || echo 000)
            if [ "$code" = "200" ]; then
              echo "https://railhook.io answered 200 after ${attempt} attempt(s)"
              up=1
              break
            fi
            echo "attempt ${attempt}: ${code}"
            sleep 10
          done
          if [ -z "$up" ]; then
            echo "::error::railhook.io never answered 200. The host may be mid-rollback — check ./railhook status."
            exit 1
          fi

          # A 200 is not the release: a pinned UI image once answered 200 with the old version.
          want="${VERSION#v}"
          served=""
          for attempt in $(seq 1 12); do
            served=$(curl -fsS --max-time 10 "https://railhook.io/version.txt?deploy=${GITHUB_RUN_ID}-${attempt}" | tr -d '[:space:]' || true)
            [ "$served" = "$want" ] && break
            echo "attempt ${attempt}: serves '${served:-nothing}', want ${want}"
            sleep 10
          done
          if [ "$served" != "$want" ]; then
            echo "::error::railhook.io serves '${served:-nothing}', not ${want} — a pinned UI image or a docker-compose.override.yml on the host is holding the old site."
            exit 1
          fi
          echo "https://railhook.io serves ${served}"

      - name: Prove the site works, page by page
        run: |
          set -uo pipefail
          base=https://railhook.io
          failed=0
          check() {
            local path="$1" status="$2" needle="$3" body code
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 "${base}${path}" || echo 000)
            if [ "$code" != "$status" ]; then
              echo "::error::${path} answered ${code}, expected ${status}"
              failed=1
            elif [ -n "$needle" ] && ! grep -qF -- "$needle" "$body"; then
              echo "::error::${path} answered ${code} but did not contain '${needle}'"
              failed=1
            else
              echo "ok  ${code}  ${path}"
            fi
            rm -f "$body"
          }
          check /                              200 'social-card.png'
          check /docs/                         200 'Railhook Docs'
          check /docs/uk/                      200 'Railhook Docs'
          check /docs/api-reference/           200 'API reference'
          check /login                         200 '<div id="root">'
          check /register                      200 '<div id="root">'
          check /privacy                       200 'Privacy'
          check /terms                         200 'Terms'
          check /install.sh                    200 'install'
          check /install-cli.sh                200 'railhook'
          check /config.js                     200 '"siteUrl": "https://railhook.io"'
          check /favicon.svg                   200 '<svg'
          check /sitemap.xml                   200 'https://railhook.io/'
          check /api/v1/billing/plans          200 '"free"'
          check /api/v1/auth/providers         200 '"google"'
          check /actuator/health               200 'UP'
          check "/no-such-page-${GITHUB_RUN_ID}" 404 ''
          if [ "$failed" != 0 ]; then
            echo "::error::railhook.io is up on the new version but part of the site is broken — see the lines above."
            exit 1
          fi
          echo "Every checked page of railhook.io works."

      - name: Say what is running now
        if: always()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "### Deployed \`${VERSION}\`"
            echo
            echo "- Host: production (Hetzner CX33, hel1)"
            echo "- URL: https://railhook.io"
            echo "- A backup was taken before the migrations ran; the schema does not roll back with the images."
          } >> "$GITHUB_STEP_SUMMARY"
