# Puts a released version on the production host.
#
# Manual on purpose. The repository is public, so anything that fires on a tag or a
# release fires on something a stranger can see coming and nobody has looked at twice.
# Deploying is the one action here that is not reversible by reverting a commit — it
# runs migrations, and Flyway is forward-only in this project.
#
# Three gates, none of which is the workflow trusting itself:
#   - workflow_dispatch, which only someone with write access can start;
#   - the `production` environment, which requires a named reviewer to approve the run
#     before any secret is readable;
#   - and the key at the far end, which is forced to /usr/local/bin/railhook-deploy and
#     can run `deploy <vX.Y.Z>` and `status` and nothing else. It cannot read .env, it
#     cannot open a shell, and a version that is not a plain tag is refused before the
#     host acts on it.
#
# Production settings live in Settings → Environments → production, not in a shell on the
# host: a variable (or, for anything sensitive, a secret) named DOTENV_<NAME> becomes
# NAME=value in /opt/railhook/.env on every deploy. To change one, edit it there and run this
# workflow again — the version already deployed is fine. The encryption key and salt, JWT and
# database passwords stay on the host; the helper refuses them.
name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released tag to deploy, e.g. v2.15.0. Must already be published.'
        required: true
        type: string

concurrency:
  # Two deploys at once would race each other's migrations. Queue rather than cancel:
  # a half-applied upgrade is worse than a slow one.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://railhook.io
    steps:
      - name: Refuse anything that is not a published release tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a vX.Y.Z tag."
            exit 1
          fi
          # Deploying a tag whose images were never published leaves the host pulling
          # something that does not exist, after it has already taken its backup.
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$VERSION has no GitHub release. Publish it first."
            exit 1
          fi
          echo "$VERSION is released."

      - name: Check the images are actually on the registry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="${VERSION#v}"
          # Asked of the registry directly rather than through `docker manifest inspect`.
          # That command answers "no such manifest" for an image that is plainly there
          # whenever the daemon has no credentials for the host — indistinguishable, from
          # here, from the image genuinely being missing. This step exists to tell those
          # two apart before the host is touched, so it must not be the thing that
          # confuses them.
          for image in api worker ui; do
            repo="vadymkykalo/railhook-${image}"
            token=$(curl -fsSL "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -r .token)
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${tag}")
            if [ "$code" != "200" ]; then
              echo "::error::ghcr.io/${repo}:${tag} answered ${code}. Wait for Docker Publish to finish."
              exit 1
            fi
            echo "found ghcr.io/${repo}:${tag}"
          done

      - name: Open an SSH session the far end has already constrained
        env:
          KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Pinned rather than accept-new: this runs unattended, so there is nobody to
          # notice a host key that changed.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Collect the production settings
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          # Sensitive settings, named one by one. Serialising the whole secrets context put the SSH
          # deploy key and every other secret of the repository into this step's environment only
          # for jq to drop them again; a step should hold the secrets it sends and nothing more. A new
          # sensitive setting is a DOTENV_<NAME> secret in the environment plus a line here.
          DOTENV_CAPTCHA_SECRET_KEY: ${{ secrets.DOTENV_CAPTCHA_SECRET_KEY }}
          DOTENV_SMTP_PASSWORD: ${{ secrets.DOTENV_SMTP_PASSWORD }}
          DOTENV_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.DOTENV_GOOGLE_OAUTH_CLIENT_SECRET }}
          SETTINGS_FILE: ${{ runner.temp }}/production-settings.env
        run: |
          set -euo pipefail
          # Every DOTENV_<NAME> variable of this environment and every named DOTENV_ secret above,
          # as NAME=value. A secret wins over a variable of the same name; an unset secret is
          # skipped rather than sent as an empty value.
          umask 077
          SECRETS_JSON=$(jq -n 'env | with_entries(select((.key | startswith("DOTENV_")) and .value != ""))')
          export SECRETS_JSON
          if ! jq -rn '
            def dotenv: to_entries
              | map(select(.key | startswith("DOTENV_"))
                    | {key: (.key | ltrimstr("DOTENV_")), value: (.value | tostring)})
              | from_entries;
            ((env.VARS_JSON | fromjson | dotenv) + (env.SECRETS_JSON | fromjson | dotenv))
            | to_entries[]
            | if (.key | test("^[A-Z][A-Z0-9_]*$") | not) then error("DOTENV_\(.key) is not a valid variable name")
              elif (.value | test("[\r\n]")) then error("DOTENV_\(.key) contains a line break, which .env cannot hold")
              else "\(.key)=\(.value)" end
          ' > "$SETTINGS_FILE" 2> "$RUNNER_TEMP/settings.err"; then
            echo "::error::$(sed 's/^jq: error[^:]*: //' "$RUNNER_TEMP/settings.err")"
            exit 1
          fi
          # Names only. Values stay out of the log, secrets and variables alike.
          if [ -s "$SETTINGS_FILE" ]; then
            echo "Settings sent with this deploy:"
            cut -d= -f1 "$SETTINGS_FILE" | sed 's/^/  /'
          else
            echo "No DOTENV_ settings in the production environment; .env is left as it is."
          fi

      - name: Deploy
        env:
          HOST: ${{ secrets.PROD_HOST }}
          VERSION: ${{ inputs.version }}
          SETTINGS_FILE: ${{ runner.temp }}/production-settings.env
        run: |
          set -euo pipefail
          trap 'rm -f "$SETTINGS_FILE"' EXIT
          # The command is ignored by the host — it is forced — so this string is only
          # ever read as an argument by railhook-deploy. Its stdin is not: railhook-deploy
          # runs `./railhook upgrade`, which applies these settings to .env before anything
          # else, and refuses the whole upgrade if one of them is not allowed. It takes a
          # backup before it migrates, and refuses to continue if that backup fails.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
              "root@${HOST}" "deploy ${VERSION}" < "$SETTINGS_FILE"

      - name: Prove it came back up
        env:
          HOST: ${{ secrets.PROD_HOST }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "--- containers ---"
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "root@${HOST}" status

          # From the outside, over the real certificate, because that is what a customer
          # gets. A deploy that leaves the stack healthy behind a broken proxy is not a
          # deploy that worked.
          up=""
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://railhook.io/ || echo 000)
            if [ "$code" = "200" ]; then
              echo "https://railhook.io answered 200 after ${attempt} attempt(s)"
              up=1
              break
            fi
            echo "attempt ${attempt}: ${code}"
            sleep 10
          done
          if [ -z "$up" ]; then
            echo "::error::railhook.io never answered 200. The host may be mid-rollback — check ./railhook status."
            exit 1
          fi

          # A 200 is not the release. 2.17.0 answered 200 while the host still served the
          # previous UI, pinned by an override, and this step called it deployed. The UI image
          # serves its own version; the query string keeps any cache out of the answer.
          want="${VERSION#v}"
          served=""
          for attempt in $(seq 1 12); do
            served=$(curl -fsS --max-time 10 "https://railhook.io/version.txt?deploy=${GITHUB_RUN_ID}-${attempt}" | tr -d '[:space:]' || true)
            [ "$served" = "$want" ] && break
            echo "attempt ${attempt}: serves '${served:-nothing}', want ${want}"
            sleep 10
          done
          if [ "$served" != "$want" ]; then
            echo "::error::railhook.io serves '${served:-nothing}', not ${want} — a pinned UI image or a docker-compose.override.yml on the host is holding the old site."
            exit 1
          fi
          echo "https://railhook.io serves ${served}"

      - name: Prove the site works, page by page
        run: |
          set -uo pipefail
          # The right version answering 200 on / is still not a working site: the docs, the
          # installer, the API behind nginx and the runtime config can each break on their own.
          # Every address a visitor, a self-hoster or the dashboard depends on is fetched from the
          # outside, with the status it must have and a piece of content only a working one has.
          base=https://railhook.io
          failed=0
          check() {
            local path="$1" status="$2" needle="$3" body code
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 "${base}${path}" || echo 000)
            if [ "$code" != "$status" ]; then
              echo "::error::${path} answered ${code}, expected ${status}"
              failed=1
            elif [ -n "$needle" ] && ! grep -qF -- "$needle" "$body"; then
              echo "::error::${path} answered ${code} but did not contain '${needle}'"
              failed=1
            else
              echo "ok  ${code}  ${path}"
            fi
            rm -f "$body"
          }
          check /                              200 'social-card.png'
          check /docs/                         200 'Railhook Docs'
          check /docs/uk/                      200 'Railhook Docs'
          check /docs/api-reference/           200 'API reference'
          check /login                         200 '<div id="root">'
          check /register                      200 '<div id="root">'
          check /privacy                       200 'Privacy'
          check /terms                         200 'Terms'
          check /install.sh                    200 'install'
          check /install-cli.sh                200 'railhook'
          check /config.js                     200 '"siteUrl": "https://railhook.io"'
          check /favicon.svg                   200 '<svg'
          check /sitemap.xml                   200 'https://railhook.io/'
          check /api/v1/billing/plans          200 '"free"'
          check /api/v1/auth/providers         200 '"google"'
          check /actuator/health               200 'UP'
          check "/no-such-page-${GITHUB_RUN_ID}" 404 ''
          if [ "$failed" != 0 ]; then
            echo "::error::railhook.io is up on the new version but part of the site is broken — see the lines above."
            exit 1
          fi
          echo "Every checked page of railhook.io works."

      - name: Say what is running now
        if: always()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "### Deployed \`${VERSION}\`"
            echo
            echo "- Host: production (Hetzner CX33, hel1)"
            echo "- URL: https://railhook.io"
            echo "- A backup was taken before the migrations ran; the schema does not roll back with the images."
          } >> "$GITHUB_STEP_SUMMARY"
