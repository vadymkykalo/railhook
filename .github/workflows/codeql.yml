name: CodeQL

# Not a failing gate yet: findings go to the Security tab until the backlog is triaged.
# Before making it a required check on main, let it complete there once, or every PR hangs pending.

on:
  schedule:
    # After Security SCA's 04:00 slot, so the two never contend for the Maven cache.
    - cron: '40 4 * * *'
  pull_request:
    branches:
      - develop
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # No `queries:` on purpose: `security` is not a pack name and fails init; -and-quality and -extended were too noisy.

      # manual, not autobuild: autobuild would run `mvn package`, tests and Testcontainers included.
      - name: Compile all modules
        if: matrix.language == 'java-kotlin'
        run: mvn clean compile -B -DskipTests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
