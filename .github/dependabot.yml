version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      maven-patch:
        update-types:
          - "patch"
          - "minor"
    # netty stays on Spring Boot's 4.1 line: a minor bump to 4.2 breaks the build.
    ignore:
      - dependency-name: "io.netty:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels:
      - "dependencies"
      - "maven"

  - package-ecosystem: "npm"
    directory: "/railhook-ui"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ui-patch:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "npm"
      - "ui"

  - package-ecosystem: "npm"
    directory: "/sdks/node"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      node-sdk-patch:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "npm"
      - "sdk"

  - package-ecosystem: "npm"
    directory: "/sdks/mcp"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      mcp-bridge-patch:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "npm"
      - "sdk"

  - package-ecosystem: "pip"
    directory: "/sdks/python"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-sdk-patch:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "pip"
      - "sdk"

  - package-ecosystem: "composer"
    directory: "/sdks/php"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      php-sdk-patch:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "composer"
      - "sdk"

  # Majors grouped here only: an action major is a runner/Node bump, and CI is the whole review.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - "patch"
          - "minor"
          - "major"
    labels:
      - "dependencies"
      - "github-actions"
