# Keep this the only Compose file: three copies once drifted and broke metrics scraping.

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: webhook-postgres
    # A profile, so an install on a managed database never starts it.
    profiles: [embedded-db]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webhook_platform}
      POSTGRES_USER: ${POSTGRES_USER:-webhook_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webhook_pass}
    volumes:
      - webhook_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, not the unix socket: during initdb the entrypoint runs a temporary socket-only
      # server, a socket probe calls it healthy, and it is then stopped under the dependant.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-webhook_user} -d ${POSTGRES_DB:-webhook_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: "${POSTGRES_MEMORY_LIMIT:-1G}"
        reservations:
          memory: "256m"
    networks:
      - webhook-network
    restart: unless-stopped

  db-backup:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: webhook-db-backup
    # Its own profile: it bind-mounts deploy/scripts/, which an install directory has only when
    # install.sh fetched it — otherwise Docker creates empty root-owned directories in its place.
    profiles: [backup]
    entrypoint: ["bash"]
    command: ["/scripts/db-backup-loop.sh"]
    environment:
      # Its own pg_dump over the network, so it never needs the docker socket.
      DB_MODE: direct
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-webhook_platform}
      DB_USER: ${POSTGRES_USER:-webhook_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-webhook_pass}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      DB_BACKUP_INTERVAL_SECONDS: ${DB_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./deploy/scripts/db-backup.sh:/scripts/db-backup.sh:ro
      - ./deploy/scripts/db-backup-loop.sh:/scripts/db-backup-loop.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - webhook-network
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: webhook-redis
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-webhook_redis_pass}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-webhook_redis_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: "${REDIS_MEMORY_LIMIT:-512m}"
        reservations:
          memory: "64m"
    networks:
      - webhook-network
    restart: unless-stopped

  api:
    image: ${DOCKER_REGISTRY:-ghcr.io/vadymkykalo/railhook}-api:${API_IMAGE_TAG:-latest}
    # No container_name: `railhook upgrade` starts a replacement api before draining the old one.
    # No host ports: the ui's nginx is the only way in, and 8082 is the unauthenticated actuator.
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-webhook_platform}
      DB_USER: ${DB_USER:-webhook_user}
      DB_PASSWORD: ${DB_PASSWORD:-webhook_pass}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-10}
      DB_POOL_CONNECTION_TIMEOUT: ${DB_POOL_CONNECTION_TIMEOUT:-30000}
      SERVER_PORT: 8080
      # Its own port so Prometheus scrapes outside the authenticated chain on 8080.
      MANAGEMENT_PORT: 8082
      # Literal, not a knob: the port is never published, and 127.0.0.1 (which reads safer) once
      # broke Prometheus's scrape and would now break nginx's health proxy too.
      MANAGEMENT_ADDRESS: 0.0.0.0
      SCHEDULING_POOL_SIZE: ${SCHEDULING_POOL_SIZE:-8}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?WEBHOOK_ENCRYPTION_KEY must be set}
      WEBHOOK_ENCRYPTION_KEYS: ${WEBHOOK_ENCRYPTION_KEYS:-}
      WEBHOOK_ENCRYPTION_KEY_ACTIVE_VERSION: ${WEBHOOK_ENCRYPTION_KEY_ACTIVE_VERSION:-0}
      WEBHOOK_ENCRYPTION_SALT: ${WEBHOOK_ENCRYPTION_SALT:?WEBHOOK_ENCRYPTION_SALT must be set}
      WEBHOOK_MAX_PAYLOAD_SIZE_BYTES: ${WEBHOOK_MAX_PAYLOAD_SIZE_BYTES:-262144}
      WEBHOOK_MAX_FANOUT_PER_EVENT: ${WEBHOOK_MAX_FANOUT_PER_EVENT:-100}
      WEBHOOK_PAYLOAD_COMPRESSION_THRESHOLD_BYTES: ${WEBHOOK_PAYLOAD_COMPRESSION_THRESHOLD_BYTES:-1024}
      WEBHOOK_ENDPOINT_VERIFICATION_REQUIRED: ${WEBHOOK_ENDPOINT_VERIFICATION_REQUIRED:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      DATA_RETENTION_ATTEMPTS_DAYS: ${DATA_RETENTION_ATTEMPTS_DAYS:-90}
      DATA_RETENTION_SUCCESSFUL_ATTEMPTS_DAYS: ${DATA_RETENTION_SUCCESSFUL_ATTEMPTS_DAYS:-14}
      DATA_RETENTION_INCOMING_EVENTS_DAYS: ${DATA_RETENTION_INCOMING_EVENTS_DAYS:-30}
      DATA_RETENTION_EVENTS_DAYS: ${DATA_RETENTION_EVENTS_DAYS:-90}
      DATA_RETENTION_DLQ_DAYS: ${DATA_RETENTION_DLQ_DAYS:-14}
      DATA_RETENTION_MAX_ATTEMPTS_PER_DELIVERY: ${DATA_RETENTION_MAX_ATTEMPTS_PER_DELIVERY:-10}
      DATA_RETENTION_BATCH_SIZE: ${DATA_RETENTION_BATCH_SIZE:-1000}
      DATA_RETENTION_CRON: ${DATA_RETENTION_CRON:-0 0 2 * * *}
      DATA_RETENTION_LIMIT_CRON: ${DATA_RETENTION_LIMIT_CRON:-0 */30 * * * *}
      DATA_RETENTION_BURST_CLEANUP_CRON: ${DATA_RETENTION_BURST_CLEANUP_CRON:-0 0 */4 * * *}
      DATA_RETENTION_TABLE_METRICS_INTERVAL_MS: ${DATA_RETENTION_TABLE_METRICS_INTERVAL_MS:-900000}
      EVENT_INGESTION_RATE_LIMIT_PER_SECOND: ${EVENT_INGESTION_RATE_LIMIT_PER_SECOND:-100}
      ENTITLEMENT_DEFAULT_RATE_LIMIT: ${ENTITLEMENT_DEFAULT_RATE_LIMIT:-100}
      ENTITLEMENT_DEFAULT_MAX_FANOUT: ${ENTITLEMENT_DEFAULT_MAX_FANOUT:-50}
      GLOBAL_RATE_LIMIT_PER_SECOND: ${GLOBAL_RATE_LIMIT_PER_SECOND:-5000}
      ORG_RATE_LIMIT_ENABLED: ${ORG_RATE_LIMIT_ENABLED:-false}
      ORG_RATE_LIMIT_PER_SECOND: ${ORG_RATE_LIMIT_PER_SECOND:-200}
      GLOBAL_RATE_LIMIT_ENABLED: ${GLOBAL_RATE_LIMIT_ENABLED:-true}
      AUTH_RATE_LIMIT_LOGIN_PER_MINUTE: ${AUTH_RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      AUTH_RATE_LIMIT_REGISTER_PER_MINUTE: ${AUTH_RATE_LIMIT_REGISTER_PER_MINUTE:-5}
      AUTH_RATE_LIMIT_REFRESH_PER_TOKEN_PER_MINUTE: ${AUTH_RATE_LIMIT_REFRESH_PER_TOKEN_PER_MINUTE:-30}
      AUTH_RATE_LIMIT_REFRESH_PER_IP_PER_MINUTE: ${AUTH_RATE_LIMIT_REFRESH_PER_IP_PER_MINUTE:-600}
      AUTH_BCRYPT_STRENGTH: ${AUTH_BCRYPT_STRENGTH:-12}
      AUTH_LOCKOUT_ENABLED: ${AUTH_LOCKOUT_ENABLED:-true}
      AUTH_LOCKOUT_THRESHOLD: ${AUTH_LOCKOUT_THRESHOLD:-5}
      AUTH_LOCKOUT_INITIAL_SECONDS: ${AUTH_LOCKOUT_INITIAL_SECONDS:-60}
      AUTH_LOCKOUT_MAX_SECONDS: ${AUTH_LOCKOUT_MAX_SECONDS:-900}
      AUTH_LOCKOUT_FAILURE_WINDOW_MINUTES: ${AUTH_LOCKOUT_FAILURE_WINDOW_MINUTES:-60}
      AUTH_SESSION_CLEANUP_INTERVAL_MS: ${AUTH_SESSION_CLEANUP_INTERVAL_MS:-3600000}
      WEBHOOK_ALLOW_PRIVATE_IPS: ${WEBHOOK_ALLOW_PRIVATE_IPS:-false}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      TRANSFORM_SCRIPT_TIMEOUT_MS: ${TRANSFORM_SCRIPT_TIMEOUT_MS:-2000}
      TRANSFORM_SCRIPT_MAX_MEMORY_MB: ${TRANSFORM_SCRIPT_MAX_MEMORY_MB:-128}
      TRANSFORM_SCRIPT_MAX_OUTPUT_BYTES: ${TRANSFORM_SCRIPT_MAX_OUTPUT_BYTES:-1048576}
      TRANSFORM_SCRIPT_MAX_CONSOLE_LINES: ${TRANSFORM_SCRIPT_MAX_CONSOLE_LINES:-100}
      TRANSFORM_SCRIPT_MAX_CHARS: ${TRANSFORM_SCRIPT_MAX_CHARS:-65536}
      # Handed to providers and the CLI, so it must be the public address.
      WEBHOOK_INGRESS_BASE_URL: ${TUNNEL_INGRESS_BASE_URL:-${APP_BASE_URL:-http://localhost}}
      TUNNEL_HEARTBEAT_TIMEOUT_SECONDS: ${TUNNEL_HEARTBEAT_TIMEOUT_SECONDS:-120}
      TUNNEL_CLEANUP_INTERVAL_MS: ${TUNNEL_CLEANUP_INTERVAL_MS:-60000}
      TUNNEL_REQUEST_LOG_RETENTION_DAYS: ${TUNNEL_REQUEST_LOG_RETENTION_DAYS:-7}
      WEBHOOK_INCOMING_MAX_PAYLOAD_SIZE_BYTES: ${WEBHOOK_INCOMING_MAX_PAYLOAD_SIZE_BYTES:-524288}
      WEBHOOK_INCOMING_RATE_LIMIT_PER_SECOND: ${WEBHOOK_INCOMING_RATE_LIMIT_PER_SECOND:-100}
      DELIVERY_ESCALATION_HARD_CAP_HOURS: ${DELIVERY_ESCALATION_HARD_CAP_HOURS:-96}
      FORWARD_ESCALATION_HARD_CAP_HOURS: ${FORWARD_ESCALATION_HARD_CAP_HOURS:-24}
      ENDPOINT_AUTO_DISABLE_ENABLED: ${ENDPOINT_AUTO_DISABLE_ENABLED:-true}
      ENDPOINT_AUTO_DISABLE_AFTER_HOURS: ${ENDPOINT_AUTO_DISABLE_AFTER_HOURS:-72}
      ENDPOINT_AUTO_DISABLE_MIN_FAILURES: ${ENDPOINT_AUTO_DISABLE_MIN_FAILURES:-10}
      ENDPOINT_AUTO_DISABLE_INTERVAL_MS: ${ENDPOINT_AUTO_DISABLE_INTERVAL_MS:-300000}
      ENDPOINT_AUTO_DISABLE_BATCH_SIZE: ${ENDPOINT_AUTO_DISABLE_BATCH_SIZE:-200}
      WEBHOOK_TRUSTED_PROXIES: ${WEBHOOK_TRUSTED_PROXIES:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      REPLAY_BATCH_SIZE: ${REPLAY_BATCH_SIZE:-200}
      REPLAY_BATCH_DELAY_MS: ${REPLAY_BATCH_DELAY_MS:-50}
      REPLAY_MAX_EVENTS_PER_SESSION: ${REPLAY_MAX_EVENTS_PER_SESSION:-500000}
      # A URL people copy, so the public origin — never api:8080, which exists only in this network.
      TEST_ENDPOINT_BASE_URL: ${TEST_ENDPOINT_BASE_URL:-${APP_BASE_URL:-http://localhost}}
      PUBLIC_TESTER_ENABLED: ${PUBLIC_TESTER_ENABLED:-false}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_SESSION_TTL_MINUTES: ${DEMO_SESSION_TTL_MINUTES:-30}
      DEMO_REFRESH_INTERVAL_MINUTES: ${DEMO_REFRESH_INTERVAL_MINUTES:-60}
      # Only the api runs a script for a demo session; the worker never sees one.
      DEMO_SCRIPT_RUNS_PER_SESSION_PER_MINUTE: ${DEMO_SCRIPT_RUNS_PER_SESSION_PER_MINUTE:-20}
      DEMO_SCRIPT_RUNS_PER_IP_PER_MINUTE: ${DEMO_SCRIPT_RUNS_PER_IP_PER_MINUTE:-60}
      TEST_ENDPOINT_MAX_PER_PROJECT: ${TEST_ENDPOINT_MAX_PER_PROJECT:-10}
      TEST_ENDPOINT_MAX_TTL_HOURS: ${TEST_ENDPOINT_MAX_TTL_HOURS:-72}
      TEST_ENDPOINT_CLEANUP_INTERVAL_MS: ${TEST_ENDPOINT_CLEANUP_INTERVAL_MS:-3600000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      APP_ENV: ${APP_ENV:-development}
      CLIENT_ERROR_REPORTING_ENABLED: ${CLIENT_ERROR_REPORTING_ENABLED:-true}
      CLIENT_ERROR_REPORTS_PER_USER_PER_MINUTE: ${CLIENT_ERROR_REPORTS_PER_USER_PER_MINUTE:-20}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-webhook_redis_pass}
      ALERTS_NOTIFICATIONS_ENABLED: ${ALERTS_NOTIFICATIONS_ENABLED:-false}
      ALERTS_EVALUATION_CRON: ${ALERTS_EVALUATION_CRON:-0 * * * * *}
      RULES_CACHE_REFRESH_MS: ${RULES_CACHE_REFRESH_MS:-30000}
      RULES_EXECUTION_LOG_RETENTION_DAYS: ${RULES_EXECUTION_LOG_RETENTION_DAYS:-7}
      TRANSFORMATION_HISTORY_LIMIT: ${TRANSFORMATION_HISTORY_LIMIT:-50}
      WORKFLOW_POOL_CORE_SIZE: ${WORKFLOW_POOL_CORE_SIZE:-4}
      WORKFLOW_POOL_MAX_SIZE: ${WORKFLOW_POOL_MAX_SIZE:-8}
      WORKFLOW_POOL_QUEUE_CAPACITY: ${WORKFLOW_POOL_QUEUE_CAPACITY:-50}
      WORKFLOW_MAX_DURATION_SECONDS: ${WORKFLOW_MAX_DURATION_SECONDS:-600}
      WORKFLOW_MAX_RECURSION_DEPTH: ${WORKFLOW_MAX_RECURSION_DEPTH:-3}
      WORKFLOW_STUCK_THRESHOLD_MINUTES: ${WORKFLOW_STUCK_THRESHOLD_MINUTES:-15}
      WORKFLOW_RECOVERY_INTERVAL_MS: ${WORKFLOW_RECOVERY_INTERVAL_MS:-120000}
      WORKFLOW_RESUME_INTERVAL_MS: ${WORKFLOW_RESUME_INTERVAL_MS:-5000}
      WORKFLOW_RESUME_BATCH_SIZE: ${WORKFLOW_RESUME_BATCH_SIZE:-50}
      WORKFLOW_NODE_TIMEOUT_DEFAULT_SECONDS: ${WORKFLOW_NODE_TIMEOUT_DEFAULT_SECONDS:-30}
      WORKFLOW_NODE_TIMEOUT_HTTP_SECONDS: ${WORKFLOW_NODE_TIMEOUT_HTTP_SECONDS:-60}
      WORKFLOW_NODE_TIMEOUT_SLACK_SECONDS: ${WORKFLOW_NODE_TIMEOUT_SLACK_SECONDS:-60}
      WORKFLOW_NODE_TIMEOUT_CREATE_EVENT_SECONDS: ${WORKFLOW_NODE_TIMEOUT_CREATE_EVENT_SECONDS:-30}
      WORKFLOW_NODE_TIMEOUT_POOL_SIZE: ${WORKFLOW_NODE_TIMEOUT_POOL_SIZE:-16}
      WORKFLOW_SHUTDOWN_AWAIT_SECONDS: ${WORKFLOW_SHUTDOWN_AWAIT_SECONDS:-30}
      WORKFLOW_TRIGGER_OUTBOX_POLL_INTERVAL_MS: ${WORKFLOW_TRIGGER_OUTBOX_POLL_INTERVAL_MS:-2000}
      WORKFLOW_TRIGGER_OUTBOX_BATCH_SIZE: ${WORKFLOW_TRIGGER_OUTBOX_BATCH_SIZE:-50}
      WORKFLOW_TRIGGER_OUTBOX_MAX_ATTEMPTS: ${WORKFLOW_TRIGGER_OUTBOX_MAX_ATTEMPTS:-3}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      EMAIL_SUPPORT_ADDRESS: ${EMAIL_SUPPORT_ADDRESS:-}
      ONBOARDING_EMAILS_ENABLED: ${ONBOARDING_EMAILS_ENABLED:-false}
      CONTACT_DAILY_LIMIT: ${CONTACT_DAILY_LIMIT:-30}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      ORGANIZATION_SUSPENSION_CACHE_TTL_SECONDS: ${ORGANIZATION_SUSPENSION_CACHE_TTL_SECONDS:-60}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_VERIFY_URL: ${CAPTCHA_VERIFY_URL:-https://challenges.cloudflare.com/turnstile/v0/siteverify}
      # Google must allow APP_BASE_URL + /api/v1/auth/oauth/google/callback as the redirect URI.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      BILLING_DEFAULT_PROVIDER: ${BILLING_DEFAULT_PROVIDER:-noop}
      BILLING_RECONCILIATION_CRON: ${BILLING_RECONCILIATION_CRON:-0 0 */6 * * *}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MAP: ${STRIPE_PRICE_MAP:-}
      WAYFORPAY_MERCHANT_ACCOUNT: ${WAYFORPAY_MERCHANT_ACCOUNT:-}
      WAYFORPAY_MERCHANT_SECRET: ${WAYFORPAY_MERCHANT_SECRET:-}
      WAYFORPAY_MERCHANT_DOMAIN: ${WAYFORPAY_MERCHANT_DOMAIN:-}
      WAYFORPAY_SERVICE_URL: ${WAYFORPAY_SERVICE_URL:-}
      WAYFORPAY_PLAN_PRICES: ${WAYFORPAY_PLAN_PRICES:-}
      JAVA_EXTRA_OPTS: ${API_JAVA_OPTS:-}
    depends_on:
      # required:false so an external database does not pull in the embedded-db profile; when
      # postgres is there, waiting for it keeps Flyway from racing its startup.
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 30s lifecycle + margin. Smaller than the worker's on purpose: the api drains one web server,
    # not two pools waiting on in-flight deliveries.
    stop_grace_period: 65s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      # 1 fits the smallest supported host; 2 costs ~600MB and makes every upgrade gapless.
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          memory: "${API_MEMORY_LIMIT:-768m}"
        reservations:
          memory: "256m"
    networks:
      - webhook-network
    restart: unless-stopped

  worker:
    image: ${DOCKER_REGISTRY:-ghcr.io/vadymkykalo/railhook}-worker:${WORKER_IMAGE_TAG:-latest}
    container_name: webhook-worker
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-webhook_platform}
      DB_USER: ${DB_USER:-webhook_user}
      DB_PASSWORD: ${DB_PASSWORD:-webhook_pass}
      # WORKER_-prefixed, or one shared .env value would override both services' pools.
      DB_POOL_MAX_SIZE: ${WORKER_DB_POOL_MAX_SIZE:-40}
      DB_POOL_MIN_IDLE: ${WORKER_DB_POOL_MIN_IDLE:-20}
      DB_POOL_CONNECTION_TIMEOUT: ${DB_POOL_CONNECTION_TIMEOUT:-30000}
      SCHEDULING_POOL_SIZE: ${SCHEDULING_POOL_SIZE:-8}
      MANAGEMENT_PORT: 8081
      # Literal, as for api.
      MANAGEMENT_ADDRESS: 0.0.0.0
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?WEBHOOK_ENCRYPTION_KEY must be set}
      WEBHOOK_ENCRYPTION_KEYS: ${WEBHOOK_ENCRYPTION_KEYS:-}
      WEBHOOK_ENCRYPTION_KEY_ACTIVE_VERSION: ${WEBHOOK_ENCRYPTION_KEY_ACTIVE_VERSION:-0}
      WEBHOOK_ENCRYPTION_SALT: ${WEBHOOK_ENCRYPTION_SALT:?WEBHOOK_ENCRYPTION_SALT must be set}
      WEBHOOK_ALLOW_PRIVATE_IPS: ${WEBHOOK_ALLOW_PRIVATE_IPS:-false}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      WEBHOOK_PROJECT_RATE_LIMIT_PER_SECOND: ${WEBHOOK_PROJECT_RATE_LIMIT_PER_SECOND:-50}
      WEBHOOK_OUTGOING_POOL_SIZE: ${WEBHOOK_OUTGOING_POOL_SIZE:-50}
      WEBHOOK_INCOMING_POOL_SIZE: ${WEBHOOK_INCOMING_POOL_SIZE:-20}
      WEBHOOK_ASYNC_SHUTDOWN_TIMEOUT_SECONDS: ${WEBHOOK_ASYNC_SHUTDOWN_TIMEOUT_SECONDS:-60}
      WEBHOOK_MAX_RESPONSE_BODY_BYTES: ${WEBHOOK_MAX_RESPONSE_BODY_BYTES:-1048576}
      TRANSFORM_SCRIPT_TIMEOUT_MS: ${TRANSFORM_SCRIPT_TIMEOUT_MS:-2000}
      TRANSFORM_SCRIPT_MAX_MEMORY_MB: ${TRANSFORM_SCRIPT_MAX_MEMORY_MB:-128}
      TRANSFORM_SCRIPT_MAX_OUTPUT_BYTES: ${TRANSFORM_SCRIPT_MAX_OUTPUT_BYTES:-1048576}
      TRANSFORM_SCRIPT_MAX_CONSOLE_LINES: ${TRANSFORM_SCRIPT_MAX_CONSOLE_LINES:-100}
      TRANSFORM_SCRIPT_MAX_CHARS: ${TRANSFORM_SCRIPT_MAX_CHARS:-65536}
      WEBHOOK_POOL_MAX_CONNECTIONS: ${WEBHOOK_POOL_MAX_CONNECTIONS:-200}
      WEBHOOK_POOL_PENDING_ACQUIRE_TIMEOUT_SECONDS: ${WEBHOOK_POOL_PENDING_ACQUIRE_TIMEOUT_SECONDS:-10}
      WEBHOOK_POOL_MAX_IDLE_TIME_SECONDS: ${WEBHOOK_POOL_MAX_IDLE_TIME_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: ${APP_ENV:-development}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-webhook_redis_pass}
      ORDERING_GAP_TIMEOUT_SECONDS: ${ORDERING_GAP_TIMEOUT_SECONDS:-60}
      ORDERING_DELIVERED_SEQ_TTL_HOURS: ${ORDERING_DELIVERED_SEQ_TTL_HOURS:-24}
      ORDERING_BUFFER_TTL_MINUTES: ${ORDERING_BUFFER_TTL_MINUTES:-10}
      CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:-50}
      CIRCUIT_BREAKER_MINIMUM_CALLS: ${CIRCUIT_BREAKER_MINIMUM_CALLS:-5}
      CIRCUIT_BREAKER_WAIT_DURATION_SECONDS: ${CIRCUIT_BREAKER_WAIT_DURATION_SECONDS:-30}
      CIRCUIT_BREAKER_WINDOW_TTL_SECONDS: ${CIRCUIT_BREAKER_WINDOW_TTL_SECONDS:-120}
      CIRCUIT_BREAKER_SLOW_CALL_THRESHOLD_MS: ${CIRCUIT_BREAKER_SLOW_CALL_THRESHOLD_MS:-10000}
      CIRCUIT_BREAKER_SLOW_CALL_RATE_THRESHOLD: ${CIRCUIT_BREAKER_SLOW_CALL_RATE_THRESHOLD:-80}
      QUEUE_DEPTH_METRICS_INTERVAL_MS: ${QUEUE_DEPTH_METRICS_INTERVAL_MS:-900000}
      QUEUE_DEPTH_METRICS_RETENTION_DAYS: ${QUEUE_DEPTH_METRICS_RETENTION_DAYS:-30}
      WEBHOOK_RETRY_AFTER_MAX_SECONDS: ${WEBHOOK_RETRY_AFTER_MAX_SECONDS:-21600}
      ENDPOINT_AUTO_DISABLE_ENABLED: ${ENDPOINT_AUTO_DISABLE_ENABLED:-true}
      WEBHOOK_CLAIM_ENABLED: ${WEBHOOK_CLAIM_ENABLED:-true}
      WEBHOOK_CLAIM_IDLE_POLL_MS: ${WEBHOOK_CLAIM_IDLE_POLL_MS:-200}
      WEBHOOK_CLAIM_TIMEOUT_SECONDS: ${WEBHOOK_CLAIM_TIMEOUT_SECONDS:-300}
      WEBHOOK_CLAIM_MAX_TARGETS: ${WEBHOOK_CLAIM_MAX_TARGETS:-500}
      WEBHOOK_MAX_CONCURRENT_PER_ENDPOINT: ${WEBHOOK_MAX_CONCURRENT_PER_ENDPOINT:-5}
      WEBHOOK_MAX_CONCURRENT_PER_TENANT: ${WEBHOOK_MAX_CONCURRENT_PER_TENANT:-20}
      DLQ_MONITORING_INTERVAL_MS: ${DLQ_MONITORING_INTERVAL_MS:-60000}
      # The outgoing ladder's worst case with full jitter is 83h; keep this cap above it.
      DELIVERY_ESCALATION_HARD_CAP_HOURS: ${DELIVERY_ESCALATION_HARD_CAP_HOURS:-96}
      FORWARD_ESCALATION_HARD_CAP_HOURS: ${FORWARD_ESCALATION_HARD_CAP_HOURS:-24}
      FORWARD_ESCALATION_BATCH_SIZE: ${FORWARD_ESCALATION_BATCH_SIZE:-100}
      FORWARD_ESCALATION_INTERVAL_MS: ${FORWARD_ESCALATION_INTERVAL_MS:-300000}
      DELIVERY_ESCALATION_BATCH_SIZE: ${DELIVERY_ESCALATION_BATCH_SIZE:-100}
      DELIVERY_ESCALATION_INTERVAL_MS: ${DELIVERY_ESCALATION_INTERVAL_MS:-300000}
      JAVA_EXTRA_OPTS: ${WORKER_JAVA_OPTS:-}
    depends_on:
      # required:false, as for api.
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 30s lifecycle + 2 x WEBHOOK_ASYNC_SHUTDOWN_TIMEOUT_SECONDS (the executors drain one after the
    # other) + margin; at 35s Docker killed deliveries mid-flight. ShutdownBudgetTest checks it.
    stop_grace_period: 155s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: "${WORKER_MEMORY_LIMIT:-768m}"
        reservations:
          memory: "256m"
    networks:
      - webhook-network
    restart: unless-stopped

  ui:
    image: ${DOCKER_REGISTRY:-ghcr.io/vadymkykalo/railhook}-ui:${UI_IMAGE_TAG:-latest}
    container_name: webhook-ui
    ports:
      # With a domain, install.sh binds this to 127.0.0.1:8080 behind Caddy or the operator's proxy.
      - "${RAILHOOK_BIND:-0.0.0.0}:${RAILHOOK_PORT:-80}:5173"
    # Read when the container starts, so one published image serves every deployment: a change
    # takes `docker compose up -d ui`, never a rebuild.
    environment:
      RAILHOOK_CONTACT_DOMAIN: ${RAILHOOK_CONTACT_DOMAIN:-}
      RAILHOOK_SITE_URL: ${APP_BASE_URL:-}
      # Turn on together with CAPTCHA_SECRET_KEY on the API, never one without the other.
      RAILHOOK_CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      RAILHOOK_CAPTCHA_SCRIPT_URL: ${CAPTCHA_SCRIPT_URL:-}
      RAILHOOK_WEB_ANALYTICS_TOKEN: ${WEB_ANALYTICS_TOKEN:-}
      RAILHOOK_STATUS_PAGE_URL: ${STATUS_PAGE_URL:-}
      RAILHOOK_PUBLIC_TESTER: ${PUBLIC_TESTER_ENABLED:-false}
      RAILHOOK_PUBLIC_DEMO: ${DEMO_ENABLED:-false}
      RAILHOOK_PUBLIC_BLOG: ${BLOG_ENABLED:-false}
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: "${UI_MEMORY_LIMIT:-128m}"
        reservations:
          memory: "32m"
    networks:
      - webhook-network
    restart: unless-stopped

  # Caddy rather than nginx + certbot: it obtains and renews certificates with no cron and no
  # first-run chicken-and-egg. It only terminates TLS; the ui's nginx still does all routing.
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: webhook-caddy
    profiles: [tls]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # `:-`, not `:?`: Compose interpolates every profile, so a guard would fail installs without
      # TLS. Caddy itself refuses an empty domain, and only when this profile is on.
      RAILHOOK_DOMAIN: ${RAILHOOK_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates: losing them means re-issuing, which Let's Encrypt rate-limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - webhook-network
volumes:
  caddy_data:
  caddy_config:
  # No fixed `name:` — a global name let a second install attach to the first one's database.
  # To use an existing volume, declare it external in a docker-compose.override.yml.
  webhook_pgdata:
  redis_data:

networks:
  webhook-network:
    driver: bridge
