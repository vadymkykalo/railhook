spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/webhook_test
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    clean-disabled: false

auth:
  bcrypt:
    # Minimum BCrypt cost. Production is 12; every integration test that registers a user would
    # otherwise pay a quarter-second per hash for a property none of them are asserting -- and
    # the one test that IS about the work factor, PasswordHashingStrengthTest, builds its own
    # encoders rather than reading this.
    strength: 4

jwt:
  secret: test_jwt_secret_key_for_testing_webhook_platform_min_32_chars
  access-token-expiration: 900000
  refresh-token-expiration: 86400000

webhook:
  encryption-key: test_encryption_key_32_chars_12
  encryption-keys: ""
  encryption-key-active-version: 0
  encryption-salt: test_salt_for_encryption_16ch
  url-validation:
    allow-private-ips: true
    allowed-hosts: []
