# Pinned project name: the platform's .env may set COMPOSE_PROJECT_NAME=railhook, and a `down`
# under that name would take the platform with it.
name: railhook-monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: railhook-prometheus
    # Prometheus does not expand env in its own config, so render-targets.sh writes the probe targets.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sh /etc/prometheus/render-targets.sh &&
        exec /bin/prometheus
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
        --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-4GB}
        --web.enable-lifecycle
        --web.enable-remote-write-receiver
    environment:
      RAILHOOK_DOMAIN: ${RAILHOOK_DOMAIN:-}
      MONITORING_PROBE_URLS: ${MONITORING_PROBE_URLS:-}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/host-alerts.yml:/etc/prometheus/host-alerts.yml:ro
      - ./prometheus/render-targets.sh:/etc/prometheus/render-targets.sh:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
    networks:
      - monitoring
      - railhook
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 384m

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: railhook-alertmanager
    volumes:
      - ./alertmanager/render-config.sh:/etc/alertmanager/render-config.sh:ro
      - ./alertmanager/email.tmpl:/etc/alertmanager/templates/email.tmpl:ro
      - alertmanager_data:/alertmanager
    environment:
      ALERTMANAGER_SLACK_WEBHOOK_URL: ${ALERTMANAGER_SLACK_WEBHOOK_URL:-}
      ALERTMANAGER_SLACK_CHANNEL: ${ALERTMANAGER_SLACK_CHANNEL:-#railhook-alerts}
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
      ALERTMANAGER_EMAIL_TO: ${ALERTMANAGER_EMAIL_TO:-}
      # Email goes through the relay the platform already sends with, unless told otherwise.
      ALERTMANAGER_EMAIL_FROM: ${ALERTMANAGER_EMAIL_FROM:-${EMAIL_FROM:-alerts@example.com}}
      ALERTMANAGER_SMTP_HOST: ${ALERTMANAGER_SMTP_HOST:-${SMTP_HOST:-localhost}}
      ALERTMANAGER_SMTP_PORT: ${ALERTMANAGER_SMTP_PORT:-${SMTP_PORT:-1025}}
      ALERTMANAGER_SMTP_USERNAME: ${ALERTMANAGER_SMTP_USERNAME:-${SMTP_USERNAME:-}}
      ALERTMANAGER_SMTP_PASSWORD: ${ALERTMANAGER_SMTP_PASSWORD:-${SMTP_PASSWORD:-}}
      ALERTMANAGER_SMTP_REQUIRE_TLS: ${ALERTMANAGER_SMTP_REQUIRE_TLS:-}
      ALERTMANAGER_TELEGRAM_BOT_TOKEN: ${ALERTMANAGER_TELEGRAM_BOT_TOKEN:-}
      ALERTMANAGER_TELEGRAM_CHAT_ID: ${ALERTMANAGER_TELEGRAM_CHAT_ID:-}
      ALERTMANAGER_HEARTBEAT_URL: ${ALERTMANAGER_HEARTBEAT_URL:-}
      # Alert mail links to Grafana on MONITORING_DOMAIN and names RAILHOOK_DOMAIN in its subject.
      MONITORING_DOMAIN: ${MONITORING_DOMAIN:-}
      RAILHOOK_DOMAIN: ${RAILHOOK_DOMAIN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sh /etc/alertmanager/render-config.sh &&
        exec /bin/alertmanager
        --config.file=/etc/alertmanager/alertmanager.yml
        --storage.path=/alertmanager
        --web.listen-address=:9093
        --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    networks:
      - monitoring
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64m

  grafana:
    image: grafana/grafana:12.1.1
    container_name: railhook-grafana
    # Re-applies the admin password on every start: Grafana reads it only when creating its database.
    entrypoint: ["/bin/sh", "/etc/grafana/railhook-entrypoint.sh"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      MONITORING_DOMAIN: ${MONITORING_DOMAIN:-}
      GRAFANA_PORT: ${GRAFANA_PORT:-3001}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_LEVEL: warn
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/railhook-overview.json
    volumes:
      - ./grafana/entrypoint.sh:/etc/grafana/railhook-entrypoint.sh:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Loopback only: an SSH tunnel, or Caddy on the shared network, is the way in.
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks:
      - monitoring
      # Caddy reaches it here as railhook-grafana:3000.
      - railhook
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          # Grafana 12 idles near 200 MB with these dashboards provisioned.
          memory: 320m

  loki:
    image: grafana/loki:3.0.0
    container_name: railhook-loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
      - "-config.expand-env=true"
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      # "fake" is the tenant Loki uses with auth_enabled: false.
      - ./loki/rules:/etc/loki/rules/fake:ro
      - loki_data:/loki
    networks:
      - monitoring
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 320m

  promtail:
    image: grafana/promtail:3.0.0
    container_name: railhook-promtail
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - promtail_positions:/var/lib/promtail
      # The Docker log files, and the socket to discover containers by their Compose
      # service label whatever the platform's project is called. Both read-only.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    depends_on:
      - loki
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 96m

  # pid: host makes the mount table the host's; without it the file systems listed are this
  # container's own bind mounts rather than the host's disks.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: railhook-node-exporter
    # node_uname_info reports the container's hostname, which Docker sets to the container id;
    # this names the host without sharing its UTS namespace.
    hostname: ${MONITORING_NODENAME:-railhook-host}
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+)($$|/)"
      - "--collector.textfile.directory=/textfile"
      - "--no-collector.wifi"
      - "--no-collector.hwmon"
    volumes:
      - /:/host:ro,rslave
      - textfile:/textfile:ro
    networks:
      - monitoring
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64m

  # Only the metrics the dashboards and rules read: the full set is several thousand series.
  cadvisor:
    # v0.54+: with Docker 29's containerd storage older cAdvisor exported no container_* series; the
    # new lookup needs the containerd socket and the host root.
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: railhook-cadvisor
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project"
      - "--enable_metrics=cpu,memory,network,oom_event"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/lib/containerd:/var/lib/containerd:ro
    # OOM kills are read from the kernel log, which needs CAP_SYSLOG to open; without it cAdvisor
    # disabled OOM events and container_oom_events_total never existed. That one capability, no more.
    cap_add:
      - SYSLOG
    devices:
      - /dev/kmsg
    networks:
      - monitoring
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 192m

  # Probes the public URLs from outside and the UI and Caddy from inside, so "the site is down"
  # and "the edge is down" read as different alerts.
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    container_name: railhook-blackbox
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - monitoring
      - railhook
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 32m

  # So "no backup in 26 hours" is an alert and not a discovery made during a restore.
  backup-age:
    image: busybox:1.36.1
    container_name: railhook-backup-age
    command: ["sh", "/backup-age.sh"]
    volumes:
      - ./backup-age/backup-age.sh:/backup-age.sh:ro
      - ${MONITORING_BACKUP_DIR:-../backups}:/backups:ro
      - textfile:/textfile
    network_mode: none
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 8m

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  promtail_positions:
  textfile:

networks:
  monitoring:
    driver: bridge
  railhook:
    external: true
    # The platform's network: <project>_webhook-network. /opt/railhook gives
    # railhook_webhook-network; the Makefile detects it, otherwise set RAILHOOK_NETWORK in .env.
    name: ${RAILHOOK_NETWORK:-railhook_webhook-network}
