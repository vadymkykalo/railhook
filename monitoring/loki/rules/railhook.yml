groups:
  - name: railhook.logs
    interval: 1m
    rules:
      # Promtail already lower-cases the level; this still covers lines it stored before that.
      - record: railhook:log_lines:rate5m
        expr: |
          sum by (service, level) (
            rate({service=~".+"} | label_format level="{{ lower .level }}" [5m])
          )

      # 4xx and 5xx answered by the UI's nginx — including the 502s the API never sees,
      # because it was not there to answer.
      - record: railhook:nginx_responses:rate5m
        expr: |
          sum by (status) (
            rate({service="ui"}
              | pattern `<_> - <_> [<_>] "<_> <_> <_>" <status> <_>`
              | status=~"[45].." [5m])
          )
