# ${VAR:-default} is expanded by Loki itself (-config.expand-env=true on the container).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Independent of the Postgres DATA_RETENTION_* days.
  retention_period: ${LOKI_RETENTION_PERIOD:-168h}
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_series: 5000
  # So a runaway DEBUG logger can't OOM Loki on a small host.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  # Safety net if a change ever makes a per-request ID (correlationId, deliveryId) a label.
  max_streams_per_user: 10000

# Only recording rules here, remote-written into Prometheus: the alerts on them are Prometheus
# rules, so every alert reaches Alertmanager by one path and shows in one list.
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  ring:
    kvstore:
      store: inmemory
  enable_api: true
  evaluation_interval: 1m
  wal:
    dir: /loki/ruler-wal
  remote_write:
    enabled: true
    clients:
      prometheus:
        url: http://prometheus:9090/api/v1/write

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem
