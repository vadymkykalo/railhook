global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # The platform's rules — kept identical to the Helm chart's (AlertRuleParityTest).
  - "alerts.yml"
  # The host this Compose stack runs on: disk, memory, containers, uptime, backups.
  # Kubernetes has its own answers to all of these, so the chart has no copy.
  - "host-alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "railhook-api"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8082"]
        labels:
          service: "api"
          component: "railhook"

  - job_name: "railhook-worker"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["worker:8081"]
        labels:
          service: "worker"
          component: "railhook"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: "host"

  - job_name: "cadvisor"
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: "host"
    metric_relabel_configs:
      # Only named containers — the rest are cgroup slices nobody looks at.
      - source_labels: [name]
        regex: ""
        action: drop

  # Public URLs, probed the way a customer reaches them. Targets come from
  # render-targets.sh (RAILHOOK_DOMAIN / MONITORING_PROBE_URLS).
  - job_name: "blackbox-public"
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 60s
    scrape_timeout: 15s
    file_sd_configs:
      - files: ["/prometheus/sd/public-http.yml"]
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
      - target_label: component
        replacement: uptime

  # The UI's nginx from inside the network: down here and up publicly cannot happen,
  # up here and down publicly is the edge (Caddy, Cloudflare, DNS).
  - job_name: "blackbox-internal"
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 30s
    file_sd_configs:
      - files: ["/prometheus/sd/internal-http.yml"]
    relabel_configs: *probe_relabel

  - job_name: "blackbox-internal-tcp"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    scrape_interval: 30s
    file_sd_configs:
      - files: ["/prometheus/sd/internal-tcp.yml"]
    relabel_configs: *probe_relabel

  - job_name: "monitoring"
    static_configs:
      - targets:
          - "localhost:9090"
          - "alertmanager:9093"
          - "loki:3100"
          - "promtail:9080"
          - "grafana:3000"
          - "blackbox:9115"
        labels:
          component: "monitoring"
