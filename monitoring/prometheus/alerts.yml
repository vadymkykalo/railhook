# Railhook — Prometheus Alert Rules
# Deploy alongside Prometheus via configmap or PrometheusRule CRD.
#
# Metrics sources:
#   - delivery_queue_depth{status=pending|processing|dlq}     (QueueDepthMetricsExporter)
#   - incoming_forward_queue_depth{status=pending|processing|dlq}
#   - retry_governor_pending_count{scheduler=outgoing|incoming-forward}
#   - retry_governor_effective_batch{scheduler=...}
#   - retry_governor_consecutive_failures{scheduler=...}
#   - retry_governor_cooldown_remaining{scheduler=...}
#   - webhook_dlq_depth{topic=deliveries.dlq}         (DlqMonitoringService; actionable
#     backlog -- deliveries still in DeliveryStatus.DLQ, returns to 0 once retried/purged.
#     this used to be a Kafka latest-earliest offset count that never returned to 0;
#     see webhook_dlq_topic_retained_total below for that raw, non-actionable signal)
#   - webhook_dlq_topic_retained_total{topic=deliveries.dlq}  (informational only, do not alert)
#   - incoming_forward_dlq_depth{topic=incoming.forward.dlq}  (DlqMonitoringService; the
#     incoming counterpart -- Forwards still in ForwardAttemptStatus.DLQ)
#   - incoming_forward_dlq_topic_retained_total{topic=incoming.forward.dlq}  (informational
#     only, do not alert)
#   - webhook_delivery_attempts_total{result=success|failure|error}
#   - incoming_forward_attempts_total{result=success|failure|error}
#   - circuit_breaker_state_transitions_total
#   - circuit_breaker_rejected_total
#   - circuit_breaker_degraded_total
#   - http_server_requests_seconds_count{status=~"5.."}
#   - outbox_queue_depth{status=pending|sending|failed|dead}  (OutboxPublisherService, api)
#   - outbox_oldest_pending_age_seconds                       (OutboxPublisherService, api)
#   - delivery_oldest_pending_age_seconds                     (StaleDeliveryEscalationService)
#   - forward_oldest_pending_age_seconds                      (StaleForwardEscalationService)
#   - up{job=railhook-api|railhook-worker}                    (Prometheus itself)

groups:
  # ── Outbox ───────────────────────────────────────────────────
  # The first place work can go missing. An Event is written to the outbox in the same
  # transaction as the work itself, so a row stuck here is a webhook the caller was told
  # was accepted and which no per-endpoint metric will ever show you: it has not become a
  # Delivery yet, so delivery_queue_depth cannot see it either.
  - name: railhook.outbox
    rules:
      # Accepted but unannounced. This is the third of the three signals
      # docs/guides/observability.md tells an operator to alert on if they alert on nothing
      # else — and until now it was the only one of the three with no rule behind it.
      - alert: OutboxOldestPendingAgeHigh
        expr: |
          outbox_oldest_pending_age_seconds > 300
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Oldest unpublished outbox message is {{ $value | printf \"%.0f\" }}s old"
          description: |
            An event has been accepted and written to the outbox but not published to Kafka
            for over 5 minutes. The publisher polls every second, so this means it is not
            running, not keeping up, or failing to reach the broker. Nothing downstream can
            see this backlog: the work has not become a Delivery yet.

      # SENDING is a transient state the publisher recovers from after
      # outbox.publisher.sending-recovery-seconds (default 300s). A sustained depth means
      # recovery is not keeping up, or is failing outright.
      - alert: OutboxSendingStuck
        expr: |
          outbox_queue_depth{status="sending"} > 0
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} outbox messages stuck SENDING for >10m"
          description: |
            Outbox messages have been SENDING for longer than
            outbox.publisher.sending-recovery-seconds (default 300s) plus the 30s retry-cycle
            poll — recovery back to PENDING should already have happened. Check API logs for
            recoverStuckSendingMessages() and Kafka broker health.

  # ── Retry Backlog ────────────────────────────────────────────
  - name: railhook.retry_backlog
    rules:
      # Pending delivery queue growing fast (>500 increase in 15 min)
      - alert: DeliveryPendingBacklogGrowing
        expr: |
          delta(delivery_queue_depth{status="pending"}[15m]) > 500
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Delivery pending backlog growing rapidly"
          description: |
            Pending deliveries increased by {{ $value | printf "%.0f" }} in 15 min.
            Check downstream endpoint health and worker scaling.

      # Pending deliveries above absolute threshold
      - alert: DeliveryPendingBacklogHigh
        expr: |
          delivery_queue_depth{status="pending"} > 5000
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Delivery pending backlog above 5000"
          description: |
            {{ $value | printf "%.0f" }} deliveries pending for >10 min.
            Consider scaling workers or investigating failing endpoints.

      # Critical: pending backlog above hard threshold
      - alert: DeliveryPendingBacklogCritical
        expr: |
          delivery_queue_depth{status="pending"} > 20000
        for: 5m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: "CRITICAL: Delivery pending backlog above 20000"
          description: |
            {{ $value | printf "%.0f" }} deliveries pending.
            Hard-cap auto-DLQ escalation may trigger. Immediate investigation required.

      # Incoming forward pending backlog
      - alert: IncomingForwardPendingBacklogHigh
        expr: |
          incoming_forward_queue_depth{status="pending"} > 3000
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Incoming forward pending backlog above 3000"
          description: |
            {{ $value | printf "%.0f" }} incoming forwards pending for >10 min.

  # ── DLQ ──────────────────────────────────────────────────────
  - name: railhook.dlq
    rules:
      # DLQ depth growing
      - alert: DlqDepthGrowing
        expr: |
          delta(delivery_queue_depth{status="dlq"}[1h]) > 100
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "DLQ growing: {{ $value | printf \"%.0f\" }} new entries in 1h"
          description: |
            DLQ entries increasing. Check endpoint availability and delivery logs.

      # DLQ rate above SLO threshold (>3% of deliveries)
      - alert: DlqRateHigh
        expr: |
          (
            rate(webhook_delivery_attempts_total{result="error"}[1h])
            + rate(webhook_delivery_attempts_total{result="failure"}[1h])
          )
          /
          rate(webhook_delivery_attempts_total[1h])
          > 0.1
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Delivery failure rate above 10% for >10 min"
          description: |
            {{ $value | printf "%.1f" }}% failure rate. SLO target: <5% DLQ rate.

      # The incoming counterpart of DlqRateHigh. Same expression shape, same threshold and
      # the same 10m window -- a Forward failing repeatedly ends up in DLQ exactly as a
      # Delivery does, and until this rule existed nothing watched
      # incoming_forward_attempts_total at all.
      - alert: IncomingForwardFailureRateHigh
        expr: |
          (
            rate(incoming_forward_attempts_total{result="error"}[1h])
            + rate(incoming_forward_attempts_total{result="failure"}[1h])
          )
          /
          rate(incoming_forward_attempts_total[1h])
          > 0.1
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Incoming forward failure rate above 10% for >10 min"
          description: |
            {{ $value | printf "%.1f" }}% failure rate. SLO target: <5% DLQ rate.

      # Actionable DLQ backlog (deliveries still in DeliveryStatus.DLQ -- this is
      # DB-backed and genuinely returns to 0 once retried/purged via DlqService, unlike the
      # old Kafka-offset-based computation it replaced)
      - alert: DlqActionableBacklog
        expr: |
          webhook_dlq_depth > 0
        for: 30m
        labels:
          severity: info
          component: worker
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} deliveries in DLQ status"
          description: |
            Deliveries awaiting manual retry or purge via DlqService. Not tied to Kafka
            topic retention -- see webhook_dlq_topic_retained_total for raw topic volume.

      # The incoming counterpart of DlqActionableBacklog. A Forward that exhausts its retry
      # ladder used to write status = DLQ on its incoming_forward_attempts row and nothing
      # else, so no number an operator could see ever moved.
      - alert: IncomingForwardDlqActionableBacklog
        expr: |
          incoming_forward_dlq_depth > 0
        for: 30m
        labels:
          severity: info
          component: worker
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} forwards in DLQ status"
          description: |
            Forwards awaiting manual retry or purge. Not tied to Kafka topic retention --
            see incoming_forward_dlq_topic_retained_total for raw topic volume.

  # ── Retry Governor ───────────────────────────────────────────
  - name: railhook.retry_governor
    rules:
      # Governor in sustained cooldown (indicating persistent downstream failures)
      - alert: RetryGovernorCooldown
        expr: |
          retry_governor_cooldown_remaining > 0
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Retry governor {{ $labels.scheduler }} in cooldown"
          description: |
            Governor entered cooldown after sustained failures.
            Cooldown remaining: {{ $value }} polls. Check downstream health.

      # Consecutive failures above threshold
      - alert: RetryGovernorConsecutiveFailures
        expr: |
          retry_governor_consecutive_failures > 5
        for: 2m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: "Retry governor {{ $labels.scheduler }}: {{ $value }} consecutive failures"
          description: |
            Persistent Kafka send failures or downstream unavailability.
            Check Kafka broker health, worker logs, and network connectivity.

  # ── Circuit Breaker ──────────────────────────────────────────
  - name: railhook.circuit_breaker
    rules:
      # Many circuit breakers tripping
      - alert: CircuitBreakerTripsHigh
        expr: |
          rate(circuit_breaker_state_transitions_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Circuit breakers tripping frequently"
          description: |
            {{ $value | printf "%.1f" }} circuit breaker transitions/sec.
            Multiple endpoints may be failing. Check endpoint health dashboard.

      # High rejection rate
      - alert: CircuitBreakerRejectionsHigh
        expr: |
          rate(circuit_breaker_rejected_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Circuit breaker rejecting >10 calls/sec"
          description: |
            Many deliveries being skipped due to open circuit breakers.

      # The breaker cannot trip if it cannot count
      - alert: CircuitBreakerDegraded
        expr: |
          rate(circuit_breaker_degraded_total[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Circuit breaker cannot reach Redis"
          description: |
            {{ $value | printf "%.2f" }} circuit breaker operations/sec are failing open
            because Redis is unreachable. Deliveries continue — that is deliberate — but
            outcomes are not being counted, so no breaker will trip however badly an
            endpoint behaves. An endpoint that looks healthy right now may only look that
            way because nothing is measuring it. Check Redis before trusting the breaker
            dashboards.

  # ── API Availability (from SLOs) ─────────────────────────────
  - name: railhook.api
    rules:
      - alert: ApiErrorRateHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count[5m]))
          > 0.005
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API 5xx error rate above 0.5%"
          description: |
            {{ $value | printf "%.2f" }}% of requests returning 5xx.
            SLO target: <0.1% over 30d. Investigate API logs immediately.

  # ── Oldest Pending Age ───────────────────────────────────────
  - name: railhook.staleness
    rules:
      # Oldest pending delivery is stale (metric exposed by StaleDeliveryEscalationService)
      - alert: OldestPendingDeliveryStale
        expr: |
          delivery_oldest_pending_age_seconds > 3600
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Oldest pending delivery is {{ $value | printf \"%.0f\" }}s old"
          description: |
            A delivery has been pending for over 1 hour.
            This may indicate a stuck delivery or scheduler issue.

      - alert: OldestPendingDeliveryCritical
        expr: |
          delivery_oldest_pending_age_seconds > 86400
        for: 5m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: "CRITICAL: Pending delivery stuck for >24h"
          description: |
            A delivery has been in PENDING state for {{ $value | printf "%.0f" }}s.
            Hard-cap escalation should have moved this to DLQ. Investigate immediately.

      # The incoming counterpart. StaleForwardEscalationService exports the gauge exactly as
      # its outgoing twin does; only the alert was missing, so a Forward could sit pending
      # indefinitely while the identical Delivery condition paged someone.
      - alert: OldestPendingForwardStale
        expr: |
          forward_oldest_pending_age_seconds > 3600
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Oldest pending forward is {{ $value | printf \"%.0f\" }}s old"
          description: |
            An incoming forward has been pending for over 1 hour.
            This may indicate a stuck forward or scheduler issue.

  # ── Is it running at all ─────────────────────────────────────
  # Everything above measures what the platform is doing. Nothing measured whether it was
  # doing anything: a worker that died outright tripped no rule directly, and only showed up
  # five to ten minutes later as a backlog someone had to interpret.
  - name: railhook.infrastructure
    rules:
      - alert: ApiDown
        expr: |
          up{job="railhook-api"} == 0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "The api is not being scraped"
          description: |
            Prometheus cannot reach the api's management port. Either the process is down,
            or it is up and unreachable — both mean no event can be accepted right now.

      - alert: WorkerDown
        expr: |
          up{job="railhook-worker"} == 0
        for: 2m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: "The worker is not being scraped"
          description: |
            Prometheus cannot reach the worker's management port. Nothing is delivering
            webhooks. Queue-depth alerts will follow in several minutes; this one is the
            direct signal.
