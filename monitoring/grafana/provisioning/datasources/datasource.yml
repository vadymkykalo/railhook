apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: railhook-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
      httpMethod: POST

  - name: Loki
    type: loki
    uid: railhook-loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000

  # Firing alerts and silences in Grafana's Alerting pages, so Alertmanager itself never
  # needs a published port.
  - name: Alertmanager
    type: alertmanager
    uid: railhook-alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
