apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: railhook-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
      httpMethod: POST

  # See monitoring/README.md "Logs".
  - name: Loki
    type: loki
    uid: railhook-loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
