# One job per service, filtered by the Docker API: with a `keep` relabel instead, Promtail 3.0 kept
# pushing the dropped containers' lines unlabelled. Found by service label: names change per checkout.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.service=api"]
    relabel_configs: &relabel
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
    pipeline_stages: &pipeline
      - docker: {}
      # Keeps an older image's Spring Boot banner (bare lines, no level) out of the Logs panel.
      - match:
          selector: '{service=~"api|worker"}'
          stages:
            - drop:
                expression: '^[^A-Za-z0-9]*$|^\s*:: Spring Boot ::'
      # Only `level` becomes a label: per-request and per-tenant IDs as labels would blow up
      # Loki's index cardinality. Query them with `| json` instead.
      - json:
          expressions:
            level: level
      # nginx's access log has no level; a request it served is info.
      - match:
          selector: '{service="postgres"}'
          stages:
            - regex:
                expression: '\b(?P<level>DEBUG\d?|LOG|INFO|NOTICE|WARNING|ERROR|FATAL|PANIC):\s'
      - match:
          selector: '{service="ui"}'
          stages:
            - regex:
                expression: '\[(?P<level>debug|info|notice|warn|error|crit|alert|emerg)\]'
            - template:
                source: level
                template: '{{ if .Value }}{{ .Value }}{{ else }}info{{ end }}'
      # One vocabulary for every service, so a legend never shows `api INFO` beside `api info`.
      - template:
          source: level
          template: '{{ with .Value }}{{ $l := ToLower . }}{{ if eq $l "warning" }}warn{{ else if or (eq $l "fatal") (eq $l "panic") (eq $l "crit") (eq $l "alert") (eq $l "emerg") }}error{{ else if or (eq $l "log") (eq $l "notice") }}info{{ else if eq (TrimRight $l "0123456789") "debug" }}debug{{ else }}{{ $l }}{{ end }}{{ end }}'
      - labels:
          level:
      # The json stage sets __error__ on a plain-text (dev profile) line instead of failing;
      # drop it so it never gets indexed.
      - labeldrop:
          - __error__

  - job_name: worker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.service=worker"]
    relabel_configs: *relabel
    pipeline_stages: *pipeline

  - job_name: ui
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.service=ui"]
    relabel_configs: *relabel
    pipeline_stages: *pipeline

  - job_name: caddy
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.service=caddy"]
    relabel_configs: *relabel
    pipeline_stages: *pipeline

  - job_name: postgres
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.service=postgres"]
    relabel_configs: *relabel
    pipeline_stages: *pipeline

  - job_name: db-backup
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.service=db-backup"]
    relabel_configs: *relabel
    pipeline_stages: *pipeline
