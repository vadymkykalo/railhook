# Railhook Promtail config.
#
# Discovers containers via the Docker daemon (docker_sd_configs) rather than assuming
# fixed container names — the main docker-compose.yml doesn't set container_name for
# api/worker, and this repo is routinely checked out into differently-named
# directories (parallel-agent worktrees, forks, ...), which changes Compose's default
# project name and therefore the generated container names. `com.docker.compose.service`
# is a label Docker Compose sets on every container regardless of project name, so
# filtering on that is robust across all of those.
#
# One job per service, each filtered by the Docker API itself. A single job with a `keep`
# relabel rule looked equivalent and was not: Promtail 3.0 went on tailing the containers
# that rule dropped and pushed their lines with no labels at all, which Loki refused
# ("at least one label pair is required per stream") about once a second — while reading
# every log on the host, Kafka's included.
#
# Which services: api and worker for correlation-ID tracing; ui (nginx) and caddy because
# a 502 is answered there, not in the API; postgres for the errors the API only reports as a
# failed transaction; db-backup because a failed dump says why only in its log. Kafka and
# Redis stay out: noisy, and rarely the question.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.service=api"]
    relabel_configs: &relabel
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
    pipeline_stages: &pipeline
      # Unwraps the Docker JSON log-driver envelope ({"log":"...","stream":"stdout",
      # "time":"..."}) to get at the actual line the service wrote.
      - docker: {}
      # Spring Boot's start-up banner is ASCII art printed before logging starts, as bare lines
      # with no level. The services no longer print it; this keeps an older image from filling
      # the Logs panel with it after every restart. A line with no letter or digit has nothing
      # to read in it.
      - match:
          selector: '{service=~"api|worker"}'
          stages:
            - drop:
                expression: '^[^A-Za-z0-9]*$|^\s*:: Spring Boot ::'
      # Production logs are single-line JSON (LogstashEncoder — see logback-spring.xml
      # in both modules; Caddy logs JSON too). Extract only `level` as a Loki *label*
      # (low cardinality, useful for filtering/alerting on log volume by severity);
      # correlationId/organizationId/userId/projectId/deliveryId/etc. deliberately stay
      # unindexed in the line body — promoting per-request/per-tenant IDs to labels would
      # blow up Loki's index cardinality. Query them with `| json` at query time instead.
      - json:
          expressions:
            level: level
      # The two plain-text services get a level too, so one filter covers every service.
      # Postgres: "... [123] ERROR:  message". nginx's error log: "... [error] 12#12: ...";
      # its access log has no level, and a request it served is info.
      - match:
          selector: '{service="postgres"}'
          stages:
            - regex:
                expression: '\b(?P<level>DEBUG\d?|LOG|INFO|NOTICE|WARNING|ERROR|FATAL|PANIC):\s'
      - match:
          selector: '{service="ui"}'
          stages:
            - regex:
                expression: '\[(?P<level>debug|info|notice|warn|error|crit|alert|emerg)\]'
            - template:
                source: level
                template: '{{ if .Value }}{{ .Value }}{{ else }}info{{ end }}'
      # One vocabulary for every service — error, warn, info, debug — so a dashboard legend never
      # shows `api INFO` beside `api info`, and one filter value means the same thing everywhere.
      - template:
          source: level
          template: '{{ with .Value }}{{ $l := ToLower . }}{{ if eq $l "warning" }}warn{{ else if or (eq $l "fatal") (eq $l "panic") (eq $l "crit") (eq $l "alert") (eq $l "emerg") }}error{{ else if or (eq $l "log") (eq $l "notice") }}info{{ else if eq (TrimRight $l "0123456789") "debug" }}debug{{ else }}{{ $l }}{{ end }}{{ end }}'
      - labels:
          level:
      # Dev-mode (non-production profile) logs are plain text, not JSON — the `json`
      # stage above silently no-ops on a line that isn't valid JSON, setting the
      # __error__ label instead of failing the pipeline, so this config works
      # unchanged against `make up` (dev profile) too, just without the `level` label
      # dev-mode lines don't have. Drop that error label unconditionally (a no-op
      # when it was never set) so it never gets indexed.
      - labeldrop:
          - __error__

  - job_name: worker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.service=worker"]
    relabel_configs: *relabel
    pipeline_stages: *pipeline

  - job_name: ui
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.service=ui"]
    relabel_configs: *relabel
    pipeline_stages: *pipeline

  - job_name: caddy
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.service=caddy"]
    relabel_configs: *relabel
    pipeline_stages: *pipeline

  - job_name: postgres
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.service=postgres"]
    relabel_configs: *relabel
    pipeline_stages: *pipeline

  - job_name: db-backup
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.service=db-backup"]
    relabel_configs: *relabel
    pipeline_stages: *pipeline
