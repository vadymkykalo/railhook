      - Encryption Admin
      summary: Rotate encryption keys
      description: "Re-encrypts all secrets (endpoints, incoming sources, incoming\
        \ destinations) with the currently active encryption key version, across ALL\
        \ tenants. Requires the platform-admin operator credential (X-Platform-Admin-Token)."
      operationId: rotateEncryptionKeys
      responses:
        "200":
          description: Rotation completed with no errors
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EncryptionRotationResponse"
        "207":
          description: Rotation completed but some records failed to re-encrypt —
            see 'errors'
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EncryptionRotationResponse"
        "403":
          description: Forbidden — requires the platform-admin operator credential
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EncryptionRotationResponse"
        "409":
          description: Rotation already in progress on another node
          content:
