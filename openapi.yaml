    IncomingDestinationRequest:
      type: object
      description: Request to create or update a forwarding destination
      properties:
        url:
          type: string
          description: Destination URL to forward webhooks to
          example: https://api.example.com/webhooks
          minLength: 1
          pattern: ""
        authType:
          type: string
          description: Authentication type for the destination
          enum:
          - NONE
          - BASIC
          - BEARER
          - CUSTOM_HEADER
        authConfig:
          type: string
          description: "JSON auth config (encrypted at rest). Keys depend on authType:\
            \ BEARER={token}, BASIC={username,password}, CUSTOM_HEADER={headerName,headerValue}"
          maxLength: 4096
          minLength: 0
        customHeadersJson:
          type: string
          description: Custom HTTP headers as JSON object
          example:
            X-Custom: value
        enabled:
          type: boolean
          description: Whether the destination is active
          example: true
        maxAttempts:
          type: integer
          format: int32
          description: Maximum delivery attempts before moving to DLQ
          example: 5
        timeoutSeconds:
          type: integer
          format: int32
          description: HTTP request timeout in seconds
          example: 30
        retryDelays:
          type: string
          description: Comma-separated retry delays in seconds
          example: "60,300,900,3600,21600"
          maxLength: 255
          minLength: 0
        payloadTransform:
          type: string
          description: JSONPath expression to transform payload before forwarding
            (null = forward as-is)
          example: $.data
          maxLength: 4096
          minLength: 0
        transformationId:
          type: string
          format: uuid
          description: ID of a reusable transformation template to apply (overrides
            payloadTransform if set). Empty string detaches the destination from its
            template.
      required:
      - url
    IncomingDestinationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        incomingSourceId:
          type: string
          format: uuid
        url:
          type: string
        authType:
          type: string
          enum:
          - NONE
          - BASIC
          - BEARER
          - CUSTOM_HEADER
        authConfigured:
          type: boolean
        customHeadersJson:
          type: string
        enabled:
          type: boolean
        maxAttempts:
          type: integer
          format: int32
        timeoutSeconds:
          type: integer
          format: int32
        retryDelays:
          type: string
        payloadTransform:
          type: string
        transformationId:
          type: string
          format: uuid
        transformationName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IncomingSourceRequest:
      type: object
      description: Request to create or update an incoming webhook source
      properties:
        name:
          type: string
          description: Display name for the source
          example: GitHub Webhooks
          maxLength: 255
          minLength: 0
        slug:
          type: string
          description: URL-friendly slug (auto-generated if omitted)
          example: github-webhooks
          maxLength: 64
          minLength: 0
          pattern: "^[a-z0-9][a-z0-9-]*$"
        providerType:
          type: string
          description: Provider type
          enum:
          - GENERIC
          - GITHUB
          - GITLAB
          - STRIPE
          - SHOPIFY
          - SLACK
          - TWILIO
          example: GITHUB
        status:
          type: string
          description: Source status
          enum:
          - ACTIVE
          - DISABLED
        verificationMode:
          type: string
          description: Signature verification mode
          enum:
          - NONE
          - HMAC_GENERIC
          - PROVIDER
        hmacSecret:
          type: string
          description: "HMAC secret for signature verification (write-only, never\
            \ returned)"
        hmacHeaderName:
          type: string
          description: HTTP header name containing the signature
          example: X-Hub-Signature-256
          maxLength: 255
          minLength: 0
        hmacSignaturePrefix:
          type: string
          description: Prefix before the signature value
          example: sha256=
          maxLength: 50
          minLength: 0
        rateLimitPerSecond:
          type: integer
          format: int32
          description: Rate limit per second for ingress endpoint (null = unlimited)
          example: 100
      required:
      - name
