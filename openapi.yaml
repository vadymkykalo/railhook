      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Login successful
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/forgot-password:
    post:
      tags:
      - Authentication
      summary: Forgot password
      description: Sends a password reset email to the user
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "200":
          description: "If the email exists, a reset link has been sent"
        "429":
          description: Too many requests
  /api/v1/auth/device/token:
    post:
      tags:
      - Device Authentication
      summary: Poll for device token
      description: "CLI polls this endpoint with device_code until the user approves.\
        \ Returns 202 while pending, 200 with tokens when approved."
      operationId: pollDeviceToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenRequest"
        required: true
      responses:
        "200":
          description: "Authorization granted, tokens returned"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "202":
          description: Authorization pending
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "403":
          description: Authorization denied
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "410":
          description: Code expired
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/device/deny:
    post:
      tags:
      - Device Authentication
