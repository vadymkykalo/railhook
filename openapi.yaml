      operationId: listApiKeys
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageApiKeyResponse"
      security:
      - bearerAuth: []
      - apiKey: []
    post:
      tags:
      - API Keys
      summary: Create API key
      description: Generates a new API key for event ingestion. The key is shown only
        once.
      operationId: createApiKey
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyRequest"
        required: true
      responses:
        "201":
          description: API key created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/projects/{projectId}/api-keys/{apiKeyId}/rotate:
    post:
      tags:
      - API Keys
      summary: Rotate API key
      description: "Issues a replacement key and puts the old one into a grace window,\
        \ during which both authenticate. The replacement is shown only once. Default\
        \ window is 24 hours; pass gracePeriodHours=0 to cut the old key off immediately\
        \ after a suspected leak."
      operationId: rotateApiKey
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: apiKeyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyRotateRequest"
      responses:
        "201":
          description: Replacement key created; the old key is retiring
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
      security:
      - bearerAuth: []
      - apiKey: []
