      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          description: Password changed successfully
        "400":
          description: Current password incorrect or validation failed
        "401":
          description: Not authenticated
      security:
      - bearerAuth: []
  /api/v1/admin/organizations/{organizationId}/suspend:
    post:
      tags:
      - Organization Admin
      summary: Suspend an organization
      description: "Stops the organization changing anything — ingest included — until\
        \ it is reinstated. Reads keep working, so the tenant can sign in and be shown\
        \ why. Independent of billing status, so a payment does not lift it."
      operationId: adminSuspendOrganization
      parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendOrganizationRequest"
        required: true
      responses:
        "200":
          description: Suspended
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminOrganizationResponse"
        "400":
          description: No reason given — the tenant is shown it
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminOrganizationResponse"
        "403":
          description: Forbidden — requires the platform-admin operator credential
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminOrganizationResponse"
        "404":
          description: No such organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminOrganizationResponse"
      security:
      - platformAdminToken: []
  /api/v1/admin/organizations/{organizationId}/reinstate:
    post:
      tags:
      - Organization Admin
      summary: Reinstate an organization
      description: Lifts a suspension. Reinstating one that is not suspended is a
        no-op.
      operationId: adminReinstateOrganization
      parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Reinstated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminOrganizationResponse"
        "403":
          description: Forbidden — requires the platform-admin operator credential
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminOrganizationResponse"
        "404":
          description: No such organization
          content:
            '*/*':
