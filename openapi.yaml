- name: Alerts
  description: Alert rules and fired alert events
- name: Subscriptions
  description: Event type subscriptions
- name: Event Time Machine
  description: Replay events by time range and filters
- name: Webhook Capture
  description: Public endpoints to receive and capture webhook requests
- name: Authentication
  description: "User registration, login, and session management"
- name: Endpoints
  description: Webhook endpoint configuration
- name: Organization Admin
  description: "Operator view of every tenant, and suspension (platform-admin operator\
    \ credential only)"
- name: Incoming Destinations
