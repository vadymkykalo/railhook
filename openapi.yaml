      - bearerAuth: []
  /api/v1/auth/verify-email:
    post:
      tags:
      - Authentication
      summary: Verify email
      description: Verifies user email with the token sent to their email
      operationId: verifyEmail
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Email verified successfully
        "400":
          description: Invalid or expired token
  /api/v1/auth/switch-organization:
    post:
      tags:
      - Authentication
      summary: Switch organization
      description: "Re-issues an access token scoped to another organization the caller\
        \ belongs to. The refresh token is untouched and no other session is affected;\
        \ the new token's role comes from the membership in the target organization,\
        \ not from the token being replaced."
      operationId: switchOrganization
      parameters:
      - name: refresh_token
        in: cookie
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchOrganizationRequest"
        required: true
      responses:
        "200":
          description: Access token re-issued for the target organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: "Not authenticated, or no live session"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "403":
          description: Caller is not a member of that organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
      security:
      - bearerAuth: []
  /api/v1/auth/sessions/revoke-all:
    post:
      tags:
      - Authentication
      summary: Sign out everywhere
      description: "Ends every session for the authenticated user, including the one\
        \ making the call."
      operationId: revokeAllSessions
      responses:
        "204":
          description: All sessions revoked
        "401":
          description: Not authenticated
      security:
      - bearerAuth: []
  /api/v1/auth/reset-password:
