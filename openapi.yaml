components:
  schemas:
    WebhookCaptureResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        requestId:
          type: string
        receivedAt:
          type: string
        error:
          type: string
        challenge:
          type: string
    ProjectRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 2
        description:
          type: string
          maxLength: 500
          minLength: 0
        schemaValidationEnabled:
          type: boolean
        schemaValidationPolicy:
          type: string
        idempotencyPolicy:
          type: string
      required:
      - name
    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        schemaValidationEnabled:
          type: boolean
        schemaValidationPolicy:
          type: string
        idempotencyPolicy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkflowRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        enabled:
          type: boolean
        definition: {}
        triggerType:
          type: string
          enum:
          - WEBHOOK_EVENT
          - MANUAL
          - SCHEDULE
        triggerConfig: {}
      required:
      - name
    WorkflowResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        definition: {}
        triggerType:
          type: string
          enum:
          - WEBHOOK_EVENT
          - MANUAL
          - SCHEDULE
        triggerConfig: {}
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        totalExecutions:
          type: integer
          format: int64
        successfulExecutions:
          type: integer
          format: int64
        failedExecutions:
          type: integer
          format: int64
    TransformationRequest:
      type: object
      description: Request to create or update a transformation
      properties:
        name:
          type: string
          description: Human-readable name for the transformation
          example: Stripe v2 → CRM v1
          maxLength: 255
          minLength: 0
        description:
          type: string
          description: Description of what this transformation does
          example: Normalizes Stripe payment events to CRM format
          maxLength: 4096
          minLength: 0
        template:
          type: string
          description: "JSON template with ${$.jsonpath} expressions for field mapping"
          example:
            event_type: "${$.type}"
            amount: "${$.data.amount}"
          maxLength: 65536
          minLength: 0
        enabled:
          type: boolean
          description: Whether this transformation is active
          example: true
      required:
      - name
      - template
    TransformationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        template:
          type: string
        version:
          type: integer
          format: int32
        enabled:
          type: boolean
        subscriptionCount:
          type: integer
          format: int64
