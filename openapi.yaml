      description: Called by the authenticated user in the browser to refuse a device
        login request they did not start. The waiting CLI stops with 403 on its next
        poll instead of holding the code open until it expires.
      operationId: denyDeviceCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceDenyRequest"
        required: true
      responses:
        "200":
          description: Device code denied
        "404":
          description: Code not found or already used
      security:
      - bearerAuth: []
  /api/v1/auth/device/code:
    post:
      tags:
      - Device Authentication
      summary: Initiate device auth
      description: Generates a device code and user code for CLI login. The user code
        should be displayed to the user to enter in the browser.
      operationId: initiateDeviceAuth
      responses:
        "200":
          description: Device code generated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DeviceCodeResponse"
  /api/v1/auth/device/approve:
    post:
      tags:
      - Device Authentication
      summary: Approve device code
      description: Called by the authenticated user in the browser to approve a device
