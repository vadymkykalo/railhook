- name: Subscriptions
  description: Event type subscriptions for endpoints
- name: PII Masking
  description: PII masking rules for payload sanitization
- name: Incidents
  description: Incident management with timeline and RCA
- name: Tunnels
  description: CLI tunnel session management
- name: Workflows
  description: Visual workflow automation
- name: Transform Preview
  description: Preview payload transformations and dry-run deliveries
- name: Deliveries
  description: "Delivery status, attempts, and replay operations"
- name: Authentication
  description: User registration and login
- name: Tunnel Ingress
  description: Public tunnel ingress endpoints
- name: Projects
  description: Project management and dashboard statistics
- name: Organizations
  description: Organization and member management
- name: Dead Letter Queue
  description: DLQ management operations
- name: Projects
  description: Project management
- name: Billing
  description: "Plan catalog, usage, and subscription management"
- name: Organizations
  description: Organization member management
- name: API Keys
