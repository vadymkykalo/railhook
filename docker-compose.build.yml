# ============================================================================
# Build from source — an overlay, not a second copy of the stack.
# ============================================================================
# docker-compose.yml resolves every service to a published image. Layer this on
# top and the three services Railhook actually owns are built from the working
# tree instead:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml \
#     --profile embedded-db up -d --build
#
# which is what `make up` runs. Postgres, Kafka and Redis are not ours to build
# and stay as published images either way.
#
# This file exists because the alternative — a second complete Compose file with
# `build:` instead of `image:` — is what the repository had, and 80% of its
# ~550 lines were a hand-maintained duplicate of this one's. They drifted, and
# the drift was a live bug: the worker's actuator bind address differed between
# the two, so metrics scraping worked in one deployment path and silently did
# not in the other. Twenty-five lines cannot drift from anything.

services:
  api:
    build:
      context: .
      dockerfile: ./railhook-api/Dockerfile
    image: railhook-api:${API_IMAGE_TAG:-local}

  worker:
    build:
      context: .
      dockerfile: ./railhook-worker/Dockerfile
    image: railhook-worker:${WORKER_IMAGE_TAG:-local}

  ui:
    build:
      context: .
      dockerfile: ./railhook-ui/Dockerfile
      # Vite inlines import.meta.env.VITE_* at build time, so these have to be
      # build args; as runtime env on the nginx stage they were dead config.
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_CSP_EXTRA_CONNECT: ${VITE_CSP_EXTRA_CONNECT:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_CONTACT_DOMAIN: ${VITE_CONTACT_DOMAIN:-}
    image: railhook-ui:${UI_IMAGE_TAG:-local}
