<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      These are the defaults a crawler and a link unfurler see before React
      mounts. Every route then overwrites title, description, og:* and the
      canonical through `useDocumentMeta`, so this block describes the landing
      page and nothing else relies on it.

      `%SITE_URL%` is filled in at build time from VITE_SITE_URL. Any line
      still carrying the placeholder is deleted instead - see the siteUrl
      plugin in vite.config.ts. A build that has not been told which origin it
      will be served from publishes no absolute URL about itself rather than
      guessing one, because the guess used to be a domain this project does
      not own, and a canonical is an instruction to credit whoever it names.

      The canonical is in that set rather than written as a relative "/": Vite
      treats `href` on a `<link>` as an asset reference and tries to read it,
      so a root-relative canonical fails the build outright with EISDIR on the
      public directory. `useDocumentMeta` creates the tag on mount anyway, for
      every route and with the right path, so nothing is lost by its absence
      here.
    -->
    <meta name="description" content="Send webhooks to your customers' endpoints and receive them from Stripe, GitHub or Slack. HMAC-signed, retried on a ladder from 1 minute to 24 hours, with Failed Messages and replay. Free for 10,000 events a month, or self-host under MIT." />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hookflow" />
    <meta property="og:title" content="Hookflow — Webhook infrastructure, both directions" />
    <meta property="og:description" content="Deliveries out to your customers' endpoints, webhooks in from the providers you use. Signed, retried, and every attempt on the record. Free for 10,000 events a month." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hookflow — Webhook infrastructure, both directions" />
    <meta name="twitter:description" content="Deliveries out to your customers' endpoints, webhooks in from the providers you use. Signed, retried, replayable. Free for 10,000 events a month, MIT if you self-host." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <title>Hookflow — Webhook infrastructure, both directions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!--
      Free is a real, non-expiring plan with a listed allowance, so it is a
      priced offer rather than a trial. No aggregateRating, no review: there are
      none, and structured data is the one place a made-up number is machine
      readable.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Hookflow",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "url": "%SITE_URL%/",
        "description": "Webhook infrastructure in both directions: deliveries out to the endpoints your customers registered, and webhooks in from providers like Stripe, GitHub and Slack. HMAC-signed, retried on a ladder from 1 minute to 24 hours, with Failed Messages and replay.",
        "license": "https://opensource.org/licenses/MIT",
        "offers": [
          { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD", "url": "%SITE_URL%/pricing" },
          { "@type": "Offer", "name": "Starter", "price": "29", "priceCurrency": "USD", "url": "%SITE_URL%/pricing" },
          { "@type": "Offer", "name": "Pro", "price": "99", "priceCurrency": "USD", "url": "%SITE_URL%/pricing" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
