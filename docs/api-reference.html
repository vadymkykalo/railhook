<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Railhook API Reference</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="OpenAPI reference for the Railhook self-hosted webhook platform, generated from the live springdoc-openapi spec committed at openapi.yaml."
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Renders the committed openapi.yaml (repo root) so the API reference
      is crawlable, linkable from GitHub, and versioned with releases - unlike
      railhook-ui/src/pages/DocumentationPage.tsx, which stays the
      in-app home for prose, per-language quick-start samples and conceptual
      docs (not duplicated here; this page is the machine-generated reference
      that DocumentationPage doesn't and shouldn't try to be).

      spec-url is relative ("../openapi.yaml") so this page works both:
        - served locally straight off the repo root (e.g. `python3 -m http.server`
          from the repo root, then open /docs/api-reference.html), and
        - published by .github/workflows/docs.yml, which copies openapi.yaml
          next to a copy of this file before deploying to GitHub Pages - see
          that workflow for why a build-time copy beats a second committed
          copy of the spec (single source of truth, no drift).
    -->
    <redoc spec-url="../openapi.yaml"></redoc>
    <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
  </body>
</html>
