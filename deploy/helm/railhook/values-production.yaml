api:
  replicaCount: 3
  
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: 2000m
      memory: 1536Mi
  
  env:
    APP_ENV: production
    LOG_LEVEL: WARN

  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
  
  pdb:
    enabled: true
    minAvailable: 2

worker:
  replicaCount: 3
  
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 2Gi
  
  env:
    APP_ENV: production
    LOG_LEVEL: WARN
    KAFKA_DELIVERY_CONCURRENCY: "12"
  
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPUUtilizationPercentage: 60
  
  pdb:
    enabled: true
    minAvailable: 2

ui:
  replicaCount: 2
  
  pdb:
    enabled: true
    minAvailable: 1

# Supply the relay with --set email.smtp.host=… email.smtp.username=… email.smtp.existingSecret=…
# app.baseUrl=…, or set email.enabled=false rather than run a half-configured relay.
email:
  enabled: true
  from: noreply@example.com
  smtp:
    host: ""  # e.g., smtp.example.com — required while enabled is true
    port: 587
    auth: true
    starttls: true
    existingSecret: ""  # Secret with the SMTP password under `smtp-password`

postgresql:
  enabled: false

kafka:
  enabled: false
  topicReplicationFactor: 3  # Production: 3-way replication across brokers
  topicPartitions: 24        # Higher partition count for parallel consumers

backup:
  enabled: true
  schedule: "0 2 * * *"       # Daily at 2 AM UTC
  retainCount: 14             # Keep 2 weeks of backups
  storageSize: 50Gi

# Point redis.external at a managed instance, e.g. --set redis.external.host=redis.prod.local
redis:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus  # Match your Prometheus Operator's label selector
  prometheusRule:
    enabled: true
    labels:
      release: prometheus
  grafanaDashboards:
    enabled: true
    labels:
      grafana_dashboard: "1"

networkPolicy:
  enabled: true

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - railhook
          topologyKey: kubernetes.io/hostname
