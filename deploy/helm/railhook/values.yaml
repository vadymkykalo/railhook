# Default values for Railhook self-hosted deployment
# This is a YAML-formatted file.

global:
  imageRegistry: ""
  imagePullSecrets: []

# How the platform is addressed from a browser.
app:
  # The URL people type. Verification, password-reset and invite links are
  # built from it, and CORS is allowed for it. Leave empty and the chart
  # derives it from ui.ingress (https://<first host> when TLS is configured) -
  # see railhook.appBaseUrl in templates/_helpers.tpl. Set it when browsers
  # reach Railhook by some other name than the ingress host.
  #
  # It is not optional in the way an empty default suggests: the application's
  # own fallback is http://localhost:5173, so a deployment that supplies
  # neither this nor an ingress host mails out links to the operator's laptop.
  baseUrl: ""

  # Browser origins allowed to call the API. Defaults to app.baseUrl above.
  # With APP_ENV=production (the default for both services), leaving the
  # application's own default in place is fatal, not cosmetic:
  # ProductionSafetyValidator refuses to start when CORS_ALLOWED_ORIGINS still
  # names localhost. Comma-separated for more than one origin.
  corsAllowedOrigins: ""

# API service configuration
api:
  replicaCount: 2
  image:
    # Published by .github/workflows/docker-publish.yml on every version tag
    # (multi-arch: linux/amd64, linux/arm64).
    #
    # Empty means "the chart's appVersion", so `helm install` of chart 2.6.1
    # runs the 2.6.1 images and `helm rollback` rolls the image back with it.
    # A literal `latest` decoupled the two: the chart claimed a version and
    # installed whatever GHCR last tagged, and IfNotPresent then kept serving a
    # stale image on nodes that already had one.
    repository: ghcr.io/vadymkykalo/railhook-api
    tag: ""
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8080
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  env:
    APP_ENV: production
    LOG_LEVEL: INFO
    WEBHOOK_ALLOW_PRIVATE_IPS: "false"
    SWAGGER_ENABLED: "false"
    DB_POOL_MAX_SIZE: "20"
    DB_POOL_MIN_IDLE: "15"
  
  # 8082, not 8080: actuator is served on MANAGEMENT_PORT (see
  # railhook.api.managementPort in templates/_helpers.tpl), and once it moves
  # there it is not on 8080 at all - probing 8080 would 404 forever. Same port
  # docker-compose.yml's api healthcheck uses.
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8082
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8082
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  
  pdb:
    enabled: false
    minAvailable: 1

# Worker service configuration
worker:
  replicaCount: 2
  image:
    # Published by .github/workflows/docker-publish.yml on every version tag
    # (multi-arch: linux/amd64, linux/arm64).
    #
    # Empty means "the chart's appVersion", so `helm install` of chart 2.6.1
    # runs the 2.6.1 images and `helm rollback` rolls the image back with it.
    # A literal `latest` decoupled the two: the chart claimed a version and
    # installed whatever GHCR last tagged, and IfNotPresent then kept serving a
    # stale image on nodes that already had one.
    repository: ghcr.io/vadymkykalo/railhook-worker
    tag: ""
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1536Mi
  
  env:
    APP_ENV: production
    LOG_LEVEL: INFO
    KAFKA_DELIVERY_CONCURRENCY: "8"
    DB_POOL_MAX_SIZE: "30"
    DB_POOL_MIN_IDLE: "20"
  
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8081
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8081
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
  
  pdb:
    enabled: false
    minAvailable: 1

# UI service configuration
ui:
  replicaCount: 2
  image:
    # Published by .github/workflows/docker-publish.yml on every version tag
    # (multi-arch: linux/amd64, linux/arm64).
    #
    # Empty means "the chart's appVersion", so `helm install` of chart 2.6.1
    # runs the 2.6.1 images and `helm rollback` rolls the image back with it.
    # A literal `latest` decoupled the two: the chart claimed a version and
    # installed whatever GHCR last tagged, and IfNotPresent then kept serving a
    # stale image on nodes that already had one.
    repository: ghcr.io/vadymkykalo/railhook-ui
    tag: ""
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80

  # The UI image's nginx.conf proxies to the literal hostname `api`, and nginx
  # refuses to start when a literal upstream does not resolve. This creates a
  # Service by that name alongside the release-prefixed one, so the image works
  # unchanged under both Compose and Helm. See the template for the full
  # reasoning and for why the name is namespace-scoped.
  apiUpstreamAlias:
    enabled: true
    name: api

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  
  # The image is nginx with `listen 5173` (webhook-platform-ui/nginx.conf), not
  # 80. Probing 80 meant readiness could never pass.
  livenessProbe:
    httpGet:
      path: /
      port: 5173
    initialDelaySeconds: 10
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /
      port: 5173
    initialDelaySeconds: 5
    periodSeconds: 5

  # The chart-wide podSecurityContext / securityContext below are written for
  # the Spring Boot images, whose Dockerfiles declare `USER appuser`. The UI is
  # stock nginx, which starts its master as root and drops privileges itself.
  # Handed runAsUser: 1001 and cap_drop ALL it cannot write /var/cache/nginx or
  # /var/run/nginx.pid and CrashLoops, so it gets its own pair — still
  # unprivileged, with the writable paths supplied as emptyDir in the
  # Deployment. Set either to null to fall back to the chart-wide values.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101      # the `nginx` user in nginx:alpine
    runAsGroup: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
  
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    hosts:
      - host: app.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: railhook-ui-tls
        hosts:
          - app.example.com

# PostgreSQL configuration
# This chart no longer ships a PostgreSQL subchart (was Bitnami,
# removed - see Chart.yaml). `enabled` now only selects which host/port
# templates.tpl reads (see railhook.postgresql.* in templates/_helpers.tpl);
# it does not deploy a database. Point `external` at your own instance -
# managed (RDS/Cloud SQL/etc.) for production, or your own StatefulSet/
# Docker container (postgres:16-alpine is what docker-compose.yml and CI
# test against) for a self-managed cluster.
postgresql:
  enabled: false
  # auth.* is read by templates/db-backup-cronjob.yaml as the primary
  # source for the backup job's DB name/user/secret (falling back to
  # external.* below) - kept even with the subchart gone.
  auth:
    username: webhook_user
    password: ""  # Use existingSecret instead
    database: railhook
    existingSecret: railhook-postgresql-secret

  # Bring-your-own PostgreSQL configuration (required - see the note above).
  external:
    host: ""  # e.g., postgres.example.com
    port: 5432
    database: railhook
    username: webhook_user
    existingSecret: railhook-postgresql-secret
    existingSecretPasswordKey: password

# Kafka configuration
# This chart no longer ships a Kafka subchart (was Bitnami, removed -
# see Chart.yaml; Bitnami had already dropped Kafka from its free catalog
# entirely). Point `external` at your own cluster - managed (MSK/Confluent
# Cloud/etc.) for production, or your own StatefulSet/Docker container
# (apache/kafka:3.7.0 is what docker-compose.yml and CI test against, and is
# also the image templates/kafka-topics-job.yaml itself uses to create
# topics) for a self-managed cluster.
kafka:
  enabled: false
  # Run the post-install hook that creates every topic the platform consumes,
  # at the partition count below. Turn it off for a managed cluster that
  # provisions topics out of band, or one whose ACLs don't let a client create
  # them. It is not gated on `enabled` above: with no subchart to enable, that
  # gate meant the job never ran at all.
  createTopics: true
  # Topic configuration - read by templates/kafka-topics-job.yaml.
  topicPartitions: 12  # Number of partitions for delivery topics
  topicReplicationFactor: 1  # Set to 3 for production multi-broker clusters

  # Bring-your-own Kafka configuration (required - see the note above).
  external:
    bootstrapServers: ""  # e.g., kafka-1:9092,kafka-2:9092,kafka-3:9092

# Redis configuration
# This chart no longer ships a Redis subchart (was Bitnami, removed -
# see Chart.yaml) - `enabled` therefore now defaults to false (it defaulted
# to true when a subchart still backed it). Point `external` at your own
# instance - managed (ElastiCache/Memorystore/etc.) for production, or your
# own StatefulSet/Docker container (redis:7-alpine is what
# docker-compose.yml and CI test against) for a self-managed cluster.
redis:
  enabled: false
  # auth.existingSecret* is read wherever Redis credentials are needed
  # regardless of `enabled` - kept even with the subchart gone.
  auth:
    enabled: true
    existingSecret: railhook-redis-secret
    existingSecretPasswordKey: password

  # Bring-your-own Redis configuration (required - see the note above).
  external:
    host: ""  # e.g., redis.example.com
    port: 6379
    existingSecret: railhook-redis-secret
    existingSecretPasswordKey: password

# Database backup configuration
backup:
  enabled: false  # Enable to create a CronJob for PostgreSQL backups
  schedule: "0 2 * * *"  # Daily at 2 AM UTC
  image: postgres:16-alpine
  retainCount: 7  # Keep last N backup files
  storageSize: 10Gi
  storageClass: ""  # Use default StorageClass if empty
  existingClaim: ""  # Use existing PVC instead of creating one
  activeDeadlineSeconds: 3600  # Max 1 hour for backup job
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Transactional email — verification, password-reset and invite mail.
#
# With email off, accounts are created already verified (there would be no way
# to deliver a verification link) and nobody can be invited to an organization.
# Turning it on without an SMTP relay is worse than leaving it off: signup
# accepts the account and then cannot mail the link, so supply smtp.host
# whenever enabled is true. Variable names match .env.dist / docker-compose.yml.
email:
  enabled: false
  from: noreply@example.com
  smtp:
    host: ""
    port: 587
    username: ""
    auth: true
    starttls: true
    # Secret holding the SMTP password under `existingSecretPasswordKey`.
    # Leave empty for a relay that takes no password (set auth: false too).
    existingSecret: ""
    existingSecretPasswordKey: smtp-password

# Secrets configuration
secrets:
  # Encryption key for webhook secrets (32 characters)
  encryptionKey:
    existingSecret: railhook-secrets
    key: encryption-key

  # Salt the encryption key is derived with. Required, with no default in
  # either application.yml — the api and worker fail to start without it, which
  # is how `helm install` used to produce two CrashLooping Deployments. Must be
  # the same value for both services and must never change after the first
  # write, or every endpoint secret already in the database decrypts to garbage.
  encryptionSalt:
    existingSecret: railhook-secrets
    key: encryption-salt

  # JWT secret for authentication
  jwtSecret:
    existingSecret: railhook-secrets
    key: jwt-secret

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Network Policy
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

# Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Monitoring (Prometheus Operator + Grafana)
monitoring:
  serviceMonitor:
    enabled: false  # Enable if using kube-prometheus-stack
    interval: 15s
    scrapeTimeout: 10s
    labels: {}  # e.g., release: prometheus
  prometheusRule:
    enabled: false  # Enable to deploy alert rules as PrometheusRule CRD
    labels: {}  # e.g., release: prometheus
  grafanaDashboards:
    enabled: false  # Enable to create ConfigMap with Grafana dashboards
    labels: {}  # e.g., grafana_dashboard: "1"

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
