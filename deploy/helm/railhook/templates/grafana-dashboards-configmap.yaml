{{- if .Values.monitoring.grafanaDashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "railhook.fullname" . }}-grafana-dashboards
  labels:
    {{- include "railhook.labels" . | nindent 4 }}
    {{- /* Merged, not appended: a user-set grafana_dashboard label would otherwise be a duplicate key. */}}
    {{- $labels := merge (dict) (.Values.monitoring.grafanaDashboards.labels | default dict) (dict "grafana_dashboard" "1") }}
    {{- toYaml $labels | nindent 4 }}
  annotations:
    grafana-folder: Railhook
data:
  {{- (.Files.Glob "dashboards/*.json").AsConfig | nindent 2 }}
{{- end }}
