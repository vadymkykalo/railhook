apiVersion: v1
kind: Service
metadata:
  name: {{ include "railhook.fullname" . }}-api
  labels:
    {{- include "railhook.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    # Actuator is unauthenticated, so it stays ClusterIP-only.
    - port: {{ include "railhook.api.managementPort" . }}
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "railhook.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
