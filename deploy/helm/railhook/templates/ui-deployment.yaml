apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "railhook.fullname" . }}-ui
  labels:
    {{- include "railhook.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "railhook.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "railhook.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "railhook.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.ui.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml (.Values.ui.podSecurityContext | default .Values.podSecurityContext) | nindent 8 }}
      containers:
        - name: ui
          securityContext:
            {{- toYaml (.Values.ui.securityContext | default .Values.securityContext) | nindent 12 }}
          image: "{{ .Values.global.imageRegistry }}{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          # Read by the container at startup and handed to the page as /config.js.
          env:
            - name: RAILHOOK_CONTACT_DOMAIN
              value: {{ .Values.ui.contactDomain | default "" | quote }}
            - name: RAILHOOK_SITE_URL
              value: {{ include "railhook.appBaseUrl" . | quote }}
            - name: RAILHOOK_CAPTCHA_SITE_KEY
              value: {{ .Values.ui.captcha.siteKey | default "" | quote }}
            - name: RAILHOOK_CAPTCHA_SCRIPT_URL
              value: {{ .Values.ui.captcha.scriptUrl | default "" | quote }}
            - name: RAILHOOK_WEB_ANALYTICS_TOKEN
              value: {{ .Values.ui.webAnalyticsToken | default "" | quote }}
            - name: RAILHOOK_STATUS_PAGE_URL
              value: {{ .Values.ui.statusPageUrl | default "" | quote }}
            - name: RAILHOOK_PUBLIC_TESTER
              value: {{ .Values.ui.publicTester | default false | quote }}
            - name: RAILHOOK_PUBLIC_DEMO
              value: {{ .Values.ui.publicDemo | default false | quote }}
            - name: RAILHOOK_PUBLIC_BLOG
              value: {{ .Values.ui.publicBlog | default false | quote }}
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.ui.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.ui.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          # nginx writes temp dirs and its pid file at startup; non-root cannot write them in the image.
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
