apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "railhook.fullname" . }}-api
  labels:
    {{- include "railhook.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "railhook.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "railhook.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "railhook.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- /*
        No migration initContainer: the api migrates at startup, and Flyway's advisory lock makes
        replicas starting together migrate exactly once.
      */}}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.global.imageRegistry }}{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: {{ include "railhook.api.managementPort" . }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "railhook.fullname" . }}-config
          env:
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret | default .Values.postgresql.external.existingSecret }}
                  key: {{ .Values.postgresql.external.existingSecretPasswordKey | default "password" }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.existingSecret | default .Values.redis.external.existingSecret }}
                  key: {{ .Values.redis.auth.existingSecretPasswordKey | default .Values.redis.external.existingSecretPasswordKey | default "password" }}
            - name: WEBHOOK_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.encryptionKey.existingSecret }}
                  key: {{ .Values.secrets.encryptionKey.key }}
            - name: WEBHOOK_ENCRYPTION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.encryptionSalt.existingSecret }}
                  key: {{ .Values.secrets.encryptionSalt.key }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jwtSecret.existingSecret }}
                  key: {{ .Values.secrets.jwtSecret.key }}
            {{- with .Values.email.smtp.existingSecret }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.email.smtp.existingSecretPasswordKey | default "smtp-password" }}
            {{- end }}
            {{- if and .Values.googleSignIn.clientId .Values.googleSignIn.existingSecret }}
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: {{ .Values.googleSignIn.clientId | quote }}
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.googleSignIn.existingSecret }}
                  key: {{ .Values.googleSignIn.existingSecretKey | default "client-secret" }}
            {{- end }}
            {{- with .Values.platformAdmin.emails }}
            - name: PLATFORM_ADMIN_EMAILS
              value: {{ . | quote }}
            {{- end }}
            # After the api.env range so a value there cannot override them: probes, the UI's
            # health proxy and the ServiceMonitor all need actuator bound here on every interface.
            - name: MANAGEMENT_PORT
              value: {{ include "railhook.api.managementPort" . | quote }}
            - name: MANAGEMENT_ADDRESS
              value: "0.0.0.0"
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
