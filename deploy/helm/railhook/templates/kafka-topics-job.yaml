{{- /*
  Guarded on createTopics and a known broker, not on kafka.enabled.

  It used to be `if .Values.kafka.enabled`, which never rendered anywhere it
  could work: enabled=false (the only supported setting since the subchart was
  dropped) skipped the job entirely, and enabled=true pointed
  railhook.kafka.bootstrapServers at an in-chart broker this chart no longer
  deploys. So the README's "topics are created automatically" was true of no
  configuration, and the apps were left relying on broker auto-create — which
  silently applies the broker's default partition count instead of
  kafka.topicPartitions.
*/}}
{{- if and .Values.kafka.createTopics (include "railhook.kafka.bootstrapServers" .) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "railhook.fullname" . }}-kafka-topics
  labels:
    {{- include "railhook.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      name: {{ include "railhook.fullname" . }}-kafka-topics
      labels:
        {{- include "railhook.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:3.7.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              KAFKA_SERVER="{{ include "railhook.kafka.bootstrapServers" . }}"
              PARTITIONS={{ .Values.kafka.topicPartitions | default 12 }}
              RF={{ .Values.kafka.topicReplicationFactor | default 1 }}
              
              echo "Creating Kafka topics with $PARTITIONS partitions, RF=$RF..."
              
              for topic in deliveries.dispatch deliveries.retry.1m deliveries.retry.5m deliveries.retry.15m deliveries.retry.1h deliveries.retry.6h deliveries.retry.24h deliveries.dlq incoming.forward.dispatch incoming.forward.retry incoming.forward.dlq; do
                /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server $KAFKA_SERVER \
                  --create \
                  --if-not-exists \
                  --topic $topic \
                  --partitions $PARTITIONS \
                  --replication-factor $RF || true
                echo "  ✓ $topic"
              done
              
              echo "All topics created successfully"
{{- end }}
