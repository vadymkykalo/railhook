{{- /*
  minAvailable and maxUnavailable are mutually exclusive, so maxUnavailable wins when set.
  minAvailable >= replicas blocks node drains outright.
*/}}
{{- range $component, $cfg := dict "api" .Values.api "worker" .Values.worker "ui" .Values.ui }}
{{- if and $cfg.pdb $cfg.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "railhook.fullname" $ }}-{{ $component }}
  labels:
    {{- include "railhook.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if $cfg.pdb.maxUnavailable }}
  maxUnavailable: {{ $cfg.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ $cfg.pdb.minAvailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "railhook.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
