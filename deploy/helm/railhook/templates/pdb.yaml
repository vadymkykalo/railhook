{{- /*
  PodDisruptionBudgets for api, worker and ui.

  values.yaml has exposed api.pdb / worker.pdb / ui.pdb since the chart was
  written, values-production.yaml turns all three on, and the README lists
  "PodDisruptionBudgets for HA" among what production mode gives you — but no
  template read any of it, so a node drain could take every replica of a
  service at once and nothing said otherwise. This is that template; the value
  keys are the ones that were already documented, not new ones.

  minAvailable and maxUnavailable are mutually exclusive in the API, so
  maxUnavailable wins when a caller sets it and minAvailable is the default
  otherwise. A PDB with minAvailable >= replicas blocks drains outright, which
  is why production pairs minAvailable: 2 with replicaCount: 3.
*/}}
{{- range $component, $cfg := dict "api" .Values.api "worker" .Values.worker "ui" .Values.ui }}
{{- if and $cfg.pdb $cfg.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "railhook.fullname" $ }}-{{ $component }}
  labels:
    {{- include "railhook.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if $cfg.pdb.maxUnavailable }}
  maxUnavailable: {{ $cfg.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ $cfg.pdb.minAvailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "railhook.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
