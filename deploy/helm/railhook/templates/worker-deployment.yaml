apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "railhook.fullname" . }}-worker
  labels:
    {{- include "railhook.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "railhook.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "railhook.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "railhook.serviceAccountName" . }}
      # Keep in step with docker-compose.yml's stop_grace_period; ShutdownBudgetTest checks it.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.global.imageRegistry }}{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports:
            - name: management
              containerPort: {{ include "railhook.worker.managementPort" . }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "railhook.fullname" . }}-config
          env:
            {{- range $key, $value := .Values.worker.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret | default .Values.postgresql.external.existingSecret }}
                  key: {{ .Values.postgresql.external.existingSecretPasswordKey | default "password" }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.existingSecret | default .Values.redis.external.existingSecret }}
                  key: {{ .Values.redis.auth.existingSecretPasswordKey | default .Values.redis.external.existingSecretPasswordKey | default "password" }}
            - name: WEBHOOK_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.encryptionKey.existingSecret }}
                  key: {{ .Values.secrets.encryptionKey.key }}
            # Must equal the api's value, or the two decrypt stored secrets differently.
            - name: WEBHOOK_ENCRYPTION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.encryptionSalt.existingSecret }}
                  key: {{ .Values.secrets.encryptionSalt.key }}
            # After the worker.env range so they cannot be overridden. The worker's own
            # MANAGEMENT_ADDRESS default is 127.0.0.1, which probes and scrapes cannot reach.
            - name: MANAGEMENT_PORT
              value: {{ include "railhook.worker.managementPort" . | quote }}
            - name: MANAGEMENT_ADDRESS
              value: "0.0.0.0"
          {{- with .Values.worker.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.worker.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.worker.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
