{{- if .Values.ui.apiUpstreamAlias.enabled }}
{{- /*
  The UI image's nginx proxies to the literal host `api` and will not start if it does not resolve.
  Per-namespace: two releases in one namespace collide here.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.ui.apiUpstreamAlias.name }}
  labels:
    {{- include "railhook.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-upstream-alias
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ include "railhook.api.managementPort" . }}
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "railhook.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
