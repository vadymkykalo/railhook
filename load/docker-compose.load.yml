# Needs WEBHOOK_ALLOW_PRIVATE_IPS=true on api and worker: the receiver has a private address.
services:
  load-receiver:
    image: node:20-alpine
    container_name: webhook-load-receiver
    working_dir: /app
    volumes:
      - ./load/receiver:/app:ro
    command: ["node", "server.js"]
    environment:
      PORT: 9000
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - webhook-network
    restart: unless-stopped
