<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Defaults before React mounts; nginx replaces site-url.railhook.invalid with RAILHOOK_SITE_URL. -->
    <meta name="description" content="Open-source webhook gateway. Send webhooks to your customers and receive them from Stripe, GitHub and the rest, with retries, signatures and every attempt on record. In our cloud or self-hosted." />
    <link rel="canonical" href="https://site-url.railhook.invalid/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Railhook" />
    <meta property="og:title" content="Railhook — Open-source webhook gateway" />
    <meta property="og:description" content="Open-source webhook gateway. Send webhooks to your customers and receive them from Stripe, GitHub and the rest, with retries, signatures and every attempt on record. In our cloud or self-hosted." />
    <meta property="og:url" content="https://site-url.railhook.invalid/" />
    <meta property="og:image" content="https://site-url.railhook.invalid/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Railhook — Open-source webhook gateway" />
    <meta name="twitter:description" content="Open-source webhook gateway. Send webhooks to your customers and receive them from Stripe, GitHub and the rest, with retries, signatures and every attempt on record. In our cloud or self-hosted." />
    <meta name="twitter:image" content="https://site-url.railhook.invalid/social-card.png" />
    <title>Railhook — Open-source webhook gateway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- No aggregateRating or review: there are none. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Railhook",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Any",
            "url": "https://site-url.railhook.invalid/",
            "description": "Open-source webhook gateway. Send webhooks to your customers and receive them from Stripe, GitHub and the rest, with retries, signatures and every attempt on record. In our cloud or self-hosted.",
            "license": "https://opensource.org/licenses/MIT",
            "codeRepository": "https://github.com/vadymkykalo/railhook",
            "publisher": { "@id": "https://site-url.railhook.invalid/#organization" },
            "offers": [
              { "@type": "Offer", "name": "Railhook Cloud Free", "price": "0", "priceCurrency": "USD", "url": "https://site-url.railhook.invalid/pricing" }
            ]
          },
          {
            "@type": "Organization",
            "@id": "https://site-url.railhook.invalid/#organization",
            "name": "Railhook",
            "url": "https://site-url.railhook.invalid/",
            "logo": "https://site-url.railhook.invalid/favicon.svg",
            "sameAs": ["https://github.com/vadymkykalo/railhook"]
          }
        ]
      }
    </script>
    <!-- A classic script, so it runs before the deferred app module reads window.__RAILHOOK__. -->
    <script src="/config.js"></script>
    <script src="/analytics.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
