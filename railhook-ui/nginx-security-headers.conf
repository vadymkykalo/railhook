# Security headers, included at server level and again in every location that sets an
# add_header of its own: nginx inherits add_header into a location only when that location
# sets none, so a Cache-Control header there silently dropped all of these.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
