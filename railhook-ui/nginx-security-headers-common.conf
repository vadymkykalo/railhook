# The security headers every page gets, framing aside. security-headers.conf adds
# X-Frame-Options to these for everything but the customer portal, which is the one page another
# site may embed and sets its own frame-ancestors instead (see its location in nginx.conf).
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
