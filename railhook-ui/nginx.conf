server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects carry a path, not an origin. This nginx listens on 5173 behind whatever
    # publishes it (RAILHOOK_PORT, Caddy, an ingress), so an absolute Location would name a
    # port and scheme the browser cannot reach.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers. Repeated in every location below that adds a header of its own,
    # because such a location inherits none of these.
    include /etc/nginx/snippets/security-headers.conf;

    # No Content-Security-Policy here, deliberately.
    #
    # src/lib/csp.ts writes one as a meta tag, from the container's runtime config: it widens
    # script-src, frame-src and connect-src to the CAPTCHA's origin when a site key is set, derived
    # from the script URL so the two cannot disagree. A
    # browser handed both a header and a meta tag enforces the intersection, so the static
    # `script-src 'self'` that used to sit here silently cancelled all of that — the widget would
    # have been blocked even once the site key reached the bundle. Two policies, one of which
    # cannot see the configuration, is one policy too many.
    #
    # X-Frame-Options stays below rather than moving into the meta tag: frame-ancestors is
    # ignored in a meta tag by specification, so this header is what actually stops framing.

    # A year-long immutable cache only where the file name carries a content hash: Vite's /assets/
    # and Astro's /docs/_astro/. A new release means new names, so nothing stale is ever reused.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /docs/_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # Everything else that is static keeps its name across releases — the favicon, og-image, logos,
    # the docs' openapi.yaml. It revalidates (a cheap 304) instead: marked immutable, a browser that
    # had seen the old file went on showing it after a deploy replaced it.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # The public origin, substituted into what the build could not know it for.
    #
    # The image is built once for every deployment, so the canonical link, og:url and og:image,
    # the schema.org block, the sitemaps and robots.txt carry the placeholder origin
    # https://site-url.railhook.invalid instead. The two locations that serve those files replace
    # it with this, which the entrypoint writes from RAILHOOK_SITE_URL — or with nothing, leaving
    # a relative URL, when no origin is configured. The default keeps nginx from ever meeting an
    # undefined variable.
    set $railhook_site_url "";
    include /tmp/railhook-site.conf;

    # Which release this container serves, as plain text, so a deploy can prove the new one is
    # live rather than only that something answers.
    location = /version.txt {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files /version.txt =404;
    }

    # window.__RAILHOOK__: the settings that belong to this container rather than to the image,
    # written into /tmp by the entrypoint when the container starts. Never cached, because it
    # changes with the container and not with the release. An exact match, so it wins over the
    # extension regex above and over the empty placeholder the build leaves in the web root.
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        alias /tmp/railhook-config.js;
    }

    # Docker's embedded DNS, and the reason every proxy_pass below goes through a
    # variable.
    #
    # nginx resolves a name in a literal proxy_pass exactly once, at startup, and holds
    # that address for the life of the process. A recreated container comes back on a new
    # IP, so nginx kept posting to one that no longer answered: measured at 32 seconds of
    # 502 on an ordinary `up -d api`, which is not the API starting — it is nginx holding
    # a dead address. With a variable the name is resolved per request instead, honouring
    # the TTL below, and a replaced container is picked up within it.
    #
    # valid=5s rather than nginx's default of the record's own TTL: Docker publishes 600s,
    # which would put the old behaviour back with extra steps.
    #
    # Written at container start by docker-entrypoint.d/15-resolver.sh, and included
    # rather than substituted in place.
    #
    # The address cannot be baked in: Compose gives every container 127.0.0.11 and
    # Kubernetes gives it the cluster DNS service, whose address differs per cluster.
    # Hardcoding Docker's made every lookup fail under Helm and served 502 for everything.
    #
    # It cannot be patched into this file either. The chart runs this pod with a read-only
    # root filesystem — which is right, and not worth weakening for a config line — so
    # `sed -i` here fails with "Permission denied" and nginx starts with a placeholder it
    # cannot parse. /tmp is writable in both, because the chart mounts it.
    # Defaults, so nginx never meets an undefined variable. The include below overrides
    # them with the name that actually resolves here — under Kubernetes that is the
    # fully-qualified one, because nginx's own resolver applies no search list.
    set $api_backend  "api:8080";
    set $api_actuator "api:8082";

    include /tmp/railhook-resolver.conf;

    # Reverse-proxy API requests to the backend
    location /api/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket tunnel — requires Upgrade headers for wss:// support
    location /ws/tunnel {
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Tunnel ingress — public HTTP requests forwarded to CLI tunnels
    location /tunnel/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    # Webhook capture endpoints
    location /hook/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Incoming webhook ingress
    location /ingress/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 8082, not 8080: the API splits actuator onto MANAGEMENT_PORT so that health
    # and metrics stay reachable without passing through the JWT/API-key security
    # chain. Pointing these at 8080 — as they used to — returns 404, because
    # nothing serves actuator there once the ports are split.
    location /actuator/health {
        proxy_pass http://$api_actuator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Metrics are deliberately NOT proxied. This nginx is the only thing bound to
    # the host, so anything routed here is public; Prometheus scrapes api:8082
    # over the private Docker network instead (monitoring/prometheus/prometheus.yml).
    # A metrics endpoint on the public port would leak endpoint names, tenant
    # cardinality and traffic volume to anyone who asked.

    location /actuator/ {
        deny all;
        return 404;
    }

    # The installer, as plain text: `curl -fsSL https://<host>/install.sh | bash`. Never cached,
    # so a fixed installer reaches the next person who runs it. /install is the same file.
    location = /install.sh {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /install.sh =404;
    }

    # The CLI's installer, served the same way: `curl -fsSL https://<host>/install-cli.sh | bash`.
    location = /install-cli.sh {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /install-cli.sh =404;
    }

    location = /install {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /install.sh =404;
    }

    # The docs: a static Starlight site (railhook-docs/) copied to /usr/share/nginx/html/docs.
    # Every page is a directory with an index.html, and every link is written with the trailing
    # slash, so /docs itself is the only address that needs sending to its canonical form.
    location = /docs {
        return 301 /docs/;
    }

    # No SPA fallback here: a docs URL that is not a page is the docs' own 404, not the app shell.
    #
    # Hashed assets under /docs/_astro/ have their own location above. HTML, the copied
    # openapi.yaml and the search index are unhashed and must revalidate.
    #
    # No Content-Security-Policy is set for the docs, as none is set at server level (see
    # above), so nothing here loosens one; Starlight's inline theme script and Pagefind's wasm
    # need no exemption.
    location /docs/ {
        try_files $uri $uri/index.html =404;
        error_page 404 /docs/404.html;
        sub_filter 'https://site-url.railhook.invalid' $railhook_site_url;
        sub_filter_once off;
        sub_filter_types text/xml application/xml text/plain;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Pagefind's loader (pagefind.js) is not content-hashed, so it must not inherit the asset
    # regex's year-long immutable cache; ^~ keeps that regex from matching here.
    location ^~ /docs/pagefind/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # There are no paid plans to price. Old links land where the router sends them, and a crawler
    # learns the page moved instead of indexing a copy of the landing page at a second address.
    location = /pricing {
        return 301 /#run;
    }

    # The app's own routes: the shell, which React routes. One alternation per top-level route
    # in src/router.tsx (nginxRoutes.test.ts fails when a new one is missing here). They are
    # sign-in and dashboard screens with nothing to index — already disallowed in robots.txt —
    # and the shell's static head is the landing page's, so they are marked noindex as well.
    location ~ ^/(accept-invite|admin|auth|cancel-email-change|confirm-email-change|device|forgot-password|login|register|reset-password|shared|verify-email)(/|$) {
        try_files /index.html =404;
        sub_filter 'https://site-url.railhook.invalid' $railhook_site_url;
        sub_filter_once off;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Prerendered pages are directories: dist/contact/index.html.
    #
    # `$uri/index.html` rather than `$uri/`: the directory form makes nginx 301 to a trailing
    # slash, so /contact — the URL in the sitemap, in the canonical tag and in every link —
    # answered with a redirect to a second URL for the same page. Naming the index file serves
    # it directly, at the address it was advertised at.
    #
    # Anything else is not a page, and says so: 404, with the app shell as its body so React
    # still renders its not-found screen. It used to answer 200 with the landing page, which a
    # crawler reads as the landing page duplicated at every address anyone ever linked to.
    # `error_page 404 /index.html` (a URI, not `=`) keeps the 404 status.
    location / {
        try_files $uri $uri/index.html =404;
        error_page 404 /index.html;

        # The pages, sitemap.xml and robots.txt all come through here (none matches the
        # extension regex above). text/html is always filtered; these are the other two.
        sub_filter 'https://site-url.railhook.invalid' $railhook_site_url;
        sub_filter_once off;
        sub_filter_types text/xml application/xml text/plain;

        # No cached HTML. The asset filenames are hashed, so a stale document is the one thing
        # that can pin a browser to a deploy that no longer exists — and with the pages
        # prerendered there is now real content in them to go stale.
        #
        # Here rather than in a `location ~* \.html$`: try_files serves $uri/index.html from
        # within this location without re-matching, so a regex location for .html never sees
        # the request. Assets are unaffected — their own regex location is matched first and
        # keeps its `expires 1y`.
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
