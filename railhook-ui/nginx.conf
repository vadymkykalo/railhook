# Portal frame-ancestors from ?origin=; the portal re-checks it against the session once the token is verified.
# Matched raw and percent-encoded; only origin characters pass, so nothing can close the header.
map $arg_origin $portal_frame_ancestors {
    default                                                              "https: http://localhost:* http://127.0.0.1:*";
    "~^(?<portal_origin>https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?)$"               $portal_origin;
    "~^(?<portal_origin>http://(?:localhost|127\.0\.0\.1)(?::[0-9]{1,5})?)$"    $portal_origin;
    "~*^https%3A%2F%2F(?<portal_host>[A-Za-z0-9.-]+)$"                          https://$portal_host;
    "~*^https%3A%2F%2F(?<portal_host>[A-Za-z0-9.-]+)%3A(?<portal_port>[0-9]{1,5})$"    https://$portal_host:$portal_port;
}

map $railhook_blog $railhook_sitemap {
    on       /sitemap.xml;
    default  /sitemap-without-blog.xml;
}

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects: behind a proxy an absolute Location names an unreachable port.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # No CSP header: csp.ts sets a meta one, and a header plus a meta tag enforce their intersection.
    # X-Frame-Options stays a header: frame-ancestors is ignored in a meta tag.

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /docs/_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # Unhashed names revalidate: marked immutable, browsers kept old files after a deploy.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Replaces the build's placeholder origin; the entrypoint writes it from RAILHOOK_SITE_URL.
    set $railhook_site_url "";
    set $railhook_blog "off";
    include /tmp/railhook-site.conf;

    location = /version.txt {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files /version.txt =404;
    }

    # Changes per container, not per release, so never cached.
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        alias /tmp/railhook-config.js;
    }

    # Variables make nginx re-resolve per request; a literal resolves once and 502s after a container is recreated.
    # Defaults; 15-resolver.sh's include overrides them.
    set $api_backend  "api:8080";
    set $api_actuator "api:8082";

    include /tmp/railhook-resolver.conf;

    location /api/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /mcp {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # A regex above the app-route regex: /oauth/consent is the app's own screen.
    location ~ ^/oauth/(authorize|token|register|revoke)$ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ^~ so the hidden-file regex never sees these dot-paths.
    location ^~ /.well-known/oauth- {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /ws/tunnel {
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /tunnel/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    location /hook/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ingress/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator is on MANAGEMENT_PORT, outside the JWT/API-key chain.
    location /actuator/health {
        proxy_pass http://$api_actuator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Metrics deliberately not proxied: this port is public; Prometheus scrapes api:8082 privately.

    location /actuator/ {
        deny all;
        return 404;
    }

    location = /install.sh {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /install.sh =404;
    }

    location = /install-cli.sh {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /install-cli.sh =404;
    }

    location = /install {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /install.sh =404;
    }

    location = /docs {
        return 301 /docs/;
    }

    location ~ ^/changelog/?$ {
        return 301 https://github.com/vadymkykalo/railhook/blob/main/CHANGELOG.md;
    }

    location ~ ^/(about|contact)/?$ {
        return 301 /;
    }

    location ~ ^/security/?$ {
        return 301 /docs/outgoing/endpoint-security/;
    }

    # Exact matches: the ^~ /blog prefix below would stop nginx before any regex.
    location = /blog/building-production-software-with-ai-agents {
        return 301 /blog;
    }

    location = /blog/building-production-software-with-ai-agents/ {
        return 301 /blog;
    }

    location /docs/ {
        try_files $uri $uri/index.html =404;
        error_page 404 /docs/404.html;
        sub_filter 'https://site-url.railhook.invalid' $railhook_site_url;
        sub_filter_once off;
        sub_filter_types text/xml application/xml text/plain;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # pagefind.js isn't content-hashed; ^~ keeps the immutable asset regex off it.
    location ^~ /docs/pagefind/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The only page without X-Frame-Options: it is meant to be embedded (frame-ancestors from the map above).
    location = /portal {
        try_files /index.html =404;
        sub_filter 'https://site-url.railhook.invalid' $railhook_site_url;
        sub_filter_once off;
        add_header Content-Security-Policy "frame-ancestors $portal_frame_ancestors" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers-common.conf;
    }

    # One alternation per top-level route in router.tsx (nginxRoutes.test.ts); noindex as the shell's head is the landing page's.
    location ~ ^/(accept-invite|admin|auth|cancel-email-change|confirm-email-change|demo|device|forgot-password|login|oauth|register|reset-password|shared|verify-email)(/|$) {
        try_files /index.html =404;
        sub_filter 'https://site-url.railhook.invalid' $railhook_site_url;
        sub_filter_once off;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # $uri/index.html, not $uri/: the directory form 301s to a trailing slash.
    # Unknown paths 404 with the shell as body; a 200 looked like duplicate landing pages to crawlers.
    location / {
        try_files $uri $uri/index.html =404;
        error_page 404 /index.html;

        sub_filter 'https://site-url.railhook.invalid' $railhook_site_url;
        sub_filter_once off;
        sub_filter_types text/xml application/xml text/plain;

        # No cached HTML; set here because try_files never re-matches into a .html location.
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Off unless BLOG_ENABLED; ^~ so the static-file regex can't serve its images while off.
    location ^~ /blog {
        if ($railhook_blog != "on") {
            return 404;
        }
        try_files $uri $uri/index.html =404;
        error_page 404 /index.html;

        sub_filter 'https://site-url.railhook.invalid' $railhook_site_url;
        sub_filter_once off;
        sub_filter_types text/xml application/xml application/rss+xml text/plain;

        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /sitemap.xml {
        try_files $railhook_sitemap =404;

        sub_filter 'https://site-url.railhook.invalid' $railhook_site_url;
        sub_filter_once off;
        sub_filter_types text/xml application/xml text/plain;

        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
