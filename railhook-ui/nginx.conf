server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none';" always;

    # Cache static assets (js, css, images) — hashed filenames from Vite
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Reverse-proxy API requests to the backend
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket tunnel — requires Upgrade headers for wss:// support
    location /ws/tunnel {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Tunnel ingress — public HTTP requests forwarded to CLI tunnels
    location /tunnel/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    # Webhook capture endpoints
    location /hook/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Incoming webhook ingress
    location /ingress/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 8082, not 8080: the API splits actuator onto MANAGEMENT_PORT so that health
    # and metrics stay reachable without passing through the JWT/API-key security
    # chain. Pointing these at 8080 — as they used to — returns 404, because
    # nothing serves actuator there once the ports are split.
    location /actuator/health {
        proxy_pass http://api:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Metrics are deliberately NOT proxied. This nginx is the only thing bound to
    # the host, so anything routed here is public; Prometheus scrapes api:8082
    # over the private Docker network instead (monitoring/prometheus/prometheus.yml).
    # A metrics endpoint on the public port would leak endpoint names, tenant
    # cardinality and traffic volume to anyone who asked.

    location /actuator/ {
        deny all;
        return 404;
    }

    # Prerendered pages are directories: dist/pricing/index.html, dist/docs/retries/index.html.
    #
    # `$uri/index.html` rather than `$uri/`: the directory form makes nginx 301 to a trailing
    # slash, so /pricing — the URL in the sitemap, in the canonical tag and in every link —
    # answered with a redirect to a second URL for the same page. Naming the index file serves
    # it directly, at the address it was advertised at. Anything with no prerendered file
    # still falls through to the app shell.
    location / {
        try_files $uri $uri/index.html /index.html;

        # No cached HTML. The asset filenames are hashed, so a stale document is the one thing
        # that can pin a browser to a deploy that no longer exists — and with the pages
        # prerendered there is now real content in them to go stale.
        #
        # Here rather than in a `location ~* \.html$`: try_files serves $uri/index.html from
        # within this location without re-matching, so a regex location for .html never sees
        # the request. Assets are unaffected — their own regex location is matched first and
        # keeps its `expires 1y`.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
